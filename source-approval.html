<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSportsX Source Approval</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#8b949e}.row{display:flex;gap:10px;align-items:center}.row>div{flex:1}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;color:#fff;background:#238636}.reject{background:#da3633}.secondary{background:#30363d}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#21262d;margin-right:6px}.ok{color:#3fb950}.bad{color:#f85149}.warn{color:#d29922}@media(max-width:650px){.row{flex-direction:column;align-items:stretch}}</style></head><body><main class="wrap"><h1>🏆 XSPORTSX Source Approval</h1><p class="muted">This approval list is tied to your XSportsX addon configuration, so devices using the same addon configuration share the same approval state.</p><div id="status" class="card"><span class="warn">Loading sources…</span></div><div id="pending"></div><h2>Approved</h2><div id="approved"></div></main><script>const api=location.pathname;let db={pending:[],approved:[]};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(x,i,p){return `<div class=card><div class=row><div><span class=pill>${esc(x.type||'source')}</span>${x.healthy?'<span class=ok>✓ HEALTHY</span>':'<span class=bad>✕ NOT HEALTHY</span>'}<br><br><b>${esc(x.url)}</b><br><span class=muted>${x.details?esc(x.details):'Discovered source'}${x.latencyMs!=null?` • ${x.latencyMs}ms`:''}</span></div>${p?`<button class=btn onclick="act('approve','${encodeURIComponent(x.url)}')">✓ Approve</button><button class="btn reject" onclick="act('reject','${encodeURIComponent(x.url)}')">✕ Reject</button>`:`<button class="btn secondary" onclick="act('revoke','${encodeURIComponent(x.url)}')">Revoke</button>`}</div></div>`}function render(){document.getElementById('status').innerHTML='<span class=ok>✓ Synced with XSportsX</span>';document.getElementById('pending').innerHTML=db.pending.length?'<h2>Needs Approval</h2>'+db.pending.map((x,i)=>card(x,i,true)).join(''):'<div class=card><span class=ok>✓ No sources waiting for approval.</span></div>';document.getElementById('approved').innerHTML=db.approved.length?db.approved.map((x,i)=>card(x,i,false)).join(''):'<div class=card><span class=muted>No approved sources yet.</span></div>'}async function load(){try{const r=await fetch(api,{cache:'no-store'});db=await r.json();if(!r.ok)throw Error(db.error||'Unable to load source state');render()}catch(e){document.getElementById('status').innerHTML='<span class=bad>✕ '+esc(e.message)+'</span>'}}async function act(action,encoded){try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,url:decodeURIComponent(encoded)})});const j=await r.json();if(!r.ok)throw Error(j.error||'Action failed');db=j;render()}catch(e){alert(e.message)}}load();setInterval(load,30000)</script></body></html>
