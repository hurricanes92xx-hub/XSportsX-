<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSportsX Sources</title><style>body{font:15px system-ui;background:#0d1117;color:#e6edf3;max-width:900px;margin:24px auto;padding:0 16px}h1{margin-bottom:4px}.muted{color:#8b949e}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:12px 0}input,select{width:100%;box-sizing:border-box;background:#0d1117;color:inherit;border:1px solid #30363d;border-radius:8px;padding:11px;margin:6px 0 12px}button{background:#238636;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700}button.secondary{background:#30363d}.row{display:flex;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0d1117;border-radius:8px;padding:12px}.ok{color:#3fb950}.bad{color:#f85149}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}}</style></head><body><h1>🏆 XSPORTSX Sources</h1><p class="muted">Manage sources you are authorized to use. Add a playlist, Xtream endpoint, portal URL, or direct source and health-check it.</p><div class="card"><label>Source URL</label><input id="url" placeholder="https://your-authorized-source.example/..."/><label>Type</label><select id="type"><option value="auto">Auto detect</option><option value="m3u">M3U / M3U8</option><option value="xtream">Xtream</option><option value="stalker">Stalker / Portal</option><option value="direct">Direct URL</option></select><div class="row"><button onclick="addSource()">+ Add & Check Source</button><button class="secondary" onclick="refreshAll()">Refresh Sources</button></div></div><div class="grid"><div class="stat">Configured<br><b id="configured">0</b></div><div class="stat">Healthy<br><b class="ok" id="healthy">0</b></div><div class="stat">Failed<br><b class="bad" id="failed">0</b></div></div><div id="list"></div><script>const key='xsportsx-approved-sources';let sources=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(sources))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('configured').textContent=sources.length;document.getElementById('healthy').textContent=sources.filter(x=>x.ok).length;document.getElementById('failed').textContent=sources.filter(x=>!x.ok).length;document.getElementById('list').innerHTML=sources.map((x,i)=>`<div class=card><div class=row><div style="flex:1"><b>${esc(x.type.toUpperCase())}</b> — ${x.ok?'<span class=ok>✓ HEALTHY</span>':'<span class=bad>✕ FAILED</span>'}<br><span class=muted>${esc(x.url)}</span><br>${x.status??'ERR'} • ${x.latencyMs??'-'}ms</div><button class=secondary onclick="removeSource(${i})">Remove</button></div></div>`).join('')}async function addSource(){const url=document.getElementById('url').value.trim();if(!/^https?:\/\//i.test(url))return alert('Enter an HTTP(S) URL.');const type=document.getElementById('type').value;const item={url,type,ok:false,status:null,latencyMs:null};sources.unshift(item);save();render();await check(item);save();render()}async function check(x){try{const r=await fetch('/tools/base64/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({site:x.url,health:true})});const j=await r.json();x.ok=!!r.ok&&j.ok===true;x.status=r.status;x.latencyMs=null;x.links=(j.links||[]).filter(v=>v.ok).length;x.decodedCount=j.decodedCount||0;x.linkCount=j.linkCount||0}catch(e){x.ok=false;x.status=null;x.error=e.message}}async function refreshAll(){for(const x of sources)await check(x);save();render()}function removeSource(i){sources.splice(i,1);save();render()}render();</script></body></html>
