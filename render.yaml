services:
  - type: web
    name: xsportsx
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run check && node apply-public-sources.js && python3 patch_wwe_backend.py && node --check hotfix-entry.js && node --check artwork.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: XTREAM_BASE_URL
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: XSPORTSX_CONFIG_SECRET
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SCOREBOARD_TTL_SECONDS
        value: "60"
      - key: REQUEST_TIMEOUT_MS
        value: "8000"
      - key: PUBLIC_SOURCE_CACHE_TTL_SECONDS
        value: "900"
      - key: PUBLIC_SOURCE_HEALTH_TTL_SECONDS
        value: "120"
      - key: PUBLIC_SOURCE_HEALTH_TIMEOUT_MS
        value: "3500"
      - key: PUBLIC_SOURCE_MAX_BYTES
        value: "30000000"

  - type: web
    name: xsportsx-sports-source
    runtime: node
    plan: free
    branch: android-app
    autoDeploy: true
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: XTREAM_BASE_URL
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: NCAA_API_BASE_URL
        value: "https://ncaa-api.henrygd.me"
      - key: SCHEDULE_TTL_SECONDS
        value: "60"
      - key: XTREAM_TTL_SECONDS
        value: "300"
      - key: REQUEST_TIMEOUT_MS
        value: "8000"

  # Dedicated live-status engine. This is intentionally a separate paid web
  # service so it stays running continuously and never competes with the app UI.
  - type: web
    name: xsportsx-live-always-on
    runtime: node
    plan: starter
    branch: android-app
    autoDeploy: true
    buildCommand: npm install
    startCommand: node live-always-on.js
    healthCheckPath: /health
    envVars:
      - key: LIVE_POLL_MS
        value: "30000"
      - key: LIVE_REQUEST_TIMEOUT_MS
        value: "7000"
