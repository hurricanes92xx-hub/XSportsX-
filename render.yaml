services:
  - type: web
    name: xsportsx
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node bootstrap.js
    healthCheckPath: /health
    envVars:
      - key: XTREAM_BASE_URL
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: XSPORTSX_CONFIG_SECRET
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SCOREBOARD_TTL_SECONDS
        value: "60"
      - key: REQUEST_TIMEOUT_MS
        value: "8000"
