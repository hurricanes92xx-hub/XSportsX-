services:
  - type: web
    name: xsportsx
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run check && node apply-public-sources.js && node --check hotfix-entry.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: XTREAM_BASE_URL
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: XSPORTSX_CONFIG_SECRET
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SCOREBOARD_TTL_SECONDS
        value: "60"
      - key: REQUEST_TIMEOUT_MS
        value: "8000"
      - key: PUBLIC_SOURCE_CACHE_TTL_SECONDS
        value: "900"
      - key: PUBLIC_SOURCE_HEALTH_TTL_SECONDS
        value: "120"
      - key: PUBLIC_SOURCE_HEALTH_TIMEOUT_MS
        value: "3500"
      - key: PUBLIC_SOURCE_MAX_BYTES
        value: "30000000"
