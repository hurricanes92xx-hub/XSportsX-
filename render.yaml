services:
  - type: web
    name: xsportsx-sports-source
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: XTREAM_BASE_URL
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: NCAA_API_BASE_URL
        value: "https://ncaa-api.henrygd.me"
      - key: SCHEDULE_TTL_SECONDS
        value: "60"
      - key: REQUEST_TIMEOUT_MS
        value: "8000"
