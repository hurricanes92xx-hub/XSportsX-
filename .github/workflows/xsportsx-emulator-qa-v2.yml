name: XSportsX Emulator QA v2

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-emulator-qa-v2.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-emulator-qa-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Apply production UI and sports patches
        shell: bash
        run: |
          set -euo pipefail
          run_patch() {
            local label="$1"; shift; local log rc
            log=$(mktemp)
            echo "::group::${label}"
            if "$@" > >(tee "$log") 2>&1; then rc=0; else rc=$?; fi
            if [ "$rc" -ne 0 ]; then
              if grep -Fq 'canonical key anchor not found' "$log"; then
                echo "::warning::Ignored obsolete canonical-logo anchor failure from ${label}; post-patch build decides health."
              else
                cat "$log"; echo "::endgroup::"; rm -f "$log"; return "$rc"
              fi
            fi
            echo "::endgroup::"; rm -f "$log"
          }
          [ ! -f scripts/patch_tv_navigation.py ] || run_patch tv-navigation python3 scripts/patch_tv_navigation.py
          [ ! -f scripts/patch_college_favorites.py ] || run_patch college-favorites python3 scripts/patch_college_favorites.py
          run_patch sports-badges python3 scripts/patch_sports_badges.py
          run_patch network-patch python3 .github/patch_networks.py
          run_patch pregame-window python3 scripts/patch_pregame_window.py
          run_patch league-routing python3 scripts/patch_league_routing.py
          run_patch verified-logos python3 scripts/patch_verified_sports_logos_wwe.py
          run_patch ncaa-volleyball-badge python3 scripts/patch_ncaavb_badge.py
          run_patch public-free-sources python3 scripts/patch_public_free_sources.py
          run_patch top-sports-routing python3 scripts/patch_top_sports_routing.py
          run_patch real-brand-logos python3 scripts/patch_real_brand_logos.py
          run_patch wrestling-schedule python3 scripts/patch_wrestling_schedule.py
          run_patch college-schedule-ui python3 scripts/patch_college_schedule_ui.py
          run_patch yearly-schedule python3 scripts/patch_yearly_schedule_window.py
          run_patch special-schedule python3 scripts/patch_special_schedule_feed.py
          run_patch pro-wrestling python3 scripts/patch_pro_wrestling_schedule.py
          run_patch schedule-coverage python3 scripts/patch_schedule_coverage.py
          run_patch official-ncaa-sources python3 scripts/patch_official_ncaa_schedule_sources.py
          run_patch schedule-backups python3 scripts/patch_schedule_backup_sources.py
          run_patch schedule-ui-fix python3 scripts/fix_schedule_ui_build.py
          run_patch schedule-performance python3 scripts/patch_schedule_performance.py
          run_patch remove-unbacked-sports python3 scripts/patch_remove_unbacked_sports.py
          run_patch bundled-brand-assets python3 scripts/fetch_brand_logo_pack.py
          run_patch unified-logo-cards python3 scripts/patch_unified_logo_cards.py
          run_patch verify-yearly-policy python3 scripts/verify_yearly_schedule_policy.py
          run_patch verify-logo-catalog python3 scripts/verify_logo_catalog.py
          run_patch finalize-wrestling python3 scripts/finalize_wrestling_build.py
          for logo in nfl nba ncaa mlb nhl ufc premierleague espn cbs wwe aew tna fs1 acc sec; do test -s "app/src/main/assets/brand_logos/$logo.svg"; done
          ! grep -Rqs 'a\.espncdn\.com/i/teamlogos/leagues' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          ! grep -Rqs 'SportVisual("ESPORTS"' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'SportVisual("ACTION SPORTS"' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'uww\.org' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'NCAA WRESTLING' app/src/main/java/com/xsportsx/app
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
          ! grep -Eq 'XNetwork\("[^"]+"[^)]*https?://' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          ! grep -Eq 'SportVisual\("[^"]+"[^)]*https?://' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'TSDB_LONG_TAIL_BACKUP_V1' app/src/main/java/com/xsportsx/app/SportsScheduleService.kt
      - name: Build debug APKs
        shell: bash
        run: gradle clean :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve downloaded mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "MOBILE_APK=$APK" >> "$GITHUB_ENV"
          echo "Resolved mobile APK: $APK"
      - name: Probe public schedules outside emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_public_schedule_probe.py public-schedule-mobile.json
      - name: Run mobile emulator regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -eu
            python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
            QA_SERVER_PID=$!
            trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8765/health >/dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:8765/health >/dev/null
            curl -fsS http://10.0.2.2:8765/health >/dev/null
            bash scripts/qa_regression_test.sh "$MOBILE_APK" test-output-mobile
        env:
          QA_MODE: mobile
          QA_SOURCE_BASE: http://10.0.2.2:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-emulator-qa-${{ github.sha }}
          path: |
            test-output-mobile/**
            qa-source.log
            public-schedule-mobile.json
          if-no-files-found: ignore

  tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve downloaded TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "TV_APK=$APK" >> "$GITHUB_ENV"
          echo "Resolved TV APK: $APK"
      - name: Probe public schedules outside emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_public_schedule_probe.py public-schedule-tv.json
      - name: Run TV emulator regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -eu
            python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
            QA_SERVER_PID=$!
            trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8765/health >/dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:8765/health >/dev/null
            curl -fsS http://10.0.2.2:8765/health >/dev/null
            bash scripts/qa_regression_test.sh "$TV_APK" test-output-tv
        env:
          QA_MODE: tv
          QA_SOURCE_BASE: http://10.0.2.2:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-emulator-qa-${{ github.sha }}
          path: |
            test-output-tv/**
            qa-source.log
            public-schedule-tv.json
          if-no-files-found: ignore
