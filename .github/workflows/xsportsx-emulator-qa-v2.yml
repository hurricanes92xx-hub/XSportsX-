name: XSportsX Emulator QA

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-emulator-qa-v2.yml'

permissions:
  contents: write

concurrency:
  group: xsportsx-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Preflight emulator QA scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run_emulator_regression_v2.sh
          bash -n scripts/qa_regression_test_v2.sh
          python3 -m py_compile scripts/qa_source_probe.py scripts/qa_public_schedule_probe.py
          echo "QA script syntax preflight passed"
      - name: Verify committed sports assets and routing
        shell: bash
        run: |
          set -euo pipefail
          for logo in nfl nba ncaa mlb nhl ufc premierleague espn cbs wwe aew tna fs1 acc sec; do test -s "app/src/main/assets/brand_logos/$logo.svg"; done
          grep -q 'TSDB_LONG_TAIL_BACKUP_V1' app/src/main/java/com/xsportsx/app/SportsScheduleService.kt
          grep -q 'FAVORITES' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'SCAN QR CODE' app/src/main/java/com/xsportsx/app/TvSourceChooser.kt
          grep -q 'M3U playlist URL' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          grep -q 'Xtream' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          echo "Committed-source invariants passed"
      - name: Build debug APKs
        run: gradle clean :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify APKs
        shell: bash
        run: |
          set -eu
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve mobile APK
        shell: bash
        run: |
          set -eu
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -s "$APK"
          echo "MOBILE_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules outside emulator
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-mobile.json
      - name: Enable KVM and verify acceleration
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -E 'vmx|svm' /proc/cpuinfo | head -n 1
      - name: Run mobile emulator regression
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: xsportsx-mobile
          force-avd-creation: true
          ram-size: 3072
          heap-size: 512
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            set -eux
            test -e /dev/kvm
            sudo chmod 666 /dev/kvm
            adb start-server
          script: bash scripts/run_emulator_regression_v2.sh "$MOBILE_APK" mobile test-output-mobile
        env:
          QA_MODE: mobile
          QA_SOURCE_PORT: 8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-emulator-qa-${{ github.sha }}
          path: |
            test-output-mobile/**
            qa-source.log
            public-schedule-mobile.json
          if-no-files-found: ignore

  tv:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-emulator-qa-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve TV APK
        shell: bash
        run: |
          set -eu
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -s "$APK"
          echo "TV_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules outside emulator
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-tv.json
      - name: Enable KVM and verify acceleration
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -E 'vmx|svm' /proc/cpuinfo | head -n 1
      - name: Run TV emulator regression
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          avd-name: xsportsx-tv
          force-avd-creation: true
          ram-size: 3072
          heap-size: 512
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            set -eux
            test -e /dev/kvm
            sudo chmod 666 /dev/kvm
            adb start-server
          script: bash scripts/run_emulator_regression_v2.sh "$TV_APK" tv test-output-tv
        env:
          QA_MODE: tv
          QA_SOURCE_PORT: 8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-emulator-qa-${{ github.sha }}
          path: |
            test-output-tv/**
            qa-source.log
            public-schedule-tv.json
          if-no-files-found: ignore

  publish:
    name: Publish verified release APKs
    needs: [mobile, tv]
    if: ${{ needs.mobile.result == 'success' && needs.tv.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.XSPORTSX_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > xsportsx-release.jks
          chmod 600 xsportsx-release.jks
          test -s xsportsx-release.jks
      - name: Build signed release APKs from the exact QA commit
        env:
          XSORTSX_KEYSTORE_PATH: ${{ github.workspace }}/xsportsx-release.jks
          XSORTSX_KEYSTORE_PASSWORD: ${{ secrets.XSPORTSX_KEYSTORE_PASSWORD }}
          XSORTSX_KEY_ALIAS: ${{ secrets.XSPORTSX_KEY_ALIAS }}
          XSORTSX_KEY_PASSWORD: ${{ secrets.XSPORTSX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in XSORTSX_KEYSTORE_PATH XSORTSX_KEYSTORE_PASSWORD XSORTSX_KEY_ALIAS XSORTSX_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "Missing signing value: $name"; exit 1; }
          done
          gradle clean :app:assembleMobileRelease :app:assembleTvRelease --no-daemon --stacktrace --console=plain
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk XSportsX-Mobile.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk XSportsX-TV.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose XSportsX-Mobile.apk
          "$APKSIGNER" verify --verbose XSportsX-TV.apk
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a published APK."
            exit 1
          fi
          gh release create "$TAG" XSportsX-Mobile.apk XSportsX-TV.apk \
            --target "$GITHUB_SHA" \
            --title "XSportsX $VERSION_NAME" \
            --notes "Verified Mobile + Android TV release. Version code $VERSION_CODE. Published only after both Mobile and TV emulator regression jobs passed on this exact commit."
      - name: Remove signing key
        if: always()
        run: rm -f xsportsx-release.jks
