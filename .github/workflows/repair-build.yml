name: One-time build repair
on:
  push:
    paths:
      - '.github/workflows/repair-build.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
      - name: Repair EventSheet compatibility
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/xsportsx/app/MainActivity.kt'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/MainActivity.kt')
          s = p.read_text()
          old = 'fun EventSheet(event: SportsEvent, onClose: () -> Unit, onPlay: (ResolvedStream) -> Unit) {'
          new = 'fun EventSheet(event: SportsEvent, onClose: () -> Unit, onBack: () -> Unit = onClose, onPlay: (ResolvedStream) -> Unit) {'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'fun EventSheet(event: SportsEvent, onClose: () -> Unit, onBack:' in s:
              pass
          else:
              raise SystemExit('EventSheet signature not found')
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/main/java/com/xsportsx/app/MainActivity.kt
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/MainActivity.kt
          git commit -m 'fix: restore EventSheet back callback compatibility'
          git push origin HEAD:android-app
      - name: Remove one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-build.yml
          git commit -m 'chore: remove one-time build repair workflow'
          git push origin HEAD:android-app
