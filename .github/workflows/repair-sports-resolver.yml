name: Repair sports resolver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'hotfix:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch gateway and event resolver
        shell: python
        run: |
          from pathlib import Path
          import re

          # The current public gateway was rewriting /v526 requests to /v520,
          # while sports-router.js was expecting /v523. That made configFrom()
          # return null and every Xtream-backed stream request returned empty.
          p = Path('render-entry-v526.js')
          s = p.read_text()
          s = s.replace('const BACKEND_PREFIX="v520";', 'const BACKEND_PREFIX="v523";')
          s = s.replace('const VERSION="5.0.28";', 'const VERSION="5.0.29";')
          s = s.replace('com.xsportsx.sports.epg.v528', 'com.xsportsx.sports.epg.v529')
          p.write_text(s)

          p = Path('sports-router.js')
          s = p.read_text()
          s = s.replace('const VERSION="5.0.23";', 'const VERSION="5.0.29";')
          s = s.replace('const ADDON_ID="com.xsportsx.sports.epg.v523";', 'const ADDON_ID="com.xsportsx.sports.epg.v529";')

          # Keep the backend prefix aligned with the gateway's rewritten path.
          # This preserves the encrypted config token while fixing the route.
          # The resolver below adds the architecture used by Sportio-Live:
          # one cached full EPG index, then timestamp-aware event matching.
          if 'function decodeXmltvText(' not in s:
              anchor = 'async function getShortEpg(c,streamId){'
              helpers = r'''
function decodeXmltvText(v){
  return String(v??'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim();
}
function xmltvTime(v){
  const m=String(v||'').match(/^(\d{14})(?:\s+([+-]\d{4}))?/);
  if(!m)return 0;
  const d=m[1];
  const base=Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),+d.slice(8,10),+d.slice(10,12),+d.slice(12,14));
  if(!m[2])return base;
  const sign=m[2][0]==='-'?-1:1,off=(+m[2].slice(1,3)*60)+(+m[2].slice(3,5));
  return base-sign*off*60000;
}
const xmltvIndexCache=new Map();
const xmltvIndexFlight=new Map();
async function getXmltvIndex(c){
  const key=`xmltv:${c.server}|${c.username}`;
  const hit=xmltvIndexCache.get(key);
  if(hit&&Date.now()-hit.at<300000)return hit.value;
  if(xmltvIndexFlight.has(key))return xmltvIndexFlight.get(key);
  const job=(async()=>{
    const u=new URL(`${c.server}/xmltv.php`);
    u.searchParams.set('username',c.username);
    u.searchParams.set('password',c.password);
    const r=await fetch(u.toString(),{headers:{'user-agent':`XSportsX/${VERSION}`},signal:AbortSignal.timeout(60000)});
    if(!r.ok)throw new Error(`XMLTV HTTP ${r.status}`);
    const text=await r.text();
    const byChannel=new Map();
    const programRe=/<programme\b([^>]*)>([\s\S]*?)<\/programme>/gi;
    let m;
    while((m=programRe.exec(text))!==null){
      const attrs=m[1],body=m[2];
      const cm=attrs.match(/\bchannel=["']([^"']+)["']/i);
      const sm=attrs.match(/\bstart=["']([^"']+)["']/i);
      const em=attrs.match(/\bstop=["']([^"']+)["']/i);
      if(!cm||!sm)continue;
      const tm=body.match(/<title(?:\s[^>]*)?>([\s\S]*?)<\/title>/i);
      const dm=body.match(/<desc(?:\s[^>]*)?>([\s\S]*?)<\/desc>/i);
      const title=decodeXmltvText(tm?.[1]||'');
      if(!title)continue;
      const start=xmltvTime(sm[1]),stop=xmltvTime(em?.[1]||'');
      if(!start)continue;
      const row={title,description:decodeXmltvText(dm?.[1]||''),start,stop,channelId:cm[1]};
      if(!byChannel.has(cm[1]))byChannel.set(cm[1],[]);
      byChannel.get(cm[1]).push(row);
    }
    for(const rows of byChannel.values())rows.sort((a,b)=>a.start-b.start);
    const value={byChannel,at:Date.now(),programCount:[...byChannel.values()].reduce((n,x)=>n+x.length,0)};
    xmltvIndexCache.set(key,{at:Date.now(),value});
    return value;
  })().catch(()=>hit?.value||{byChannel:new Map(),at:0,programCount:0}).finally(()=>xmltvIndexFlight.delete(key));
  xmltvIndexFlight.set(key,job);
  return job;
}
function eventTokens(meta){
  const e=meta?.event||{};
  const a=teamTokens(e.away||{}),h=teamTokens(e.home||{});
  return {away:a,home:h,all:[...new Set([...a,...h,norm(meta?.name||'').split(' ').filter(x=>x.length>=3))]};
}
function scoreProgram(program,meta){
  const text=norm(`${program.title} ${program.description}`),t=eventTokens(meta);
  if(meta?.league==='ufc'||meta?.event?.league==='ufc'){
    let score=0;
    if(/\bufc\b|ultimate fighting|fight night|ufc\s*\d+/i.test(text))score=70;
    for(const x of t.all)if(x&&text.includes(x))score+=x.length>=5?18:8;
    const es=Date.parse(meta.event?.start||'');
    if(es&&program.start){const d=Math.abs(program.start-es);if(d<=2*3600000)score+=20;else if(d<=6*3600000)score+=10;}
    return Math.min(100,score);
  }
  let as=0,hs=0;
  for(const x of t.away)if(x&&text.includes(x))as=Math.max(as,x.length>=5?55:35);
  for(const x of t.home)if(x&&text.includes(x))hs=Math.max(hs,x.length>=5?55:35);
  let score=0;
  if(as>=55&&hs>=55)score=100;else if(as>=35&&hs>=35)score=85;else if(as>=55||hs>=55)score=60;
  const es=Date.parse(meta.event?.start||'');
  if(es&&program.start){const d=Math.abs(program.start-es);if(d<=90*60000)score+=15;else if(d<=3*3600000)score+=8;else if(d<=8*3600000)score+=3;}
  return Math.min(100,score);
}
function streamFromXtream(c,m,score,program){
  return {name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:`${m.xtream?.category||'Live TV'} • EPG match ${score}%${program?.title?` • ${program.title}`:''}`,score};
}
async function streamsForEventXmltv(c,meta,d){
  if(!c||!meta?.event)return [];
  const index=await getXmltvIndex(c);
  const streams=d.metas||[];
  const rows=[];
  for(const m of streams){
    const streamId=String(m.xtream?.streamId||m.id||'').replace(/^xtream:/,'');
    const epgId=String(m.xtream?.epgChannelId||m.xtream?.epg_channel_id||'');
    const ids=[epgId,streamId,m.name].filter(Boolean);
    let programs=[];
    for(const id of ids){if(index.byChannel.has(id)){programs=index.byChannel.get(id);break;}}
    if(!programs.length)continue;
    let best=null,bestScore=0;
    for(const program of programs){
      const score=scoreProgram(program,meta);
      if(score>bestScore){bestScore=score;best=program;}
    }
    if(best&&bestScore>=55)rows.push(streamFromXtream(c,m,bestScore,best));
  }
  // If the provider's XMLTV is incomplete, retain the existing short-EPG
  // resolver as a fallback, but only after the full-index pass has failed.
  if(!rows.length)return null;
  rows.sort((a,b)=>b.score-a.score);
  return rows;
}
'''
              s=s.replace(anchor,helpers+anchor,1)

          # Replace the existing on-demand resolver with full XMLTV first,
          # then the old direct/short-EPG fallback. The full XMLTV pass is
          # what Sportio-Live uses to avoid missing channels whose names are
          # generic (MLB 1, Sports 5, etc.).
          pattern=r'async function streamsForEvent\(c,meta\)\{[\s\S]*?\n\}\nasync function ufcCatalog'
          replacement=r'''async function streamsForEvent(c,meta){
  if(!c||!meta?.event)return[];
  const cacheKey=`match:${c.server}|${c.username}|${meta.id}`;
  const hit=sourceMatchCache.get(cacheKey);
  if(hit&&Date.now()-hit.at<60000)return hit.value;
  const d=await xtreamData(c);
  try{
    const xmlRows=await streamsForEventXmltv(c,meta,d);
    if(Array.isArray(xmlRows)&&xmlRows.length){
      const value=xmlRows.slice(0,50);
      sourceMatchCache.set(cacheKey,{at:Date.now(),value});
      return value;
    }
  }catch(e){console.error('XMLTV resolver:',e?.message||e);}
  let direct=[];
  if(meta.event.league==='ufc'){
    direct=d.metas.filter(m=>/\b(ufc|ultimate fighting championship|fight pass|ufc fight|ufc network|paramount plus|paramount\+|cbs sports)\b/i.test(`${m.name} ${m.xtream?.category||''}`)).map(m=>({name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:m.xtream.category,score:70}));
  }else{
    const e={away:meta.event.away,home:meta.event.home,broadcast:meta.event.broadcast||[]};
    direct=d.metas.map(m=>({m,score:matchEventChannel(m,e)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>({name:`▶ ${x.m.name}`,url:x.m.xtream.streamUrl,title:x.m.name,description:`${x.m.xtream.category} • direct match ${x.score}%`,score:x.score}));
  }
  if(direct.length){const value=direct.slice(0,50);sourceMatchCache.set(cacheKey,{at:Date.now(),value});return value;}
  const sportRe=/\b(sport|sports|espn|fox sports|fs1|fs2|tnt|nba|mlb|nhl|nfl|ncaaf|sec network|acc network|big ten|bally|msg|regional sports|baseball|basketball|football|hockey|soccer|tennis|golf|cbs sports|nbc sports)\b/i;
  const candidates=d.metas.filter(m=>sportRe.test(`${m.name} ${m.xtream?.category||''}`));
  const pool=candidates.length?candidates:d.metas;
  const found=[];let idx=0;
  const worker=async()=>{while(idx<pool.length){const m=pool[idx++],streamId=m.xtream?.streamId||String(m.id||'').replace(/^xtream:/,'');if(!streamId)continue;const epg=await getShortEpg(c,streamId),hitScore=epgTextScore(epg,meta);if(hitScore.score>=55)found.push(streamFromXtream(c,m,hitScore.score,hitScore.item));}};
  await Promise.all(Array.from({length:Math.min(20,pool.length)},worker));
  found.sort((a,b)=>b.score-a.score);
  const value=found.slice(0,50);sourceMatchCache.set(cacheKey,{at:Date.now(),value});return value;
}
async function ufcCatalog'''
          ns, count = re.subn(pattern,replacement,s,count=1)
          if count != 1:
              raise SystemExit('streamsForEvent replacement failed')
          p.write_text(ns)

      - name: Validate JavaScript
        run: |
          node --check sports-router.js
          node --check render-entry-v526.js

      - name: Commit repaired resolver
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add render-entry-v526.js sports-router.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "hotfix: align gateway and use full Xtream XMLTV resolver"
          git push
