name: Repair Mobile Ticker Placement
on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths: ['scripts/**', 'app/src/main/java/com/xsportsx/app/**']
permissions:
  contents: write
concurrency:
  group: xsportsx-ui-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/repair_ticker_placement.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'XSportsX UI Bot'
          git config user.email 'xsportsx-ui-bot@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: place sports ticker above mobile navigation'
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            if git rebase --autostash origin/android-app && git push origin HEAD:android-app; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
