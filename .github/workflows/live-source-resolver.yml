name: Live game source resolver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'hotfix:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Xtream live-game resolver
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('sports-router.js')
          s = p.read_text()

          s = s.replace('const VERSION="5.0.23";', 'const VERSION="5.0.30";')
          s = s.replace('const ADDON_ID="com.xsportsx.sports.epg.v523";', 'const ADDON_ID="com.xsportsx.sports.epg.v530";')

          helpers = r'''\nfunction teamTokens(t={}){\n  const raw=[t.displayName,t.name,t.shortName,t.abbreviation,t.short,t.location,t.nickname].filter(Boolean).join(' ');\n  const n=norm(raw);\n  const words=n.split(' ').filter(x=>x.length>=3);\n  const compact=words.filter(x=>!['the','and','club','team','fc','sc','united','state','states'].includes(x));\n  const out=new Set(compact);\n  if(n)out.add(n);\n  if(t.abbreviation)out.add(norm(t.abbreviation));\n  if(t.shortName)out.add(norm(t.shortName));\n  if(t.name)out.add(norm(t.name));\n  return [...out].filter(x=>x.length>=2);\n}\nfunction teamTerms(t={}){return teamTokens(t);}\nfunction tokenOverlap(a,b){\n  const aa=new Set(norm(a).split(' ').filter(x=>x.length>=3));\n  const bb=new Set(norm(b).split(' ').filter(x=>x.length>=3));\n  if(!aa.size||!bb.size)return 0;\n  let hit=0;for(const x of aa)if(bb.has(x))hit++;\n  return hit/Math.max(aa.size,bb.size);\n}\nfunction leagueTokens(meta={}){\n  const l=String(meta.league||meta.event?.league||'').toLowerCase();\n  const map={nfl:['nfl','football'],ncaaf:['ncaaf','college football','football'],nba:['nba','basketball'],nhl:['nhl','hockey'],mlb:['mlb','baseball'],soccer:['soccer','football'],ufc:['ufc','mma','fight']};\n  return map[l]||[l];\n}\nfunction sourceText(m){return norm(`${m?.name||''} ${m?.xtream?.category||''}`);}\nfunction sourceScore(m,epg,meta){\n  const text=norm(`${m?.name||''} ${m?.xtream?.category||''} ${epg?.title||''} ${epg?.description||''}`);\n  const away=teamTokens(meta?.event?.away||{}),home=teamTokens(meta?.event?.home||{});\n  let a=0,h=0;\n  for(const x of away)if(x&&text.includes(x))a=Math.max(a,x.length>=5?58:38);\n  for(const x of home)if(x&&text.includes(x))h=Math.max(h,x.length>=5?58:38);\n  let score=0;\n  if(a>=55&&h>=55)score=100;\n  else if(a>=35&&h>=35)score=88;\n  else if(a>=55||h>=55)score=62;\n  else score=Math.round(tokenOverlap(meta?.name||'',text)*55);\n  const lt=leagueTokens(meta);\n  if(lt.some(x=>x&&text.includes(norm(x))))score+=12;\n  if(epg?.now_playing===1||epg?.now_playing==='1')score+=15;\n  const es=Date.parse(meta?.event?.start||'');\n  const ts=Number(epg?.start_timestamp||0)*1000;\n  if(es&&!Number.isNaN(es)&&ts){const d=Math.abs(es-ts);if(d<=90*60000)score+=18;else if(d<=3*3600000)score+=10;else if(d<=8*3600000)score+=4;}\n  return Math.min(100,score);\n}\nfunction streamRowsForXtream(c,m,score,epg){\n  const u=m?.xtream?.streamUrl;\n  if(!u)return [];\n  const rows=[{name:`▶ ${m.name}`,url:u,title:m.name,description:`${m.xtream?.category||'Live TV'} • source match ${score}%${epg?.title?` • ${decodeXtreamText(epg.title)}`:''}`,score}];\n  const hls=String(u).replace(/\\.(ts|m3u8)(?:$|\\?)/i,'.m3u8$');\n  if(hls!==u)rows.push({name:`▶ ${m.name} • HLS`,url:hls,title:`${m.name} • HLS`,description:`HLS alternate • source match ${score}%`,score:Math.max(1,score-1)});\n  return rows;\n}\n'''
          if 'function teamTokens(' not in s:
              anchor='function slug(v){return norm(v).replace(/\\s+/g,"-");}'
              if anchor not in s:
                  raise SystemExit('normalization anchor not found')
              s=s.replace(anchor,anchor+helpers,1)

          old_meta='xtream:{streamUrl:`${c.server}/live/${encodeURIComponent(c.username)}/${encodeURIComponent(c.password)}/${encodeURIComponent(s.stream_id)}.${ext}`,category:cat}};'
          new_meta='xtream:{streamId:String(s.stream_id),epgChannelId:String(s.epg_channel_id||s.epgChannelId||""),containerExtension:ext,streamUrl:`${c.server}/live/${encodeURIComponent(c.username)}/${encodeURIComponent(c.password)}/${encodeURIComponent(s.stream_id)}.${ext}`,category:cat}};'
          if old_meta in s:
              s=s.replace(old_meta,new_meta,1)

          pattern=r'async function streamsForEvent\\(c,meta\\)\\{[\\s\\S]*?\\n\\}\\nasync function ufcCatalog'
          replacement=r'''async function streamsForEvent(c,meta){
  if(!c||!meta?.event)return[];
  const cacheKey=`match:${c.server}|${c.username}|${meta.id}`;
  const hit=sourceMatchCache.get(cacheKey);
  if(hit&&Date.now()-hit.at<60000)return hit.value;
  const d=await xtreamData(c);
  const ranked=[];
  const seen=new Set();
  const add=(m,score,epg)=>{
    if(!m?.xtream?.streamUrl||seen.has(m.id))return;
    if(score<45)return;
    seen.add(m.id);
    ranked.push(...streamRowsForXtream(c,m,score,epg));
  };

  // 1. Exact/near-exact channel-name and broadcast matches. This is cheap
  // and catches providers that put team/network names directly in channel names.
  if(meta.event.league==='ufc'){
    for(const m of d.metas){
      const t=sourceText(m);
      if(/\\b(ufc|mma|fight night|fight pass|cbs sports|paramount)\\b/i.test(t))add(m,75,null);
    }
  }else{
    for(const m of d.metas){
      let score=0;
      const t=sourceText(m), e=meta.event||{};
      for(const x of [...teamTokens(e.away||{}),...teamTokens(e.home||{})])if(x&&t.includes(x))score=Math.max(score,x.length>=5?58:38);
      for(const b of e.broadcast||[])if(norm(b)&&t.includes(norm(b)))score=100;
      if(score) add(m,score,null);
    }
  }

  // 2. Sportio-style EPG resolution. Do not depend on channel names: use
  // epg_channel_id from get_live_streams first, then stream id/name aliases.
  // get_short_epg is cheap enough for a bounded parallel pass and is much
  // more reliable than assuming XMLTV attribute ordering.
  const sportRe=/\\b(sport|sports|espn|fox sports|fs1|fs2|tnt|nba|mlb|nhl|nfl|ncaaf|sec network|acc network|big ten|bally|msg|regional sports|baseball|basketball|football|hockey|soccer|tennis|golf|cbs sports|nbc sports)\\b/i;
  const candidates=d.metas.filter(m=>sportRe.test(`${m.name} ${m.xtream?.category||''}`));
  const pool=(candidates.length?candidates:d.metas).slice(0,500);
  let idx=0;
  const worker=async()=>{
    while(idx<pool.length){
      const m=pool[idx++];
      const sid=String(m.xtream?.streamId||m.id||'').replace(/^xtream:/,'');
      if(!sid||seen.has(m.id))continue;
      let epg=[];
      try{epg=await getShortEpg(c,sid);}catch{}
      if(!Array.isArray(epg)||!epg.length)continue;
      let best=null,bestScore=0;
      for(const item of epg){const score=sourceScore(m,item,meta);if(score>bestScore){bestScore=score;best=item;}}
      if(best&&bestScore>=45)add(m,bestScore,best);
    }
  };
  await Promise.all(Array.from({length:Math.min(24,pool.length)},worker));

  // 3. If short-EPG is sparse, use the cached full XMLTV resolver as a
  // secondary pass. It is intentionally last so normal clicks stay fast.
  if(ranked.length<2){
    try{
      const rows=await streamsForEventXmltv(c,meta,d);
      if(Array.isArray(rows))for(const row of rows){const m=d.metas.find(x=>x.name===row.title);if(m)add(m,Number(row.score)||55,null);}
    }catch(e){console.error('full XMLTV fallback:',e?.message||e);}
  }

  ranked.sort((a,b)=>(b.score||0)-(a.score||0));
  const value=ranked.slice(0,50);
  sourceMatchCache.set(cacheKey,{at:Date.now(),value});
  return value;
}
async function ufcCatalog'''
          ns,count=re.subn(pattern,replacement,s,count=1)
          if count!=1:
              raise SystemExit('streamsForEvent replacement failed')
          p.write_text(ns)

      - name: Validate
        run: node --check sports-router.js && node --check render-entry-v526.js

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-router.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'hotfix: live game sources'
          git push
