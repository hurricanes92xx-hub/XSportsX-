name: XSportsX Source QA

# Completely isolated from release builds. Uses only debug APKs and a local
# deterministic source fixture; never uses production/provider credentials.
on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-source-qa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply release-parity source patches
        run: |
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
      - name: Build isolated debug APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: source-qa-apks
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk

  mobile-source:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: source-qa-apks
          path: test-apks
      - name: Start local Xtream/M3U fixture
        run: |
          python3 scripts/qa_source_server.py >/tmp/xsportsx-source.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          python3 scripts/qa_source_fixture_check.py
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_SOURCE_BASE: http://10.0.2.2:8765
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x scripts/ui_smoke_test.sh scripts/source_login_smoke.sh
            ./scripts/ui_smoke_test.sh test-apks/app-mobile-debug.apk source-ui
            ./scripts/source_login_smoke.sh test-apks/app-mobile-debug.apk source-login
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-source-qa-evidence
          path: source-*
          if-no-files-found: ignore

  tv-source:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: source-qa-apks
          path: test-apks
      - name: Start local Xtream/M3U fixture
        run: |
          python3 scripts/qa_source_server.py >/tmp/xsportsx-source.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          python3 scripts/qa_source_fixture_check.py
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_SOURCE_BASE: http://10.0.2.2:8765
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x scripts/ui_smoke_test.sh scripts/source_login_smoke.sh
            ./scripts/ui_smoke_test.sh test-apks/app-tv-debug.apk source-ui
            ./scripts/source_login_smoke.sh test-apks/app-tv-debug.apk source-login
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-source-qa-evidence
          path: source-*
          if-no-files-found: ignore
