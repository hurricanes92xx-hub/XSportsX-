name: Validate schedule refresh

on:
  workflow_dispatch:
  push:
    branches: [fix/schedule-recovery]
    paths:
      - 'data/schedule_feed.json'
      - 'scripts/validate_schedule_refresh.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate schedule coverage
        run: python3 scripts/validate_schedule_refresh.py
