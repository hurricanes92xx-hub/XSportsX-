name: Fix live XSportsX server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch live server
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text()
          original = s

          s = s.replace("version:'6.0.1'", "version:'7.2.0'")
          s = s.replace("version:'6.0.1',time:", "version:'7.2.0',time:")

          old = "const manifest=base=>({id:'community.xsportsx',version:'7.2.0'"
          if old in s:
              s = s.replace(old, "const manifest=(base,c)=>({id:'community.xsportsx',version:'7.2.0'")
          else:
              s = s.replace("const manifest=base=>({id:'community.xsportsx',version:'6.0.1'", "const manifest=(base,c)=>({id:'community.xsportsx',version:'7.2.0'")

          s = s.replace("catalogs:manifestCatalogs,behaviorHints:", "catalogs:manifestCatalogs.filter(x=>!c||!Array.isArray(c.sports)||c.sports.includes(x.id)||['sports-command-center','live-now','starting-soon','iptv-live'].includes(x.id)),behaviorHints:")
          s = s.replace("app.get('/manifest.json',(req,res)=>res.set('Cache-Control','public,max-age=60').json(manifest(baseUrl(req))))", "app.get('/manifest.json',(req,res)=>res.set({'Cache-Control':'no-store, no-cache, must-revalidate','X-XSportsX-Build':'7.2.0'}).json(manifest(baseUrl(req),config())))")

          marker = "async function catalogEvents(id){const ev=await allEvents();"
          replacement = "async function catalogEvents(id){const c=config();if(LEAGUES[id]&&Array.isArray(c.sports)&&c.sports.length&&!c.sports.includes(id))return[];const ev=await allEvents();"
          s = s.replace(marker, replacement)

          s = s.replace('<div class="brand"><i>X</i>SPORTS<i>X</i></div>', '<div class="brand"><i>X</i>SPORTS<i>X</i></div><div style="display:inline-block;margin-top:12px;padding:7px 12px;border:1px solid #ff2438;border-radius:999px;color:#ff6b7a;font-weight:800;font-size:12px;letter-spacing:.6px">XSportsX BUILD 7.2.0 • LIVE</div>')

          if s != original:
              p.write_text(s)
          else:
              print('No server.js changes required')
          PY

      - name: Commit live-server patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix live manifest version and selected leagues"
          git push
