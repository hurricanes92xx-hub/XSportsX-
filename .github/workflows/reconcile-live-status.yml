name: Reconcile live sports status
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/schedule_feed.json'
      - 'scripts/reconcile_live_status.py'
      - '.github/workflows/reconcile-live-status.yml'
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: xsportsx-live-status
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile current live status across leagues
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin android-app
            git reset --hard origin/android-app
            python scripts/reconcile_live_status.py
            if git diff --quiet -- data/schedule_feed.json; then
              echo 'No live status changes.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/schedule_feed.json
            git commit -m 'chore: reconcile live sports status'
            if git push origin HEAD:android-app; then
              exit 0
            fi
            echo "Push raced with another schedule update; retrying from latest android-app (attempt $attempt)."
            sleep $((attempt * 2))
          done
          echo 'Unable to publish live status after three retries' >&2
          exit 1
