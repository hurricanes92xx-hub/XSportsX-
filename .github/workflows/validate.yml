name: Validate XSportsX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check server.js
      - run: node --check render-proxy.js
      - run: node --check artwork.js
      - run: node --check compat-prefix.js
