name: Final live resolver fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair resolver and EPG matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()

          marker='function newsLogo(group,channelPoster){return channelPoster||LOGO_FALLBACKS[group]||`${BASE}/${PREFIX}/assets/news/${slug(group)}.svg`;}'
          if marker in s and 'function newsSlug(' not in s:
              s=s.replace(marker, marker+'\nfunction newsSlug(v){return slug(v);}', 1)

          old='''async function resolveEventMeta(id){
          const cached=await resolveEventMeta(id);
          if(cached)return cached;'''
          new='''async function resolveEventMeta(id){
          const cached=eventCache.get(String(id||''));
          if(cached)return cached;'''
          if old in s:
              s=s.replace(old,new,1)

          if 'function decodeXtreamText(' not in s:
              needle='function epgTextScore(list,meta){'
              helper=r'''function decodeXtreamText(v){
          const raw=String(v??'').trim();
          if(!raw)return '';
          const compact=raw.replace(/\\s+/g,'');
          if(!/^[A-Za-z0-9+/]+={0,2}$/.test(compact)||compact.length<8||compact.length%4===1)return raw;
          try{
            const decoded=Buffer.from(compact,'base64').toString('utf8').replace(/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f]/g,' ').trim();
            if(decoded && /[A-Za-z]{2,}/.test(decoded))return decoded;
          }catch{}
          return raw;
          }
          '''
              s=s.replace(needle,helper+needle,1)

          s=s.replace('const text=norm(`${x.title||""} ${x.description||""}`);', 'const text=norm(`${decodeXtreamText(x.title||"")} ${decodeXtreamText(x.description||"")}`);', 1)

          old_epg='''try{const u=xtreamApi(c,'get_short_epg');u.searchParams.set('stream_id',String(streamId));u.searchParams.set('limit','6');const v=await getJson(u.toString(),4500);const rows=v?.epg_listings||v?.epgListings||[];epgCache.set(key,{at:Date.now(),value:rows});return rows;}catch{return hit?.value||[];}'''
          new_epg='''try{const u=xtreamApi(c,'get_short_epg');u.searchParams.set('stream_id',String(streamId));u.searchParams.set('limit','10');const v=await getJson(u.toString(),4500);let rows=v?.epg_listings||v?.epgListings||[];if(!Array.isArray(rows)||!rows.length){const f=xtreamApi(c,'get_simple_data_table');f.searchParams.set('stream_id',String(streamId));const fv=await getJson(f.toString(),4500);rows=fv?.epg_listings||fv?.epgListings||[];}epgCache.set(key,{at:Date.now(),value:Array.isArray(rows)?rows:[]});return Array.isArray(rows)?rows:[];}catch{return hit?.value||[];}'''
          if old_epg in s:
              s=s.replace(old_epg,new_epg,1)

          p.write_text(s)
          PY
      - name: Validate
        run: node --check sports-router.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-router.js .github/workflows/zz-final-live-resolver-fix.yml
          git diff --cached --quiet || git commit -m 'fix: repair Xtream data path and EPG matching'
          git push
