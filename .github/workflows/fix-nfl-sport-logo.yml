name: Fix NFL Sport Logo

on:
  push:
    branches:
      - android-app

permissions:
  contents: write

jobs:
  fix-nfl-logo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 0

      - name: Replace NFL logo asset and sizing rule
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/com/xsportsx/app/FuturisticSports.kt"
          test -f "$file"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/FuturisticSports.kt')
          s = p.read_text(encoding='utf-8')
          old = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/National_Football_League_logo.svg/256px-National_Football_League_logo.svg.png'
          new = 'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png'
          if old in s:
              s = s.replace(old, new)
          s = s.replace('val wideLogo=key.contains("NFL")||', 'val wideLogo=')
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'SportVisual("NFL", "NFL", "https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png")' "$file"
          if grep -Fq 'val wideLogo=key.contains("NFL")||' "$file"; then
            echo 'NFL wide-logo rule still present'; exit 1
          fi

      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX UI Bot'
          git config user.email 'xsportsx-ui-bot@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          if git diff --cached --quiet; then
            echo 'NFL logo already fixed.'
            exit 0
          fi
          git commit -m 'fix: use clean NFL shield asset'
          git push origin HEAD:android-app
