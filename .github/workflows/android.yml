name: Build XSportsX APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

concurrency:
  group: xsportsx-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          java -version
          gradle --version

      - name: Clean and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
