name: Build XSportsX APK

# Release build includes the animated Xtreme logo on Mobile + Android TV.
# Build trigger is intentionally kept on android-app so the release APKs follow the patched branch.
# TV UI repair is now on android-app; this commit intentionally triggers the release build.
# Launcher icon updated to the neon red/blue X on 2026-08-25.

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsportsx-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties

      - name: Apply TV navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          grep -q 'TvTopBar(onSettings=' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'TvModeButton' app/src/main/java/com/xsportsx/app/TvHome.kt

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.XSPORTSX_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XSPORTSX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XSPORTSX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XSPORTSX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing XSPORTSX release signing secret: ${name}"
              exit 1
            fi
          done

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.XSPORTSX_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > xsportsx-release.jks
          chmod 600 xsportsx-release.jks
          test -s xsportsx-release.jks

      - name: Build signed mobile + TV APKs
        env:
          XSORTSX_KEYSTORE_PATH: ${{ github.workspace }}/xsportsx-release.jks
          XSORTSX_KEYSTORE_PASSWORD: ${{ secrets.XSPORTSX_KEYSTORE_PASSWORD }}
          XSORTSX_KEY_ALIAS: ${{ secrets.XSPORTSX_KEY_ALIAS }}
          XSORTSX_KEY_PASSWORD: ${{ secrets.XSPORTSX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:assembleMobileRelease :app:assembleTvRelease --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee gradle-build.log

      - name: Verify APK signatures and outputs
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="app/build/outputs/apk/mobile/release/app-mobile-release.apk"
          TV="app/build/outputs/apk/tv/release/app-tv-release.apk"
          test -s "${MOBILE}"
          test -s "${TV}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose "${MOBILE}"
          "${APKSIGNER}" verify --verbose "${TV}"
          "${APKSIGNER}" verify --print-certs "${MOBILE}" | tee mobile-signing.txt
          "${APKSIGNER}" verify --print-certs "${TV}" | tee tv-signing.txt
          cmp <(grep 'Signer #1 certificate SHA-256 digest' mobile-signing.txt) <(grep 'Signer #1 certificate SHA-256 digest' tv-signing.txt)
          cp "${MOBILE}" XSportsX-Mobile.apk
          cp "${TV}" XSportsX-TV.apk
          sha256sum XSportsX-Mobile.apk XSportsX-TV.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-Mobile-APK
          path: XSportsX-Mobile.apk
          if-no-files-found: error

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-TV-APK
          path: XSportsX-TV.apk
          if-no-files-found: error

      - name: Publish signed APKs for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          TAG="v${VERSION_NAME}"
          NOTES="XSportsX Android ${VERSION_NAME} (${VERSION_CODE}). Stable release-signed Mobile and Android TV APKs for in-app updates.\n\nXSportsX-Update-Version-Code: ${VERSION_CODE}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes "${NOTES}"
            gh release upload "${TAG}" XSportsX-Mobile.apk XSportsX-TV.apk --clobber
          else
            gh release create "${TAG}" XSportsX-Mobile.apk XSportsX-TV.apk --title "XSportsX ${VERSION_NAME}" --notes "${NOTES}" --latest
          fi

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f xsportsx-release.jks
