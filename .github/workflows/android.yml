name: Build XSportsX APK

on:
  push:
    branches: [android-app]
    paths-ignore:
      - 'update.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsportsx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Mobile + TV APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-8.13" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f app/src/main/java/com/xsportsx/app/SportsLogos.kt
          test -f app/src/main/java/com/xsportsx/app/SportsScheduleService.kt
          test -f data/schedule_auto_update_policy.json
          test -f data/brand_logo_catalog.json
          test -f data/schedule_feed.json
          test -f scripts/fetch_brand_logo_pack.py
          test -f scripts/patch_canonical_logo_ui.py
          test -f scripts/patch_yearly_schedule_window.py
          test -f scripts/patch_special_schedule_feed.py
          test -f scripts/patch_pro_wrestling_schedule.py
          test -f scripts/finalize_wrestling_build.py
          test -f scripts/patch_schedule_coverage.py
          test -f scripts/fix_schedule_ui_build.py
          test -f scripts/patch_remove_unbacked_sports.py
          test -f scripts/verify_yearly_schedule_policy.py
          test -f app/src/main/assets/brand_logos/nfl.svg
          test -f app/src/main/assets/brand_logos/nba.svg
          test -f app/src/main/assets/brand_logos/ncaa.svg
          test -f app/src/main/assets/brand_logos/espn.svg
          test -f app/src/main/assets/brand_logos/cbs.svg
          test -f app/src/main/assets/brand_logos/premierleague.svg
      - name: Apply production UI and sports patches
        shell: bash
        run: |
          set -euo pipefail
          [ ! -f scripts/patch_tv_navigation.py ] || python3 scripts/patch_tv_navigation.py
          [ ! -f scripts/patch_college_favorites.py ] || python3 scripts/patch_college_favorites.py
          python3 scripts/patch_sports_badges.py
          python3 .github/patch_networks.py
          python3 scripts/patch_pregame_window.py
          python3 scripts/patch_league_routing.py
          python3 scripts/patch_verified_sports_logos_wwe.py
          python3 scripts/patch_ncaavb_badge.py
          python3 scripts/patch_public_free_sources.py
          python3 scripts/patch_top_sports_routing.py
          python3 scripts/patch_real_brand_logos.py
          python3 scripts/patch_wrestling_schedule.py
          python3 scripts/patch_college_schedule_ui.py
          python3 scripts/patch_yearly_schedule_window.py
          python3 scripts/patch_special_schedule_feed.py
          python3 scripts/patch_pro_wrestling_schedule.py
          python3 scripts/patch_schedule_coverage.py
          python3 scripts/fix_schedule_ui_build.py
          python3 scripts/patch_remove_unbacked_sports.py
          python3 scripts/fetch_brand_logo_pack.py
          python3 scripts/patch_canonical_logo_ui.py
          python3 scripts/verify_yearly_schedule_policy.py
          python3 scripts/verify_logo_catalog.py
          python3 scripts/finalize_wrestling_build.py
          for logo in nfl nba ncaa mlb nhl ufc premierleague espn cbs wwe aew tna fs1 acc sec; do test -s "app/src/main/assets/brand_logos/$logo.svg"; done
          ! grep -Rqs 'a\.espncdn\.com/i/teamlogos/leagues' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          ! grep -Rqs 'SportVisual("ESPORTS"' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'SportVisual("ACTION SPORTS"' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'uww\.org' app/src/main/java/com/xsportsx/app
          ! grep -Rqs 'NCAA WRESTLING' app/src/main/java/com/xsportsx/app
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
      - name: Check release signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.XSPORTSX_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XSPORTSX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XSPORTSX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XSPORTSX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "Missing required release signing secret: $name"; exit 1; }
          done
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.XSPORTSX_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > xsportsx-release.jks
          chmod 600 xsportsx-release.jks
          test -s xsportsx-release.jks
      - name: Build Mobile + TV release APKs
        env:
          XSORTSX_KEYSTORE_PATH: ${{ github.workspace }}/xsportsx-release.jks
          XSORTSX_KEYSTORE_PASSWORD: ${{ secrets.XSPORTSX_KEYSTORE_PASSWORD }}
          XSORTSX_KEY_ALIAS: ${{ secrets.XSPORTSX_KEY_ALIAS }}
          XSORTSX_KEY_PASSWORD: ${{ secrets.XSPORTSX_KEY_PASSWORD }}
        shell: bash
        run: gradle clean :app:assembleMobileRelease :app:assembleTvRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Verify and upload APKs
        shell: bash
        run: |
          set -euo pipefail
          MOBILE=app/build/outputs/apk/mobile/release/app-mobile-release.apk
          TV=app/build/outputs/apk/tv/release/app-tv-release.apk
          test -s "$MOBILE" && test -s "$TV"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$MOBILE"
          "$APKSIGNER" verify --verbose "$TV"
          cp "$MOBILE" XSportsX-Mobile.apk
          cp "$TV" XSportsX-TV.apk
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          echo "$VERSION_NAME ($VERSION_CODE)"
      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-Mobile-${{ github.run_number }}
          path: XSportsX-Mobile.apk
          retention-days: 14
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-TV-${{ github.run_number }}
          path: XSportsX-TV.apk
          retention-days: 14
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-gradle-log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
