name: Build XSportsX APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Clean and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee gradle-build.log
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
