name: Build XSportsX APK
on:
  workflow_dispatch:
  push:
    branches: [android-app]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed Mobile + TV APKs
        run: ./gradlew :android-app:app:assembleRelease :android-app:app:assembleDebug --stacktrace
