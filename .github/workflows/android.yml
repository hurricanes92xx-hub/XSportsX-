name: Build XSportsX APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsportsx-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          java -version
          gradle --version

      - name: Clean and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk XSportsX.apk
          ls -lh XSportsX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apk
          path: XSportsX.apk
          if-no-files-found: error

      - name: Publish APK release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          TAG="v${VERSION_NAME}"
          echo "Publishing XSportsX ${VERSION_NAME} (${VERSION_CODE}) as ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" XSportsX.apk --clobber
          else
            gh release create "${TAG}" XSportsX.apk \
              --title "XSportsX ${VERSION_NAME}" \
              --notes "XSportsX Android ${VERSION_NAME} (${VERSION_CODE}). Install this release from the in-app UPDATE button." \
              --latest
          fi
