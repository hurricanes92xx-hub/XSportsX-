name: Guaranteed Cross-Sport Live Coverage

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/live_sports_sweep.py'
      - 'scripts/live_sports_sweep_recent.py'
      - 'scripts/providers/ncaa.py'
      - 'scripts/providers/fivb.py'
      - 'scripts/providers/free.py'
      - 'scripts/providers/shadow.py'
      - 'scripts/providers/shadow_special.py'
      - 'scripts/providers/official_live_adapters.py'
      - 'scripts/providers/supplemental_live_adapters.py'
      - 'scripts/normalize_schedule_feed.py'
      - 'scripts/refresh_provider_matrix_v3.py'
      - 'scripts/provider_health_gate.py'
      - 'scripts/official_event_recovery.py'
      - '.github/workflows/live-coverage-rebuild.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-live-coverage
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencies
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rebuild canonical schedule
        run: python3 scripts/refresh_provider_matrix_v3.py

      - name: Validate canonical rebuild
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/schedule_feed.json')
          if not p.exists() or p.stat().st_size < 100: raise SystemExit('CANONICAL FEED MISSING OR EMPTY')
          d=json.loads(p.read_text()); events=d.get('events')
          if not isinstance(events,list) or not events: raise SystemExit('CANONICAL REBUILD PRODUCED NO EVENTS')
          print(f"Canonical events: {len(events)}")
          print(f"Canonical leagues: {len(d.get('eventCounts') or {})}")
          PY

      - name: Official event recovery
        run: python3 scripts/official_event_recovery.py

      - name: Cross-sport live sweep
        run: python3 scripts/live_sports_sweep_recent.py

      - name: Dedicated official live adapters
        run: python3 scripts/providers/official_live_adapters.py

      - name: Supplemental sport adapters
        run: python3 scripts/providers/supplemental_live_adapters.py

      - name: Normalize canonical feed
        run: python3 scripts/normalize_schedule_feed.py

      - name: Provider health gate
        run: python3 scripts/provider_health_gate.py

      - name: Final feed integrity and live-state verification
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('data/schedule_feed.json')
          if not p.exists() or p.stat().st_size < 100: raise SystemExit('FINAL FEED MISSING OR EMPTY')
          d=json.loads(p.read_text()); events=d.get('events') or []
          if not events: raise SystemExit('EMPTY CANONICAL FEED')
          live=[e for e in events if str(e.get('tag','')).upper()=='LIVE' or str(e.get('status','')).upper()=='LIVE' or str(e.get('state','')).lower()=='in']
          print('EVENTS:',len(events)); print('LEAGUES:',len(d.get('eventCounts') or {})); print('LIVE EVENTS:',len(live))
          print('LIVE SPORTS:',sorted({str(e.get('sport') or e.get('league')) for e in live}))
          print('OFFICIAL ADAPTERS:',json.dumps(d.get('officialLiveAdapters') or {},indent=2))
          print('SUPPLEMENTAL ADAPTERS:',json.dumps(d.get('supplementalLiveAdapters') or {},indent=2))
          sweep=d.get('liveSweep') or {}
          if sweep.get('schema') != 5: raise SystemExit(f"UNEXPECTED LIVE SWEEP SCHEMA: {sweep.get('schema')}")
          if sweep.get('liveStatePolicy') != 'provider-authoritative-strict-reconciliation': raise SystemExit('LIVE SWEEP IS NOT STRICTLY PROVIDER-AUTHORITATIVE')
          now=datetime.now(timezone.utc)
          for e in live:
              if not (e.get('liveEvidence') or {}).get('providerEventId'): raise SystemExit(f"LIVE EVENT WITHOUT PROVIDER EVIDENCE: {e.get('league')} | {e.get('title')}")
              start=str(e.get('startUtc') or e.get('start') or '')
              if start:
                  dt=datetime.fromisoformat(start.replace('Z','+00:00')).astimezone(timezone.utc)
                  if dt > now+timedelta(minutes=2): raise SystemExit(f"FUTURE LIVE EVENT: {e.get('title')} {start}")
          PY

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live Coverage Bot'
          git config user.email 'xsportsx-live-coverage-bot@users.noreply.github.com'
          cp data/schedule_feed.json /tmp/xsportsx-schedule_feed.json
          cp data/provider_health_gate.json /tmp/xsportsx-provider_health_gate.json
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            git reset --hard origin/android-app
            cp /tmp/xsportsx-schedule_feed.json data/schedule_feed.json
            cp /tmp/xsportsx-provider_health_gate.json data/provider_health_gate.json
            git add data/schedule_feed.json data/provider_health_gate.json
            if git diff --cached --quiet; then echo 'No feed changes.'; exit 0; fi
            git commit -m 'chore: publish guaranteed cross-sport live coverage'
            if git push origin HEAD:android-app; then exit 0; fi
            git reset --hard origin/android-app
            sleep $((attempt * 2))
          done
          echo 'Unable to publish feed after retries.'
          exit 1
