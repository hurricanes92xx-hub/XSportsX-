name: Guaranteed Cross-Sport Live Coverage

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/live_sports_sweep.py'
      - 'scripts/normalize_schedule_feed.py'
      - 'scripts/refresh_provider_matrix_v3.py'
      - 'scripts/providers/ncaa.py'
      - '.github/workflows/live-coverage-rebuild.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-live-coverage
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Rebuild canonical schedule
        run: python3 scripts/refresh_provider_matrix_v3.py
      - name: Official event recovery
        run: python3 scripts/official_event_recovery.py || true
      - name: Cross-sport live sweep
        run: python3 scripts/live_sports_sweep.py
      - name: Normalize canonical feed
        run: python3 scripts/normalize_schedule_feed.py
      - name: Verify live coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/schedule_feed.json')
          d=json.loads(p.read_text())
          events=d.get('events') or []
          if not events: raise SystemExit('EMPTY CANONICAL FEED')
          live=[e for e in events if str(e.get('tag','')).upper()=='LIVE' or str(e.get('status','')).upper()=='LIVE' or str(e.get('state','')).lower()=='in']
          sports={str(e.get('sport') or e.get('league')) for e in live}
          print('LIVE EVENTS:',len(live))
          print('LIVE SPORTS:',sorted(sports))
          for e in live[:100]: print(e.get('league'), '|', e.get('title'), '|', e.get('startUtc'), '|', e.get('status'), '|', e.get('state'))
          if not live: raise SystemExit('NO LIVE EVENTS AFTER SWEEP')
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live Coverage Bot'
          git config user.email 'xsportsx-live-coverage-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then echo 'No feed changes.'; exit 0; fi
          git commit -m 'chore: publish guaranteed cross-sport live coverage'
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            git rebase --autostash origin/android-app || { git rebase --abort || true; git reset --mixed origin/android-app; git add data/schedule_feed.json; git commit -m 'chore: republish live coverage' || true; }
            if git push origin HEAD:android-app; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
