name: Publish Verified Current Events
on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/publish_verified_current_events.py'
      - 'PATCH_TRIGGER.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 0
      - name: Publish verified events
        run: python3 scripts/publish_verified_current_events.py
      - name: Validate feed
        run: |
          python3 scripts/normalize_schedule_feed.py
          python3 scripts/validate_schedule_integrity.py
      - name: Commit canonical feed
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email 'xsportsx-schedule-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: publish verified current WWE and UFC events'
          git fetch origin android-app
          git rebase --autostash origin/android-app
          git push origin HEAD:android-app
