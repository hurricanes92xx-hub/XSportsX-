name: Apply TV UI performance patch

on:
  workflow_dispatch:
  push:
    paths:
      - PATCH_TRIGGER.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0

      - name: Patch TV rendering and ticker workload
        shell: python
        run: |
          from pathlib import Path
          import re

          ticker = Path('app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt')
          text = ticker.read_text()
          pattern = r'private suspend fun loadTickerGroups\(\): List<TickerLeagueGroup> = supervisorScope \{(.*?)\n\}\n\nprivate fun line'
          match = re.search(pattern, text, flags=re.S)
          if match:
              body = match.group(1)
              replacement = 'private suspend fun loadTickerGroups(): List<TickerLeagueGroup> = withContext(Dispatchers.IO) {\n    supervisorScope {' + body + '\n    }\n}\n\nprivate fun line'
              text = text[:match.start()] + replacement + text[match.end():]
              ticker.write_text(text)

          tv = Path('app/src/main/java/com/xsportsx/app/TvHome.kt')
          text = tv.read_text()
          pattern = r'@Composable private fun TvBackdrop\(modifier:Modifier\)\{.*?\n\n@Composable private fun TvNav'
          replacement = '''@Composable private fun TvBackdrop(modifier:Modifier){
    // Keep the TV background static. The previous full-screen animated Canvas
    // redrew every frame and was expensive on lower-power Android TV hardware.
    Box(modifier.background(Brush.verticalGradient(listOf(Color(0xFF071019),TvBg,Color(0xFF020306)))))
}

@Composable private fun TvNav'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('TV backdrop block not found')
          tv.write_text(updated)

      - name: Commit performance patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "perf: smooth TV UI and move ticker parsing off main"
          git push origin HEAD:android-app
