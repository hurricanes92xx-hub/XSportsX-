name: XSportsX Stage 2 Runtime Audit

on:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-stage2-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xsportsx-stage2-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Audit production source without mutation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run_emulator_regression.sh
          bash -n scripts/qa_regression_test.sh
          python3 -m py_compile scripts/qa_source_probe.py scripts/qa_public_schedule_probe.py
          test -s app/src/main/java/com/xsportsx/app/PublicSourceResolver.kt
          test -s app/src/main/java/com/xsportsx/app/PublicEventMatcher.kt
          test -s app/src/main/java/com/xsportsx/app/PublicSourceHealthIndex.kt
          test -s app/src/main/java/com/xsportsx/app/StreamResolver.kt
          test -s app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          test -s app/src/main/java/com/xsportsx/app/PairingQr.kt
          test -s app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          test -s app/src/main/java/com/xsportsx/app/TvHome.kt
          test -s app/src/main/java/com/xsportsx/app/SportsScheduleService.kt
          grep -Fq 'NETWORKS' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -Eqi 'league|leagues' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -Fq 'PublicSourceResolver' app/src/main/java/com/xsportsx/app/StreamResolver.kt
          grep -Fq 'Pairing' app/src/main/java/com/xsportsx/app/PairingQr.kt
          if grep -RInE 'nuvio|xsportsx\.onrender\.com|render\.com' app/src/main/java app/src/main/res 2>/dev/null; then
            echo 'Obsolete remote/Nuvio reference found in production Android source' >&2
            exit 1
          fi
          echo 'Stage 2 source audit passed; no production files were mutated.'
      - name: Build clean debug APKs
        run: gradle clean :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-stage2-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-stage2-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -s "$APK"
          echo "MOBILE_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-mobile.json
      - name: Enable KVM
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Mobile runtime regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: xsportsx-mobile-stage2
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$MOBILE_APK" mobile stage2-mobile-output
        env:
          QA_MODE: mobile
          QA_SOURCE_PORT: 8766
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-stage2-mobile-${{ github.sha }}
          path: |
            stage2-mobile-output/**
            public-schedule-mobile.json
          if-no-files-found: ignore

  tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-stage2-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -s "$APK"
          echo "TV_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-tv.json
      - name: Enable KVM
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: TV runtime regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          avd-name: xsportsx-tv-stage2
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$TV_APK" tv stage2-tv-output
        env:
          QA_MODE: tv
          QA_SOURCE_PORT: 8766
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-stage2-tv-${{ github.sha }}
          path: |
            stage2-tv-output/**
            public-schedule-tv.json
          if-no-files-found: ignore
