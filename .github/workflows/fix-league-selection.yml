name: Restore XSportsX league feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete league catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          all_ids = "Object.keys(LEAGUES)"

          # The sports command center must expose every supported league.
          p = Path('server.js')
          s = p.read_text()
          pat = r"function selectedLeagueSet\(c\)\{.*?\}\nfunction config\(\)\{"
          repl = """function selectedLeagueSet(c){
            // The XSportsX command center is an all-sports feed. Keep every
            // supported league visible even when an older encrypted config
            // contains a partial/legacy sports array.
            return new Set(Object.keys(LEAGUES));
          }
          function config(){"""
          s2, n = re.subn(pat, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('server selectedLeagueSet block not found')
          p.write_text(s2)

          # The public bootstrap manifest was filtering the catalog by the
          # encrypted selection. That can permanently hide leagues in older
          # installs. Publish the complete catalog while the server still
          # controls which events have actual data.
          b = Path('bootstrap.js')
          bs = b.read_text()
          pat2 = r"function selected\(t\)\{.*?\}\nfunction base\(req\)\{"
          repl2 = """function selected(t){
            return new Set(Object.keys(LEAGUES));
          }
          function base(req){"""
          bs2, n2 = re.subn(pat2, repl2, bs, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('bootstrap selected block not found')
          b.write_text(bs2)
          PY

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check bootstrap.js

      - name: Commit league restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js bootstrap.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore complete sports league catalog"
            git push
          fi
