name: Fix XSportsX league selection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make league mapping exact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text()
          pat=r"function selectedLeagueSet\(c\)\{.*?\}\nfunction config\(\)\{"
          repl="""function selectedLeagueSet(c){
            const raw=Array.isArray(c?.sports)?c.sports:[];
            if(!raw.length)return new Set(Object.keys(LEAGUES));
            const labels={
              nfl:['nfl','NFL'],ncaaf:['ncaaf','NCAA Football','college football','college-football'],
              nba:['nba','NBA'],wnba:['wnba','WNBA'],ncaab:['ncaab','NCAA Basketball','college basketball','mens-college-basketball'],
              mlb:['mlb','MLB'],nhl:['nhl','NHL'],mls:['mls','MLS'],
              epl:['epl','Premier League','English Premier League'],ucl:['ucl','UEFA Champions League','Champions League'],
              laliga:['laliga','LaLiga','La Liga'],seriea:['seriea','Serie A'],bundesliga:['bundesliga','Bundesliga'],ligue1:['ligue1','Ligue 1'],
              ufc:['ufc','UFC','MMA'],boxing:['boxing','Boxing']
            };
            const out=new Set();
            for(const value of raw){
              const x=String(value??'').trim().toLowerCase();
              for(const [id,aliases] of Object.entries(labels)){
                if(aliases.some(a=>String(a).trim().toLowerCase()===x)){out.add(id);break;}
              }
            }
            return out;
          }
          function config(){"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('server selectedLeagueSet not found')
          p.write_text(s)

          b=Path('bootstrap.js')
          bs=b.read_text()
          pat2=r"function canonicalSport\(value\)\{.*?\}\n"
          repl2="""function canonicalSport(value){
            const raw=String(value||'').trim().toLowerCase();
            const exact={
              nfl:['nfl'],ncaaf:['ncaaf','ncaa football','college football','college-football'],
              nba:['nba'],wnba:['wnba'],ncaab:['ncaab','ncaa basketball','college basketball','mens-college-basketball'],
              mlb:['mlb'],nhl:['nhl'],mls:['mls'],epl:['epl','premier league','english premier league'],
              ucl:['ucl','uefa champions league','champions league'],laliga:['laliga','la liga'],seriea:['seriea','serie a'],
              bundesliga:['bundesliga'],ligue1:['ligue1','ligue 1'],ufc:['ufc','mma'],boxing:['boxing','box']
            };
            for(const [id,aliases] of Object.entries(exact))if(aliases.includes(raw))return id;
            return raw;
          }
"""
          bs,n2=re.subn(pat2,repl2,bs,count=1,flags=re.S)
          if n2!=1: raise SystemExit('bootstrap canonicalSport not found')
          b.write_text(bs)
          PY

      - name: Validate
        run: |
          node --check server.js
          node --check bootstrap.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js bootstrap.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix exact league selection mapping"; git push; fi
