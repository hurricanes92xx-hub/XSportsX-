name: Fix live and upcoming sports catalogs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch hotfix catalog routing
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('hotfix-entry.js')
          s = p.read_text()

          # Bump the service identity so clients don't retain the old catalog.
          s = s.replace("const VERSION='10.2.0';", "const VERSION='10.3.0';", 1)

          # Expose explicit LIVE NOW, UPCOMING and STARTING SOON catalogs.
          old_manifest = "catalogs:sports.map(id=>({type:'tv',id,name:`${LEAGUES[id][3]} ${LEAGUES[id][0]}`,extra:[],showInHome:true}))"
          new_manifest = "catalogs:[{type:'tv',id:'live-now',name:'🔴 LIVE NOW',extra:[],showInHome:true},{type:'tv',id:'upcoming',name:'⏰ UPCOMING',extra:[],showInHome:true},{type:'tv',id:'starting-soon',name:'⚡ STARTING SOON',extra:[],showInHome:true},...sports.map(id=>({type:'tv',id,name:`${LEAGUES[id][3]} ${LEAGUES[id][0]}`,extra:[],showInHome:true}))]"
          if old_manifest not in s:
              raise SystemExit('manifest catalog pattern not found')
          s = s.replace(old_manifest, new_manifest, 1)

          # Fetch all supported leagues for the three aggregate views, then
          # apply time/state filtering. League-specific catalogs remain fast.
          marker = "async function eventArtwork(req,res,league,eventId){"
          helper = """async function allSportsEvents(){
            return (await Promise.all(Object.keys(LEAGUES).map(events))).flat()
              .sort((a,b)=>new Date(a.start||0)-new Date(b.start||0));
          }
          function aggregateEvents(id,all){
            const now=Date.now();
            if(id==='live-now') return all.filter(e=>e.state==='in');
            if(id==='starting-soon') return all.filter(e=>e.state==='pre' && new Date(e.start||0).getTime()>now && new Date(e.start||0).getTime()<=now+120*60*1000);
            if(id==='upcoming') return all.filter(e=>e.state==='pre' && new Date(e.start||0).getTime()>now);
            return null;
          }
          """
          if marker not in s:
              raise SystemExit('event artwork marker not found')
          if 'async function allSportsEvents()' not in s:
              s = s.replace(marker, helper + marker, 1)

          old_route = "const cm=p.match(/^\\/catalog\\/tv\\/([^/]+)\\.json$/);if(cm&&c){const id=cm[1],allowed=new Set(Object.keys(LEAGUES));if(!allowed.has(id))return json(res,200,{metas:[]});const ev=await events(id);return json(res,200,{metas:ev.map(e=>({id:`sport:${e.league}:${e.id}`,type:'tv',name:`${e.leagueName} • ${e.away.short||e.away.name} vs ${e.home.short||e.home.name}`,poster:`${base(req)}/artwork/event/${e.league}/${e.id}.svg`,background:`${base(req)}/artwork/event/${e.league}/${e.id}.svg`,posterShape:'landscape',description:`${e.leagueName} • ${e.detail}\\n${e.start}`,releaseInfo:e.start,genres:['Sports',e.leagueName],behaviorHints:{isPlayable:true}}))});}"
          new_route = "const cm=p.match(/^\\/catalog\\/tv\\/([^/]+)\\.json$/);if(cm&&c){const id=cm[1],allowed=new Set(Object.keys(LEAGUES));let ev=aggregateEvents(id,await allSportsEvents());if(ev===null){if(!allowed.has(id))return json(res,200,{metas:[]});ev=await events(id);}return json(res,200,{metas:ev.map(e=>({id:`sport:${e.league}:${e.id}`,type:'tv',name:`${e.leagueName} • ${e.away.short||e.away.name} vs ${e.home.short||e.home.name}`,poster:`${base(req)}/artwork/event/${e.league}/${e.id}.svg`,background:`${base(req)}/artwork/event/${e.league}/${e.id}.svg`,posterShape:'landscape',description:`${e.leagueName} • ${e.detail}\\n${e.start}`,releaseInfo:e.start,genres:['Sports',e.leagueName],behaviorHints:{isPlayable:true}}))});}"
          if old_route not in s:
              raise SystemExit('catalog route pattern not found')
          s = s.replace(old_route, new_route, 1)

          p.write_text(s)

      - name: Validate
        run: node --check hotfix-entry.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotfix-entry.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore live and upcoming sports catalogs"
            git push
          fi
