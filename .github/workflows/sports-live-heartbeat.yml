name: XSportsX Live Intelligence Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-live-heartbeat
  queue: max
  cancel-in-progress: false

env:
  SPORTS_AGENT_MODEL_URL: ${{ vars.SPORTS_AGENT_MODEL_URL }}
  SPORTS_AGENT_MODEL: ${{ vars.SPORTS_AGENT_MODEL }}
  SPORTS_AGENT_GEMINI_MODEL_URL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL_URL }}
  SPORTS_AGENT_GEMINI_MODEL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL }}

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical feed
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install provider dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Verify canonical feed exists
        run: |
          test -s data/schedule_feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/schedule_feed.json').read_text())
          if not isinstance(d.get('events'), list): raise SystemExit('Invalid canonical feed')
          print(f"Heartbeat input events: {len(d['events'])}")
          PY
      - name: Run lightweight live intelligence
        env:
          PYTHONUNBUFFERED: '1'
          SPORTS_AGENT_MODEL_API_KEY: ${{ secrets.SPORTS_AGENT_MODEL_API_KEY }}
          SPORTS_AGENT_GEMINI_API_KEY: ${{ secrets.SPORTS_AGENT_GEMINI_API_KEY }}
        run: |
          python3 scripts/sports_agent.py data/schedule_feed.json --mode live --memory data/sports_brain_memory.json --graph data/sports_knowledge_graph.json
      - name: Persist heartbeat state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live Bot'
          git config user.email 'xsportsx-live-bot@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then echo 'No live intelligence changes.'; exit 0; fi
          git commit -m 'chore: refresh live sports intelligence'
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            if git rebase --autostash origin/android-app; then
              if git push origin HEAD:android-app; then echo "Heartbeat publish succeeded on attempt ${attempt}."; exit 0; fi
            else
              git rebase --abort || true
              git reset --mixed origin/android-app
              git add -A data/
              if ! git diff --cached --quiet; then git commit -m 'chore: rebuild live intelligence publish'; fi
            fi
            sleep $((attempt * 2))
          done
          echo 'ERROR: heartbeat publish failed after five attempts'
          exit 1
