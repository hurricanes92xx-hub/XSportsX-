name: Ultimate live game resolver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install resolver patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sports-router.js')
          s=p.read_text()

          # New release prefix so Nuvio does not keep the old resolver cached.
          s=s.replace('const VERSION="5.0.22";', 'const VERSION="5.0.24";', 1)
          s=s.replace('const PREFIX="v520";', 'const PREFIX="v524";', 1)

          # Preserve the provider EPG channel id in every Xtream stream record.
          old='xtream:{streamUrl:`${c.server}/live/${encodeURIComponent(c.username)}/${encodeURIComponent(c.password)}/${encodeURIComponent(s.stream_id)}.${ext}`,category:cat}'
          new='xtream:{streamUrl:`${c.server}/live/${encodeURIComponent(c.username)}/${encodeURIComponent(c.password)}/${encodeURIComponent(s.stream_id)}.${ext}`,category:cat,epgChannelId:String(s.epg_channel_id||"")}'
          if old in s:
              s=s.replace(old,new,1)

          # Add a text fetcher for XMLTV. This lets us inspect the provider EPG in one request
          # instead of making a separate EPG request for every channel.
          if 'async function getText(' not in s:
              needle='async function getJson(url,timeout=6500){'
              helper='''async function getText(url,timeout=12000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(url,{signal:controller.signal,headers:{accept:"application/xml,text/xml,text/plain","user-agent":`XSportsX/${VERSION}`}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text();}finally{clearTimeout(timer);}}\n'''
              s=s.replace(needle,helper+needle,1)

          # Replace the old limited resolver with a provider-wide resolver.
          start=s.find('async function streamsForEvent(c,meta){')
          end=s.find('async function ufcCatalog(){', start)
          if start < 0 or end < 0:
              raise SystemExit('streamsForEvent markers not found')

          resolver=r'''function decodeXml(v){return String(v??'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();}
function eventTerms(meta){
  const e=meta?.event||{}, out=new Set();
  const add=v=>{const n=norm(v);if(n)out.add(n);};
  for(const t of [e.home,e.away]){
    if(!t)continue;
    add(t.name); add(t.displayName); add(t.short); add(t.abbreviation);
    const raw=String(t.name||t.displayName||'').toLowerCase();
    raw.replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(x=>x.length>=3).forEach(add);
  }
  add(meta?.name);
  return [...out];
}
function eventTokenSet(meta){return [...new Set(eventTerms(meta).flatMap(x=>norm(x).split(' ').filter(w=>w.length>=3)))];}
function scoreEventText(text,meta){
  const v=norm(text), e=meta?.event||{}, tokens=eventTokenSet(meta); let score=0, hits=0;
  for(const t of tokens){if(v.includes(t)){hits++;score+=t.length>=5?18:10;}}
  const home=teamTerms(e.home||{}),away=teamTerms(e.away||{});
  const h=home.some(x=>x&&v.includes(norm(x))), a=away.some(x=>x&&v.includes(norm(x)));
  if(h&&a)score+=55; else if(h||a)score+=22;
  if(/\blive\b|\bnow playing\b|\bcoverage\b/i.test(String(text)))score+=8;
  return Math.min(100,score);
}
function parseXmltvDate(v){
  const raw=String(v||'').trim(); if(!raw)return 0;
  const m=raw.match(/^(\d{14})(?:\s+([+-]\d{4}))?/); if(!m)return Date.parse(raw)||0;
  const z=m[2]||'+0000';
  const iso=`${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}T${m[1].slice(8,10)}:${m[1].slice(10,12)}:${m[1].slice(12,14)}${z.slice(0,3)}:${z.slice(3)}`;
  return Date.parse(iso)||0;
}
const xmltvCache=new Map();
async function getXmltv(c){
  const key=`xmltv:${c.server}|${c.username}`, hit=xmltvCache.get(key);
  if(hit&&Date.now()-hit.at<60000)return hit.value;
  try{
    const u=new URL(`${c.server}/xmltv.php`);u.searchParams.set('username',c.username);u.searchParams.set('password',c.password);
    const xml=await getText(u.toString(),14000), rows=[];
    const re=/<programme\b([^>]*)>([\s\S]*?)<\/programme>/gi; let m;
    while((m=re.exec(xml))){
      const attrs=m[1], body=m[2], cm=attrs.match(/\bchannel=["']([^"']+)["']/i), sm=attrs.match(/\bstart=["']([^"']+)["']/i), em=attrs.match(/\bstop=["']([^"']+)["']/i);
      if(!cm)continue;
      const title=(body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'', desc=(body.match(/<desc[^>]*>([\s\S]*?)<\/desc>/i)||[])[1]||'';
      rows.push({channel:decodeXml(cm[1]),title:decodeXml(title.replace(/<[^>]+>/g,'')),description:decodeXml(desc.replace(/<[^>]+>/g,'')),start:parseXmltvDate(sm?.[1]),stop:parseXmltvDate(em?.[1])});
    }
    const value=rows;xmltvCache.set(key,{at:Date.now(),value});return value;
  }catch{return hit?.value||[];}
}
function programMatchesEvent(row,meta){
  const score=scoreEventText(`${row.title||''} ${row.description||''}`,meta);
  if(!score)return 0;
  const es=Date.parse(meta?.event?.start||'')||0, now=Date.now(), ps=Number(row.start||0), pe=Number(row.stop||0);
  let time=0;
  if(ps&&pe&&now>=ps-15*60000&&now<=pe+30*60000)time=28;
  else if(ps&&es){const d=Math.abs(ps-es);if(d<=2*3600000)time=16;else if(d<=6*3600000)time=8;}
  return Math.min(100,score+time);
}
async function streamsForEvent(c,meta){
  if(!c||!meta?.event)return[];
  const cacheKey=`match:v524:${c.server}|${c.username}|${meta.id}`,cached=sourceMatchCache.get(cacheKey);
  if(cached&&Date.now()-cached.at<30000)return cached.value;
  const d=await xtreamData(c), all=Array.isArray(d.metas)?d.metas:[];
  if(!all.length)return[];

  const results=new Map();
  const add=(m,score,reason)=>{
    if(!m?.xtream?.streamUrl)return;
    const id=String(m.id); const prev=results.get(id);
    if(!prev||score>prev.score)results.set(id,{name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:`${m.xtream.category||'Live TV'} • ${reason}`,score});
  };

  // Pass 1: channel-name/category matching. This is fast and catches feeds whose
  // provider puts the matchup directly in the channel name.
  for(const m of all){
    const text=`${m.name||''} ${m.xtream?.category||''}`;
    let score=scoreEventText(text,meta);
    if(meta.event.league==='ufc' && /\bufc\b|fight pass|fight night|mma|pay per view|ppv/i.test(text))score=Math.max(score,48);
    if(score>=45)add(m,score,'channel match');
  }

  // Pass 2: provider-wide XMLTV scan. This is the important part: do not restrict
  // the search to 180 sports channels, because many providers put event feeds under
  // generic categories or under channel names that contain no sport/team name.
  const programs=await getXmltv(c);
  if(Array.isArray(programs)&&programs.length){
    const byChannel=new Map();
    for(const p of programs){const k=norm(p.channel);if(!k)continue;let a=byChannel.get(k);if(!a)byChannel.set(k,a=[]);a.push(p);}
    for(const m of all){
      const keys=[m.xtream?.epgChannelId,m.name].map(norm).filter(Boolean);
      let best=0,bestRow=null;
      for(const key of keys){
        for(const row of (byChannel.get(key)||[])){
          const s=programMatchesEvent(row,meta);if(s>best){best=s;bestRow=row;}
        }
      }
      // If the provider's XMLTV channel id is not equal to its display name,
      // perform a bounded text fallback against all programmes for this event.
      if(best<55){
        for(const row of programs){
          const s=programMatchesEvent(row,meta);if(s>best){best=s;bestRow=row;}
        }
      }
      if(best>=55)add(m,best,`EPG match ${best}%${bestRow?.title?` • ${bestRow.title}`:''}`);
    }
  }

  // Pass 3: short-EPG fallback for providers that do not expose XMLTV.
  if(!results.size || (programs||[]).length===0){
    const pool=all.slice(0,Math.min(all.length,500)); let idx=0;
    const worker=async()=>{while(true){const i=idx++;if(i>=pool.length)return;const m=pool[i],sid=String(m.id||'').replace(/^xtream:/,'');if(!sid)continue;const rows=await getShortEpg(c,sid);let best=0,bestRow=null;for(const row of Array.isArray(rows)?rows:[]){const s=programMatchesEvent({title:decodeXtreamText(row.title||''),description:decodeXtreamText(row.description||''),start:Number(row.start_timestamp||0)*1000,stop:Number(row.stop_timestamp||0)*1000},meta);if(s>best){best=s;bestRow=row;}}if(best>=55)add(m,best,`EPG match ${best}%${bestRow?.title?` • ${decodeXtreamText(bestRow.title)}`:''}`);}};
    await Promise.all(Array.from({length:Math.min(12,pool.length)},worker));
  }

  const value=[...results.values()].sort((a,b)=>b.score-a.score).slice(0,100);
  sourceMatchCache.set(cacheKey,{at:Date.now(),value});
  return value;
}
'''
          s=s[:start]+resolver+s[end:]
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check sports-router.js
      - name: Commit generated resolver
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-router.js .github/workflows/ultimate-live-resolver.yml
          git diff --cached --quiet || git commit -m 'feat: resolve every live game to all matching Xtream channels'
          git push
