name: Refresh live event status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsportsx-live-status
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production schedule branch
        uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile live events from authoritative scoreboards
        id: reconcile
        continue-on-error: true
        run: python3 scripts/reconcile_live_status.py

      - name: Publish live status changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- data/schedule_feed.json; then
            echo 'No live status changes.'
          else
            git add data/schedule_feed.json
            git commit -m 'chore: reconcile live event status'
          fi

          for attempt in 1 2 3; do
            git fetch origin android-app
            git rebase origin/android-app || {
              git rebase --abort || true
              git reset --hard origin/android-app
              python3 scripts/reconcile_live_status.py || true
              git add data/schedule_feed.json
              git diff --cached --quiet || git commit -m 'chore: reconcile live event status'
            }
            if git push origin HEAD:android-app; then
              exit 0
            fi
            git reset --hard origin/android-app
            python3 scripts/reconcile_live_status.py || true
            git add data/schedule_feed.json
            git diff --cached --quiet || git commit -m 'chore: reconcile live event status'
            sleep $((attempt * 2))
          done
          echo 'Unable to publish live status after three attempts.' >&2
          exit 1

      - name: Fail if scoreboard reconciliation had provider errors
        if: steps.reconcile.outcome == 'failure'
        run: |
          echo 'One or more ESPN scoreboard endpoints failed. Changes from healthy leagues were still published.'
          exit 1
