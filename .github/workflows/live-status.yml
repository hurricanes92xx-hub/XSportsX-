name: Refresh live event status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsportsx-live-status
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout production schedule branch
        uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile live events from authoritative scoreboards
        run: python3 scripts/reconcile_live_status.py

      - name: Publish live status changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then
            echo 'No live status changes.'
            exit 0
          fi
          git commit -m 'chore: reconcile live event status'
          for attempt in 1 2 3; do
            git fetch origin android-app
            git rebase origin/android-app
            if git push origin HEAD:android-app; then exit 0; fi
            git rebase --abort || true
            git reset --hard origin/android-app
            python3 scripts/reconcile_live_status.py
            git add data/schedule_feed.json
            git diff --cached --quiet || git commit -m 'chore: reconcile live event status'
            sleep $((attempt * 2))
          done
          echo 'Unable to publish live status after three attempts.' >&2
          exit 1
