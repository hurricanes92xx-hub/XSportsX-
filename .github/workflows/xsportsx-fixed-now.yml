name: XSportsX Fixed Emulator QA Now

on:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-fixed-now.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-fixed-emulator-qa
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply required source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
      - name: Build current debug APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xsportsx-fixed-apks-${{ github.run_id }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: xsportsx-fixed-apks-${{ github.run_id }}
          path: test-apks
      - name: Enable KVM
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run fixed mobile regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: xsportsx-mobile-fixed
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$MOBILE_APK" mobile test-output-mobile-fixed
        env:
          MOBILE_APK: ${{ github.workspace }}/test-apks/app-mobile-debug.apk
          QA_MODE: mobile
          QA_SOURCE_PORT: 8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsportsx-fixed-mobile-${{ github.run_id }}
          path: test-output-mobile-fixed/**
          if-no-files-found: ignore

  tv:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: xsportsx-fixed-apks-${{ github.run_id }}
          path: test-apks
      - name: Enable KVM
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run fixed TV regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          avd-name: xsportsx-tv-fixed
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$TV_APK" tv test-output-tv-fixed
        env:
          TV_APK: ${{ github.workspace }}/test-apks/app-tv-debug.apk
          QA_MODE: tv
          QA_SOURCE_PORT: 8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsportsx-fixed-tv-${{ github.run_id }}
          path: test-output-tv-fixed/**
          if-no-files-found: ignore
