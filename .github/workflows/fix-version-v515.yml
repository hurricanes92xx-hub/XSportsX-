name: Fix XSportsX version v515
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix manifest version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sports-router.js')
          s = p.read_text()
          s = s.replace('const VERSION = "5.0.12";', 'const VERSION = "5.0.15";')
          s = s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v512";', 'const ADDON_ID = "com.xsportsx.sports.epg.v515";')
          p.write_text(s)
          PY
          node --check sports-router.js
          grep -n 'VERSION\|ADDON_ID\|PREFIX' sports-router.js | head -5
      - name: Commit fixed version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix manifest version to v5.0.15 / v515'
          git push
