name: Repair Sports News catalog v516
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make Sports News catalog persistent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          old='if(path==="/catalog/channel/sports-news.json"){if(!c)return json(res,{metas:[]});return json(res,{metas:(await xtreamData(c)).newsGroups},200,15)}'
          new='''if(path==="/catalog/channel/sports-news.json"){
            const fallback=Object.keys(NEWS_GROUPS).map(group=>({id:`news:${newsSlug(group)}`,type:"channel",name:group,poster:newsLogo(group),background:newsLogo(group),description:`${group} sports news and live network channels from your authorized Xtream provider`,genres:["Sports News",group],behaviorHints:{isLive:true},newsGroup:group}));
            if(!c)return json(res,{metas:fallback},200,30);
            const groups=(await xtreamData(c)).newsGroups;
            return json(res,{metas:groups.length?groups:fallback},200,15);
          }'''
          if old not in s: raise SystemExit('news route marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check sports-router.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-router.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep Sports News catalog visible in v516"
          git push
