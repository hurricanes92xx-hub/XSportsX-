name: XSportsX Final Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: apply XSportsX final deployment patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch XSportsX router and Render proxy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const VERSION = "5.0.10";', 'const VERSION = "5.0.11";')
          s=s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v510";', 'const ADDON_ID = "com.xsportsx.sports.epg.v511";')
          s=s.replace('const PREFIX = "/v510";', 'const PREFIX = "/v511";')
          # Remove the stale unreachable statements in xtream().
          s=s.replace('inFlight.set(key,job);return job;xtreamCache.set(key,{at:Date.now(),value:v});return v;', 'inFlight.set(key,job);return job;')
          p.write_text(s)

          p=Path('render-proxy.js')
          s=p.read_text()
          s=s.replace('PREFIX="v510"', 'PREFIX="v511"')
          s=s.replace('"v510","v509"', '"v511","v510","v509"')
          s=s.replace('v510-compatible', 'v511-compatible')
          p.write_text(s)
          PY

          node --check sports-router.js
          node --check render-proxy.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js render-proxy.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply XSportsX final deployment patch'
          git push
