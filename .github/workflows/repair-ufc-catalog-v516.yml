name: Repair UFC catalog v516
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair UFC route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          changed=False
          if 'import { getUfcData } from "./ufc-data.js";' not in s:
              s=s.replace('import crypto from "node:crypto";','import crypto from "node:crypto";\nimport { getUfcData } from "./ufc-data.js";',1)
              changed=True
          marker='async function ufcCatalog()'
          if marker not in s:
              fn='''async function ufcCatalog(){\n  try {\n    const events=await getUfcData();\n    const metas=events.map((e,i)=>({id:`sport:ufc-${e.id||i}`,type:"channel",name:e.name||"UFC Event",poster:`${BASE}${PREFIX}/assets/ufc.svg`,background:`${BASE}${PREFIX}/assets/ufc.svg`,description:`🥊 UFC\\n${e.date||"Upcoming event"}\\n${e.venue||""}`,releaseInfo:e.date||new Date().toISOString(),genres:["Sports","UFC","MMA"],sportSource:"ufc",eventSport:"ufc",league:"ufc",eventId:String(e.id||i),event:{id:String(e.id||i),league:"ufc",start:e.date||"",state:"pre",home:{name:"UFC",short:"UFC"},away:{name:e.name||"UFC Event",short:"UFC"}}}));\n    if(metas.length)return metas.slice(0,50);\n  } catch {}\n  return [{id:"sport:ufc-command-center",type:"channel",name:"UFC Events & PPV",poster:`${BASE}${PREFIX}/assets/ufc.svg`,background:`${BASE}${PREFIX}/assets/ufc.svg`,description:"🥊 UFC Fight Night • PPV • UFC-related events",releaseInfo:new Date().toISOString(),genres:["Sports","UFC","MMA"],sportSource:"ufc",eventSport:"ufc",league:"ufc",eventId:"ufc-command-center",event:{id:"ufc-command-center",league:"ufc",start:"",state:"pre",home:{name:"UFC",short:"UFC"},away:{name:"UFC Events",short:"UFC"}}}];\n}\n'''
              s=s.replace('function manifest(){',fn+'function manifest(){',1)
              changed=True
          old='if(id==="ufc"){const ms=await leagueCatalog("ufc").catch(()=>[]);return json(res,{metas:ms.slice(0,100)},200,30)}'
          new='if(id==="ufc"){const ms=await ufcCatalog();return json(res,{metas:ms},200,30)}'
          if old in s:
              s=s.replace(old,new,1); changed=True
          p.write_text(s)
          print('changed=',changed)
          PY
          node --check sports-router.js
          node --check ufc-data.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-router.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix UFC catalog visibility in v516"
          git push