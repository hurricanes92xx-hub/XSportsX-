name: Source health

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh authorized sources
        env:
          AUTHORIZED_SOURCE_FEEDS: ${{ secrets.AUTHORIZED_SOURCE_FEEDS }}
          MIN_SOURCES: '5'
        run: node source-manager.js
      - name: Commit source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json
          git diff --cached --quiet || git commit -m 'chore: refresh healthy sources'
          git push
