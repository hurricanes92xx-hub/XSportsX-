name: XSportsX Performance Hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/performance-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const VERSION = "5.0.14";', 'const VERSION = "5.0.15";')
          s=s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v514";', 'const ADDON_ID = "com.xsportsx.sports.epg.v515";')
          s=s.replace('const PREFIX = "/v514";', 'const PREFIX = "/v515";')
          s=s.replace('const cache=new Map(),eventCache=new Map(),xtreamCache=new Map(),inFlight=new Map();', 'const cache=new Map(),eventCache=new Map(),xtreamCache=new Map(),inFlight=new Map(),sourceMatchCache=new Map();')
          s=s.replace('async function getJson(url){const r=await fetch(url,{headers:{accept:"application/json","user-agent":`XSportsX/${VERSION}`}});', 'async function getJson(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(url,{signal:controller.signal,headers:{accept:"application/json","user-agent":`XSportsX/${VERSION}`}});')
          s=s.replace('if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}', 'if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();}finally{clearTimeout(timer);}}')
          s=s.replace('async function streamsForEvent(c,meta){if(!c||!meta?.event)return[];const d=await xtreamData(c);', 'async function streamsForEvent(c,meta){if(!c||!meta?.event)return[];const cacheKey=`match:${c.server}|${c.username}|${meta.id}`;const cached=sourceMatchCache.get(cacheKey);if(cached&&Date.now()-cached.at<300000)return cached.value;const d=await xtreamData(c);')
          old='const matches=d.metas.map(m=>({m,score:matchEventChannel(m,meta.event)})).filter(x=>x.score>=40).sort((a,b)=>b.score-a.score).slice(0,8);return matches.map(x=>({name:`▶ ${x.m.name}`,url:x.m.xtream.streamUrl,title:x.m.name,description:`${x.m.xtream.category} • match ${x.score}%`,score:x.score}));}'
          new='const matches=d.metas.map(m=>({m,score:matchEventChannel(m,meta.event)})).filter(x=>x.score>=40).sort((a,b)=>b.score-a.score).slice(0,8);const value=matches.map(x=>({name:`▶ ${x.m.name}`,url:x.m.xtream.streamUrl,title:x.m.name,description:`${x.m.xtream.category} • match ${x.score}%`,score:x.score}));sourceMatchCache.set(cacheKey,{at:Date.now(),value});return value;}'
          s=s.replace(old,new)
          # Pre-warm the Xtream index whenever configuration is successfully decoded.
          s=s.replace('return decryptConfig(u.searchParams.get("config"));}', 'const cfg=decryptConfig(u.searchParams.get("config"));if(cfg)warmXtream(cfg);return cfg;}')
          p.write_text(s)
          PY
          node --check sports-router.js
      - name: Commit performance patch
        run: |
          git config user.name 'XSportsX Bot'
          git config user.email 'actions@github.com'
          git add sports-router.js
          git diff --cached --quiet || git commit -m 'perf: cache-first source matching and timeouts'
          git push