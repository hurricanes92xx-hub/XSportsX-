name: One-time logo lockdown

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply deterministic logo patch
        run: python3 scripts/lock_logo_fix.py
      - name: Commit patched sources and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock-logo-fix.yml scripts/lock_logo_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt scripts/patch_sports_badges.py .github/workflows/lock-logo-fix.yml scripts/lock_logo_fix.py
          git commit -m 'fix: lock down sports logos [skip ci]'
          git push origin android-app
