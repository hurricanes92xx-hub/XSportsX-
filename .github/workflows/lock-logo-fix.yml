name: One-time logo lockdown

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logo sources and fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Mobile home: remove Google favicon dependencies from static network/sport cards.
          p = Path('app/src/main/java/com/xsportsx/app/FuturisticSports.kt')
          s = p.read_text()
          s = re.sub(r'(XNetwork\("[^"]+"\s*,\s*"[^"]+"\s*,\s*"[^"]+"\s*,\s*)"[^"]*"(\))', r'\1""\2', s)
          s = re.sub(r'(SportVisual\("[^"]+"\s*,\s*"[^"]+"\s*,\s*)"https://www\.google\.com/s2/favicons[^\"]*"(\))', r'\1""\2', s)
          s = s.replace('https://www.google.com/s2/favicons?domain:worldlacrosse.sport&sz=128', '')
          s = s.replace('https://www.google.com/s2/favicons?domain:fiawec.com&sz=128', '')
          s = s.replace('https://www.google.com/s2/favicons?domain:fiaformulae.com&sz=128', '')

          badge = '''@Composable private fun LockedLogo(label:String, name:String = label, size:androidx.compose.ui.unit.Dp=62.dp){
              val k=name.uppercase()
              val bg=when{ k.contains("ESPN")||k.contains("F1") -> Color(0xFFE50920); k.contains("SEC") -> Color(0xFF174A7E); k.contains("ACC") -> Color(0xFF0066A1); k.contains("B1G") -> Color(0xFF151A20); k.contains("NFL") -> Color(0xFF013369); k.contains("NBA") -> Color(0xFF17408B); k.contains("NASCAR") -> Color(0xFF101318); k.contains("DTM") -> Color(0xFF28384A); k.contains("MONSTER") -> Color(0xFF151515); k.contains("RUGBY") -> Color(0xFF0B5E45); else -> Color(0xFF202A38) }
              Box(Modifier.size(size).clip(RoundedCornerShape(size/3)).background(bg),contentAlignment=Alignment.Center){Text(label,color=Color.White,fontSize=if(label.length>6)8.sp else 14.sp,fontWeight=FontWeight.Black,maxLines=1,overflow=TextOverflow.Ellipsis)}
          }

          '''
          anchor='@Composable private fun BadgeImage'
          if 'private fun LockedLogo(' not in s:
              s=s.replace(anchor,badge+anchor,1)
          old='''@Composable private fun BadgeImage(url: String, fallback: String, modifier: Modifier = Modifier) {
              var failed by remember(url) { mutableStateOf(false) }
              if (!failed && url.isNotBlank()) {
                  AsyncImage(model = url, contentDescription = fallback, modifier = modifier, contentScale = ContentScale.Fit, onError = { failed = true })
              } else {
                  SportGlyph(fallback, 38.dp)
              }
          }'''
          new='''@Composable private fun BadgeImage(url:String,fallback:String,modifier:Modifier=Modifier){
              var failed by remember(url){mutableStateOf(false)}
              if(!failed && url.isNotBlank()) AsyncImage(model=url,contentDescription=fallback,modifier=modifier,contentScale=ContentScale.Fit,onError={failed=true})
              else LockedLogo(fallback,fallback,modifier.width(72.dp).height(72.dp).size(72.dp))
          }'''
          if old in s: s=s.replace(old,new,1)
          else: raise SystemExit('BadgeImage block not found')
          start=s.find('@Composable private fun NetworkCard')
          end=s.find('@Composable private fun BrandPill',start)
          if start<0 or end<0: raise SystemExit('NetworkCard anchors not found')
          network='''@Composable private fun NetworkCard(network:XNetwork,onClick:(XNetwork)->Unit){Column(Modifier.width(132.dp).height(124.dp).clip(RoundedCornerShape(18.dp)).background(Panel).clickable{onClick(network)}.padding(10.dp),horizontalAlignment=Alignment.CenterHorizontally){Box(Modifier.fillMaxWidth().height(70.dp).clip(RoundedCornerShape(12.dp)).background(Color(0xFF0A0F17)),contentAlignment=Alignment.Center){LockedLogo(network.icon,network.name,52.dp)};Spacer(Modifier.height(7.dp));Text(network.name,color=Color.White,fontSize=10.sp,fontWeight=FontWeight.Bold,maxLines=1,overflow=TextOverflow.Ellipsis)}}
'''
          s=s[:start]+network+s[end:]
          p.write_text(s)

          # TV patch script: never generate Google favicon or SVG-only remote assets;
          # its tiles will render the textual brand mark when URL is empty.
          q=Path('scripts/patch_sports_badges.py')
          t=q.read_text()
          t=re.sub(r'"https://www\.google\.com/s2/favicons\?domain=[^\"]+"','""',t)
          t=re.sub(r'"https://commons\.wikimedia\.org/wiki/Special:Redirect/file/[^\"]+"','""',t)
          q.write_text(t)
          print('Logo lockdown patch applied')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock-logo-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt scripts/patch_sports_badges.py .github/workflows/lock-logo-fix.yml
          git commit -m 'fix: lock down sports logos [skip ci]'
          git push origin android-app
