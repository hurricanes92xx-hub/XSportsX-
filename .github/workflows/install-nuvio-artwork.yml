name: Install Nuvio artwork middleware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install middleware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server-fixed.js')
          s = p.read_text()
          imp = 'import { installNuvioArtwork } from "./nuvio-artwork-middleware.js";'
          if imp not in s:
              marker = 'import { artworkForEvent, artworkForLeague } from "./artwork.js";'
              if marker not in s:
                  raise SystemExit('artwork import marker not found')
              s = s.replace(marker, marker + '\n' + imp, 1)
          call = 'installNuvioArtwork(app);'
          if call not in s:
              marker = 'const app = express();'
              if marker not in s:
                  raise SystemExit('express app marker not found')
              s = s.replace(marker, marker + '\n' + call, 1)
          p.write_text(s)
          PY
          node --check server-fixed.js
          node --check nuvio-artwork-middleware.js
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'xsportsx-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server-fixed.js nuvio-artwork-middleware.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Guarantee artwork metadata on every Nuvio catalog response'
          git push
