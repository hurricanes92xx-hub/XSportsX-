name: Apply mobile league filter fix
on:
  push:
    branches: [android-app]
    paths:
      - '.github/MOBILE_LEAGUE_FILTER_FIX_TRIGGER'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 1
      - name: Patch mobile league selection
        shell: bash
        run: |
          set -euo pipefail
          f='app/src/main/java/com/xsportsx/app/FuturisticSports.kt'
          test -s "$f"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/FuturisticSports.kt')
          s = p.read_text()
          old = '''fun FuturisticHome(onConnect: () -> Unit = {}, onNetwork: (XNetwork) -> Unit = {}) {'''
          new = '''fun FuturisticHome(onConnect: () -> Unit = {}, onNetwork: (XNetwork) -> Unit = {}) {
              var selectedSport by remember { mutableStateOf<String?>(null) }'''
          if old not in s:
              raise SystemExit('FuturisticHome signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''when (selectedSection) { "LIVE" -> MobileLiveCenter(sourceConfigured, onConnect, onNetwork); "NETWORKS" -> MobileNetworks(sourceConfigured, onConnect, onNetwork); "FAVORITES" -> MobileFavorites(onConnect); else -> MobileHomeContent(sourceConfigured, onConnect, onNetwork) }'''
          new = '''when {
              selectedSport != null -> LiveChannelsScreen(filter = mobileSportFilter(selectedSport!!), onBack = { selectedSport = null })
              selectedSection == "LIVE" -> MobileLiveCenter(sourceConfigured, onConnect, onNetwork)
              selectedSection == "NETWORKS" -> MobileNetworks(sourceConfigured, onConnect, onNetwork)
              selectedSection == "FAVORITES" -> MobileFavorites(onConnect)
              else -> MobileHomeContent(sourceConfigured, onConnect, onNetwork) { selectedSport = it }
          }'''
          if old not in s:
              raise SystemExit('selectedSection anchor not found')
          s = s.replace(old, new, 1)
          old = '''@Composable private fun MobileHomeContent(sourceConfigured: Boolean, onConnect: () -> Unit, onNetwork: (XNetwork) -> Unit) {'''
          new = '''@Composable private fun MobileHomeContent(sourceConfigured: Boolean, onConnect: () -> Unit, onNetwork: (XNetwork) -> Unit, onSport: (String) -> Unit) {'''
          if old not in s:
              raise SystemExit('MobileHomeContent signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''items(sports, key = { it.name }) { sport -> SportBadgeCard(sport) { onConnect() } }'''
          new = '''items(sports, key = { it.name }) { sport -> SportBadgeCard(sport) { onSport(sport.name) } }'''
          if old not in s:
              raise SystemExit('sport card click anchor not found')
          s = s.replace(old, new, 1)
          marker = '''@Composable private fun MobileSectionLabel(title: String, eyebrow: String?) {'''
          helper = '''private fun mobileSportFilter(sport: String): String = when (sport.uppercase()) {
              "NFL" -> "nfl||nfl network"
              "NBA" -> "nba"
              "NCAA FB" -> "ncaaf||ncaa football||college football"
              "NCAA BB" -> "ncaab||ncaa basketball||college basketball"
              "MLB" -> "mlb||major league baseball"
              "NHL" -> "nhl||national hockey league"
              "UFC" -> "ufc||ultimate fighting championship"
              "BOXING" -> "boxing||world boxing"
              "RUGBY" -> "rugby||rugby pass"
              "VOLLEYBALL" -> "volleyball||fivb"
              "LACROSSE" -> "lacrosse||world lacrosse"
              "WRESTLING" -> "wrestling||wwe||aew"
              "MOTOGP" -> "motogp||moto gp"
              "WRC" -> "wrc||world rally championship"
              "WEC" -> "wec||world endurance championship"
              "IMSA" -> "imsa"
              "FORMULA E" -> "formula e||formulae"
              "MXGP" -> "mxgp||motocross"
              "MONSTER JAM" -> "monster jam"
              "ESPORTS" -> "esports"
              "ACTION SPORTS" -> "action sports"
              else -> sport
          }

          @Composable private fun MobileSectionLabel(title: String, eyebrow: String?) {'''
          if marker not in s:
              raise SystemExit('helper insertion marker not found')
          s = s.replace(marker, helper, 1)
          p.write_text(s)
          PY
          grep -q 'selectedSport' "$f"
          grep -q 'mobileSportFilter' "$f"
          grep -q 'onSport(sport.name)' "$f"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          git commit -m 'fix mobile league selection filtering' || exit 0
          git push origin android-app
