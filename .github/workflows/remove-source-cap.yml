name: Remove event source cap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove arbitrary source limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const value=[...results.values()].sort((a,b)=>b.score-a.score).slice(0,100);', 'const value=[...results.values()].sort((a,b)=>b.score-a.score);', 1)
          p.write_text(s)
          PY
          node --check sports-router.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-router.js .github/workflows/remove-source-cap.yml
          git diff --cached --quiet || git commit -m 'fix: return every matching event source'
          git push
