name: Refresh complete schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [android-app]
    paths:
      - 'scripts/refresh_schedules.py'
      - 'scripts/refresh_schedules_engine.py'
      - 'scripts/refresh_schedules_resilient.py'
      - 'scripts/official_api_adapters.py'
      - 'scripts/season_intelligence.py'
      - 'scripts/schedule_engine.py'
      - 'scripts/schedule_engine_safe.py'
      - 'data/official_schedule_sources.json'
      - 'data/schedule_season_policy.json'
      - '.github/workflows/refresh-schedules.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh canonical schedule feed through resilient season-aware engine
        run: python scripts/refresh_schedules_resilient.py
      - name: Add authoritative official API schedules
        run: python scripts/official_api_adapters.py
      - name: Validate feed invariants
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p=json.load(open('data/schedule_feed.json'))
          events=p.get('events') or []
          assert events, 'schedule feed is empty'
          assert p.get('schema',0) >= 5, 'unexpected schedule schema'
          assert len(events) == len({(e.get('league'),e.get('title'),e.get('start')) for e in events}), 'duplicate events'
          bad=[]
          for e in events:
            try: datetime.fromisoformat(e['start'].replace('Z','+00:00'))
            except Exception: bad.append(e)
          assert not bad, f'invalid event timestamps: {len(bad)}'
          print(f'validated {len(events)} events across {len(p.get("eventCounts",{}))} leagues')
          print('official source failures:', p.get('officialSourceFailures', []))
          print('provider failures:', p.get('failedSources', []))
          print('official API adapters:', p.get('officialApiAdapterReport', {}))
          si=p.get('seasonIntelligence',{})
          print('season intelligence decisions:', len(si.get('providerDecisions',[])))
          PY
      - name: Publish schedule feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json
          git diff --cached --quiet || git commit -m 'chore: refresh complete schedule feed'
          git push
