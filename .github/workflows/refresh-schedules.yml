name: Refresh XSportsX schedules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/refresh_schedules.py'
      - 'scripts/google_sports_intelligence.py'
      - 'scripts/refresh_sports_news.py'
      - 'scripts/source_catalog_diff.py'
      - 'scripts/refresh_sports_api_intelligence.py'
      - 'data/telegram_sports_intelligence.json'
      - 'data/epg_intelligence_sources.json'
      - 'data/event_intelligence_graph.json'
      - 'data/sports_api_intelligence.json'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout android-app
        uses: actions/checkout@v4
        with:
          ref: android-app
      - name: Refresh schedule feed
        run: python3 scripts/refresh_schedules.py
      - name: Refresh Google sports intelligence manifest
        run: python3 scripts/google_sports_intelligence.py
      - name: Refresh sports news/ticker manifest
        run: python3 scripts/refresh_sports_news.py
      - name: Refresh supplemental source diff manifest
        run: python3 scripts/source_catalog_diff.py
      - name: Refresh sports API intelligence policy
        run: python3 scripts/refresh_sports_api_intelligence.py
      - name: Validate intelligence policy
        run: |
          python3 - <<'PY'
          import json
          for p in ('data/telegram_sports_intelligence.json','data/epg_intelligence_sources.json','data/event_intelligence_graph.json','data/source_catalog_diff.json','data/sports_api_intelligence.json','data/sports_api_refresh.json'):
              d=json.load(open(p,encoding='utf-8'))
              assert d['playbackBlocking'] is False
          t=json.load(open('data/telegram_sports_intelligence.json',encoding='utf-8'))
          assert t['directStreamIngestion'] is False
          assert t['credentialsIngestion'] is False
          s=json.load(open('data/source_catalog_diff.json',encoding='utf-8'))
          assert s['policy']['require_health_check'] is True
          assert s['policy']['require_public_or_authorized'] is True
          assert s['policy']['never_import_credentials'] is True
          a=json.load(open('data/sports_api_intelligence.json',encoding='utf-8'))
          assert a['policy']['neverBlockPlayback'] is True
          assert a['policy']['neverTreatMetadataAsAStream'] is True
          print('Sports intelligence policy: safe/non-blocking')
          PY
      - name: Commit only when data changed
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json data/google_sports_intelligence.json data/sports_news_sources.json data/telegram_sports_intelligence.json data/epg_intelligence_sources.json data/event_intelligence_graph.json data/source_catalog_diff.json data/sports_api_refresh.json
          if git diff --cached --quiet; then
            echo 'Schedule/intelligence feeds unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh schedules and sports intelligence'
          git push origin HEAD:android-app
