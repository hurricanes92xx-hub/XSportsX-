name: Refresh complete schedules
on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/phase3_visual_enrichment.py'
      - 'scripts/classify_non_team_events.py'
      - 'scripts/repair_mlb_logo_gaps.py'
      - 'scripts/audit_mlb_incomplete_games.py'
      - 'scripts/audit_team_logo_coverage.py'
      - 'scripts/finalize_mlb_postseason_placeholders.py'
      - 'scripts/finalize_ncaa_football_postseason_placeholders.py'
      - 'scripts/hydrate_ncaa_logo_catalog.py'
      - 'scripts/build_ncaa_nonfootball_identity_catalog.py'
      - 'scripts/audit_ncaa_football_logos.py'
      - 'data/ncaa_nonfootball_school_catalog.json'
  schedule:
    - cron: '*/30 * * * *'
concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh canonical schedule feed through guarded season-aware engine
        run: python scripts/refresh_schedules_engine.py
      - name: Repair known source endpoint drift
        run: python scripts/repair_schedule_sources.py
      - name: Add authoritative official API schedules
        run: python scripts/official_api_adapters.py
      - name: Repair NASCAR Cup from shared official cache
        run: python scripts/repair_nascar_cup.py
      - name: Add ESPN NCAA schedules for unavailable NCAA sources
        run: python scripts/espn_ncaa_adapter.py
      - name: Hydrate complete NCAA college-sports persistent logo catalog
        run: python scripts/hydrate_ncaa_logo_catalog.py
      - name: Build canonical NCAA non-football school identity catalog
        run: python scripts/build_ncaa_nonfootball_identity_catalog.py
      - name: Repair easy provider endpoints
        run: python scripts/easy_provider_repairs.py
      - name: Repair IPL through ESPN cricket Core API
        run: python scripts/ipl_core_adapter.py
      - name: Repair active motorsport and lacrosse sources
        run: python scripts/special_schedule_repairs.py
      - name: Repair official WWE and AEW recurring schedules
        run: python scripts/wrestling_schedule_repairs.py
      - name: Phase 1 official schedule repairs
        run: python scripts/phase1_schedule_repairs.py
      - name: Phase 2 guarded NBA and NLL repairs
        run: python scripts/phase2_schedule_repairs.py
      - name: Phase 2 AAA existing-event guard
        run: python scripts/phase2_aaa_guard.py
      - name: Phase 3 visual enrichment and deterministic artwork
        run: python scripts/phase3_visual_enrichment.py
      - name: Represent fight racing and individual sports as named events
        run: python scripts/classify_non_team_events.py
      - name: Classify MLB postseason placeholders as league-art events
        run: python scripts/finalize_mlb_postseason_placeholders.py
      - name: Classify NCAA FB/FCS postseason placeholders as league-art events
        run: python scripts/finalize_ncaa_football_postseason_placeholders.py
      - name: Repair MLB logo gaps with canonical resolver
        run: python scripts/repair_mlb_logo_gaps.py
      - name: Audit incomplete MLB logo mappings
        run: python scripts/audit_mlb_incomplete_games.py
      - name: Upload MLB logo audit
        uses: actions/upload-artifact@v4
        with:
          name: mlb-logo-audit
          path: data/mlb_logo_audit.json
          if-no-files-found: error
      - name: Audit NCAA FB/FCS logo mappings and postseason coverage
        run: python scripts/audit_ncaa_football_logos.py
      - name: Upload NCAA football logo audit
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-football-logo-audit
          path: data/ncaa_football_logo_audit.json
          if-no-files-found: error
      - name: Generate corrected team-only logo audit
        run: python scripts/audit_team_logo_coverage.py
      - name: Upload corrected team-only logo audit
        uses: actions/upload-artifact@v4
        with:
          name: team-logo-coverage-audit
          path: data/team_logo_coverage_audit.json
          if-no-files-found: error
      - name: Generate compact league schedule audit
        run: python scripts/league_schedule_audit.py
      - name: Normalize, dedupe, and persist canonical feed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          pth=Path('data/schedule_feed.json')
          p=json.loads(pth.read_text())
          events=p.get('events') or []
          assert events, 'schedule feed is empty'
          assert p.get('schema',0) >= 5, 'unexpected schedule schema'
          fixed=0; bad=[]
          for e in events:
            raw=e.get('start'); text=str(raw or '').strip(); normalized=None
            for candidate in (text,text.replace('Z','+00:00'),text.replace('z','+00:00')):
              try:
                normalized=datetime.fromisoformat(candidate).astimezone(timezone.utc).isoformat().replace('+00:00','Z'); break
              except ValueError: pass
            if normalized is None: bad.append(e)
            elif raw != normalized: e['start']=normalized; fixed += 1
          assert not bad, f'invalid event timestamps: {len(bad)}'
          unique=[]; seen=set(); duplicates=0
          for e in events:
            key=(e.get('league'),e.get('title'),e.get('start'))
            if key in seen: duplicates += 1; continue
            seen.add(key); unique.append(e)
          events=unique
          p['events']=events
          p['eventCounts']={k:sum(1 for e in events if e.get('league')==k) for k in sorted({e.get('league') for e in events if e.get('league')})}
          p['generatedAt']=datetime.now(timezone.utc).isoformat()
          p.setdefault('repairReport',{})['adapterTimestampsNormalized']=fixed
          p['repairReport']['finalDuplicateEventsRemoved']=duplicates
          pth.write_text(json.dumps(p, indent=2, ensure_ascii=False) + '\n')
          assert len(events) == len({(e.get('league'),e.get('title'),e.get('start')) for e in events}), 'duplicate events remain after canonical dedupe'
          print(f'validated and persisted {len(events)} events across {len(p.get("eventCounts",{}))} leagues; normalized={fixed}; duplicates_removed={duplicates}')
          print('official source failures:', p.get('officialSourceFailures', []))
          print('provider failures:', p.get('failedSources', []))
          print('provider repairs:', p.get('providerRepairReport', {}))
          print('official API adapters:', p.get('officialApiAdapterReport', {}))
          print('phase 1 repairs:', p.get('phase1RepairReport', {}))
          print('phase 2 repairs:', p.get('phase2RepairReport', {}))
          print('phase 3 visuals:', p.get('phase3VisualReport', {}))
          print('NCAA football postseason:', p.get('ncaaFootballPostseasonReport', {}))
          print('Non-team presentation:', p.get('repairReport', {}).get('nonTeamEventPresentation', {}))
          si=p.get('seasonIntelligence',{})
          print('season intelligence decisions:', len(si.get('providerDecisions',[])))
          PY
      - name: Strict Phase 1 date-window verification
        run: python scripts/validate_schedule_refresh.py
      - name: Publish schedule feed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json data/league_schedule_audit.json data/team_logo_map.json data/ncaa_nonfootball_identity_catalog.json
          git diff --cached --quiet || git commit -m 'chore: refresh complete schedule feed'
          git stash push --include-untracked -m 'xsportsx-refresh-runner-local' || true
          for attempt in 1 2 3; do
            git fetch origin android-app
            if git rebase origin/android-app; then
              if git push origin HEAD:android-app; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish after three race-safe retries' >&2
          exit 1