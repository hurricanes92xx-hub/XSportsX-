name: Refresh XSportsX schedules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/refresh_schedules.py'
      - 'scripts/validate_schedule_refresh.py'
      - 'scripts/google_sports_intelligence.py'
      - 'scripts/refresh_sports_news.py'
      - 'scripts/source_catalog_diff.py'
      - 'scripts/refresh_sports_api_intelligence.py'
      - 'data/telegram_sports_intelligence.json'
      - 'data/epg_intelligence_sources.json'
      - 'data/event_intelligence_graph.json'
      - 'data/sports_api_intelligence.json'
      - 'data/remaining_schedule_intelligence.json'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout android-app
        uses: actions/checkout@v4
        with:
          ref: android-app
      - name: Refresh schedule feed (full configured windows)
        run: |
          set -euo pipefail
          python3 scripts/refresh_schedules.py
      - name: Validate schedule coverage
        run: python3 scripts/validate_schedule_refresh.py
      - name: Refresh Google sports intelligence manifest
        run: python3 scripts/google_sports_intelligence.py
      - name: Refresh sports news/ticker manifest
        run: python3 scripts/refresh_sports_news.py
      - name: Refresh supplemental source diff manifest
        run: python3 scripts/source_catalog_diff.py
      - name: Refresh sports API intelligence policy
        run: python3 scripts/refresh_sports_api_intelligence.py
      - name: Validate intelligence policy (non-blocking)
        run: |
          set -u
          python3 - <<'PY'
          import json
          paths = (
              'data/telegram_sports_intelligence.json',
              'data/epg_intelligence_sources.json',
              'data/event_intelligence_graph.json',
              'data/source_catalog_diff.json',
              'data/sports_api_intelligence.json',
              'data/sports_api_refresh.json',
          )
          for p in paths:
              try:
                  d = json.load(open(p, encoding='utf-8'))
              except FileNotFoundError:
                  print(f'Optional intelligence file not present: {p}')
                  continue
              if 'playbackBlocking' in d and d['playbackBlocking'] is not False:
                  print(f'WARNING: {p} playbackBlocking={d["playbackBlocking"]!r}')
              else:
                  print(f'Validated/accepted: {p}')

          try:
              r = json.load(open('data/remaining_schedule_intelligence.json', encoding='utf-8'))
              if r.get('playbackBlocking') is not False:
                  print('WARNING: remaining schedule intelligence playbackBlocking is not false')
              rules = r.get('rules', {})
              for key in ('retainLeagueSeparation', 'neverTreatScheduleMetadataAsPlayable', 'neverBlockPlayback'):
                  if rules.get(key) is not True:
                      print(f'WARNING: rule {key} is not true')
          except FileNotFoundError:
              print('WARNING: remaining schedule intelligence.json not present')
          print('Schedule publication passed the feed safety gate.')
          PY
      - name: Commit only when data changed
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json data/google_sports_intelligence.json data/sports_news_sources.json data/telegram_sports_intelligence.json data/epg_intelligence_sources.json data/event_intelligence_graph.json data/source_catalog_diff.json data/sports_api_refresh.json data/remaining_schedule_intelligence.json
          if git diff --cached --quiet; then
            echo 'Schedule/intelligence feeds unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh schedules and sports intelligence'
          git push origin HEAD:android-app
