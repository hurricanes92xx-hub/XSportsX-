name: Refresh XSportsX schedules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/refresh_schedules.py'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout android-app
        uses: actions/checkout@v4
        with:
          ref: android-app
      - name: Refresh schedule feed
        run: python3 scripts/refresh_schedules.py
      - name: Commit only when schedule changed
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then
            echo 'Schedule feed unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh sports schedules'
          git push origin HEAD:android-app
