name: Refresh complete schedules
on:
  # Manual dispatch is enabled; this workflow also self-triggers on android-app changes.
  # Source-repair verification trigger: re-run the complete provider repair chain.
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [android-app]
    paths:
      - 'scripts/refresh_schedules.py'
      - 'scripts/refresh_schedules_engine.py'
      - 'scripts/repair_schedule_sources.py'
      - 'scripts/official_api_adapters.py'
      - 'scripts/espn_ncaa_adapter.py'
      - 'scripts/easy_provider_repairs.py'
      - 'scripts/ipl_core_adapter.py'
      - 'scripts/special_schedule_repairs.py'
      - 'scripts/season_intelligence.py'
      - 'scripts/schedule_engine.py'
      - 'scripts/schedule_engine_safe.py'
      - 'data/official_schedule_sources.json'
      - 'data/schedule_season_policy.json'
      - '.github/workflows/refresh-schedules.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh canonical schedule feed through guarded season-aware engine
        run: python scripts/refresh_schedules_engine.py
      - name: Repair known source endpoint drift
        run: python scripts/repair_schedule_sources.py
      - name: Add authoritative official API schedules
        run: python scripts/official_api_adapters.py
      - name: Add ESPN NCAA schedules for unavailable NCAA sources
        run: python scripts/espn_ncaa_adapter.py
      - name: Repair easy provider endpoints
        run: python scripts/easy_provider_repairs.py
      - name: Repair IPL through ESPN cricket Core API
        run: python scripts/ipl_core_adapter.py
      - name: Repair active motorsport and lacrosse sources
        run: python scripts/special_schedule_repairs.py
      - name: Normalize adapter timestamps and validate feed invariants
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          pth=Path('data/schedule_feed.json')
          p=json.loads(pth.read_text())
          events=p.get('events') or []
          assert events, 'schedule feed is empty'
          assert p.get('schema',0) >= 5, 'unexpected schedule schema'
          fixed=0
          bad=[]
          for e in events:
            raw=e.get('start')
            text=str(raw or '').strip()
            normalized=None
            for candidate in (text,text.replace('Z','+00:00'),text.replace('z','+00:00')):
              try:
                normalized=datetime.fromisoformat(candidate).astimezone(timezone.utc).isoformat().replace('+00:00','Z')
                break
              except ValueError: pass
            if normalized is None: bad.append(e)
            elif raw != normalized:
              e['start']=normalized; fixed += 1
          assert not bad, f'invalid event timestamps: {len(bad)}'
          unique=[]; seen=set(); duplicates=0
          for e in events:
            key=(e.get('league'),e.get('title'),e.get('start'))
            if key in seen:
              duplicates += 1
              continue
            seen.add(key); unique.append(e)
          events=unique
          p['events']=events
          p['eventCounts']={k:sum(1 for e in events if e.get('league')==k) for k in sorted({e.get('league') for e in events if e.get('league')})}
          p['generatedAt']=datetime.now(timezone.utc).isoformat()
          p.setdefault('repairReport',{})['adapterTimestampsNormalized']=fixed
          p['repairReport']['finalDuplicateEventsRemoved']=duplicates
          assert len(events) == len({(e.get('league'),e.get('title'),e.get('start')) for e in events}), 'duplicate events remain after canonical dedupe'
          pth.write_text(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          print(f'validated {len(events)} events across {len(p.get("eventCounts",{}))} leagues; normalized={fixed}; duplicates_removed={duplicates}')
          print('official source failures:', p.get('officialSourceFailures', []))
          print('provider failures:', p.get('failedSources', []))
          print('provider repairs:', p.get('providerRepairReport', {}))
          print('official API adapters:', p.get('officialApiAdapterReport', {}))
          si=p.get('seasonIntelligence',{})
          print('season intelligence decisions:', len(si.get('providerDecisions',[])))
          PY
      - name: Publish schedule feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json
          git diff --cached --quiet || git commit -m 'chore: refresh complete schedule feed'
          git push
