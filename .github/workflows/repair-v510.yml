name: Repair XSportsX v510

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'XSportsX v510 repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch router and proxy
        shell: python
        run: |
          from pathlib import Path
          import re

          router = Path('sports-router.js')
          s = router.read_text()
          if 'const VERSION = "5.0.8"' not in s:
              raise SystemExit('router is not at expected v508 baseline')

          s = s.replace('const VERSION = "5.0.8";', 'const VERSION = "5.0.10";')
          s = s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v508";', 'const ADDON_ID = "com.xsportsx.sports.epg.v510";')
          s = s.replace('const PREFIX = "/v508";', 'const PREFIX = "/v510";')

          s = s.replace(
              'if(!h?.displayName&&!a?.displayName)return null;',
              'if(!h?.displayName&&!a?.displayName&&league!=="ufc")return null;'
          )

          s = s.replace(
              'poster:h.logo||h.logos?.[0]?.href||a.logo||a.logos?.[0]?.href||undefined,background:h.logo||a.logo||undefined,',
              'poster:league==="ufc"?`${BASE}${PREFIX}/assets/ufc.svg`:h.logo||h.logos?.[0]?.href||a.logo||a.logos?.[0]?.href||undefined,background:league==="ufc"?`${BASE}${PREFIX}/assets/ufc.svg`:h.logo||a.logo||undefined,'
          )

          asset_marker = 'if(path.startsWith("/assets/news/")&&path.endsWith(".svg")){'
          if asset_marker not in s:
              raise SystemExit('news asset handler not found')
          ufc_handler = '''if(path==="/assets/ufc.svg"){
          const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" rx="28" fill="#0b0b0d"/><rect x="24" y="24" width="592" height="312" rx="24" fill="#17171b" stroke="#d71920" stroke-width="5"/><text x="320" y="155" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="104" font-weight="900" font-style="italic">UFC</text><text x="320" y="215" text-anchor="middle" fill="#c9c9c9" font-family="Arial,sans-serif" font-size="24" font-weight="700">ULTIMATE FIGHTING CHAMPIONSHIP</text></svg>`;
          res.writeHead(200,{"content-type":"image/svg+xml","cache-control":"public,max-age=86400"});return res.end(svg);}
          '''
          s = s.replace(asset_marker, ufc_handler + asset_marker, 1)
          router.write_text(s)

          proxy = Path('render-proxy.js')
          p = proxy.read_text()
          if 'PREFIX="v508"' not in p:
              raise SystemExit('proxy is not at expected v508 baseline')
          p = p.replace('PREFIX="v508"', 'PREFIX="v510"')
          p = p.replace(
              'COMPAT_PREFIXES=["v508","v507","v506","v505","v504","v503","v502","v501","v500"]',
              'COMPAT_PREFIXES=["v510","v508","v507","v506","v505","v504","v503","v502","v501","v500"]'
          )
          p = p.replace('v508-compatible', 'v510-compatible')
          old = '''const token=decode(rest[0]),resource=rest.slice(1).map(decode),q=new URLSearchParams(u.search);q.set("config",token);return{path:"/"+resource.join("/"),query:q.toString()?"?"+q.toString():""};'''
          new = '''if(rest[0]==="assets")return{path:"/"+rest.map(decode).join("/"),query:u.search};const token=decode(rest[0]),resource=rest.slice(1).map(decode),q=new URLSearchParams(u.search);q.set("config",token);return{path:"/"+resource.join("/"),query:q.toString()?"?"+q.toString():""};'''
          if old not in p:
              raise SystemExit('proxyPath pattern not found')
          p = p.replace(old, new, 1)
          p = p.replace('`${PUBLIC_BASE}/${PREFIX}/${token}/manifest.json`', '`${PUBLIC_BASE}/${PREFIX}/${token}/manifest.json`')
          proxy.write_text(p)

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-router.js render-proxy.js
          git diff --cached --quiet && exit 0
          git commit -m "XSportsX v510 repair: news logos and UFC"
          git push
