name: Refresh Canonical Sports Schedule

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/**'
      - 'data/official_schedule_sources.json'
      - 'data/schedule_season_policy.json'
      - '.github/workflows/refresh-sports-schedule.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  queue: max
  cancel-in-progress: false

env:
  SPORTS_AGENT_MODEL_URL: ${{ vars.SPORTS_AGENT_MODEL_URL }}
  SPORTS_AGENT_MODEL: ${{ vars.SPORTS_AGENT_MODEL }}
  SPORTS_AGENT_GEMINI_MODEL_URL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL_URL }}
  SPORTS_AGENT_GEMINI_MODEL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install provider dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test season intelligence
        run: python3 scripts/test_season_intelligence.py
      - name: Test sports prediction
        run: python3 scripts/test_sports_prediction.py
      - name: Test sports agent
        run: python3 scripts/test_sports_agent.py
      - name: Test multi-source evidence reasoning
        run: python3 scripts/test_sports_evidence.py
      - name: Test autonomous Google sports research
        run: python3 scripts/test_sports_web_research.py
      - name: Snapshot previous feed
        run: |
          if [ -f data/schedule_feed.json ]; then cp data/schedule_feed.json /tmp/schedule_feed.previous.json; else echo '{}' > /tmp/schedule_feed.previous.json; fi
      - name: Run canonical schedule engine
        env:
          PYTHONUNBUFFERED: '1'
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_ENDPOINT_TEMPLATE: ${{ vars.SPORTRADAR_ENDPOINT_TEMPLATE }}
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
          SPORTSDATAIO_ENDPOINT_TEMPLATE: ${{ vars.SPORTSDATAIO_ENDPOINT_TEMPLATE }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_ENDPOINT_TEMPLATE: ${{ vars.SPORTMONKS_ENDPOINT_TEMPLATE }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          PANDASCORE_ENDPOINT_TEMPLATE: ${{ vars.PANDASCORE_ENDPOINT_TEMPLATE }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ vars.GOOGLE_CSE_ID }}
        run: python3 scripts/refresh_schedules.py
      - name: Normalize app-facing schedule contract
        run: python3 scripts/normalize_schedule_feed.py
      - name: Validate canonical feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/schedule_feed.json')
          if not path.exists(): raise SystemExit('ERROR: schedule_feed.json was not generated')
          data=json.loads(path.read_text(encoding='utf-8'))
          events=data.get('events')
          if not isinstance(events,list): raise SystemExit('ERROR: schedule feed events is not a list')
          previous=json.loads(Path('/tmp/schedule_feed.previous.json').read_text(encoding='utf-8'))
          previous_events=previous.get('events') or []
          if previous_events and not events: raise SystemExit('ERROR: canonical engine produced an empty feed over a non-empty previous feed')
          ids=[str(e.get('id','')) for e in events if isinstance(e,dict)]
          if len(ids)!=len(set(ids)): raise SystemExit('ERROR: duplicate canonical event IDs detected')
          required=('id','sport','league','title','startUtc')
          for i,event in enumerate(events):
              missing=[key for key in required if not event.get(key)]
              if missing: raise SystemExit(f'ERROR: event {i} missing required fields: {missing}')
          print(f"Canonical events: {len(events)}")
          print(f"Schema: {data.get('schema')}")
          print(f"Identity merges: {data.get('identityMergeCount',0)}")
          print(f"Provider counts: {data.get('sourceRecordCounts',{})}")
          matrix=data.get('leagueProviderMatrix') or {}
          print(f"Provider matrix leagues: {len(matrix)}")
          print(f"Provider promotions: {len(data.get('providerPromotions') or {})}")
          discovery=data.get('providerDiscovery') or {}
          season=data.get('seasonIntelligence') or {}
          gap=data.get('scheduleGapResolution') or {}
          print(f"Discovery candidates: {discovery.get('discoveredCandidates',0)}; promoted: {discovery.get('promotedProviders',0)}")
          print(f"Season gaps: active={gap.get('activeGaps',0)} off-season={gap.get('offSeasonGaps',0)} searched={gap.get('searchedActiveGaps',0)} unresolved={gap.get('unresolvedAfterDiscovery',0)}")
          print(f"Season classifications recorded: {len(season)}")
          PY
      - name: Run deep canonical integrity gate
        run: python3 scripts/validate_schedule_integrity.py
      - name: Run sports brain evidence pass
        run: python3 scripts/sports_brain.py analyze data/schedule_feed.json --memory data/sports_brain_memory.json
      - name: Run predictive sports intelligence
        run: python3 scripts/sports_prediction.py data/schedule_feed.json --graph data/sports_knowledge_graph.json
      - name: Smoke test configured sports AI model
        env:
          SPORTS_AGENT_MODEL_API_KEY: ${{ secrets.SPORTS_AGENT_MODEL_API_KEY }}
          SPORTS_AGENT_GEMINI_API_KEY: ${{ secrets.SPORTS_AGENT_GEMINI_API_KEY }}
        run: python3 scripts/test_sports_agent_model.py
      - name: Run sports agent observe-reason-act-verify-learn pass
        env:
          PYTHONUNBUFFERED: '1'
          SPORTS_AGENT_MODEL_URL: ${{ vars.SPORTS_AGENT_MODEL_URL }}
          SPORTS_AGENT_MODEL: ${{ vars.SPORTS_AGENT_MODEL }}
          SPORTS_AGENT_MODEL_API_KEY: ${{ secrets.SPORTS_AGENT_MODEL_API_KEY }}
          SPORTS_AGENT_GEMINI_MODEL_URL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL_URL }}
          SPORTS_AGENT_GEMINI_MODEL: ${{ vars.SPORTS_AGENT_GEMINI_MODEL }}
          SPORTS_AGENT_GEMINI_API_KEY: ${{ secrets.SPORTS_AGENT_GEMINI_API_KEY }}
        run: python3 scripts/sports_agent.py data/schedule_feed.json --memory data/sports_brain_memory.json --graph data/sports_knowledge_graph.json
      - name: Validate AI intelligence contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('data/schedule_feed.json').read_text(encoding='utf-8'))
          brain=feed.get('sportsBrain') or {}
          agent=feed.get('sportsAgent') or {}
          prediction=feed.get('sportsPredictions') or {}
          graph=json.loads(Path('data/sports_knowledge_graph.json').read_text(encoding='utf-8'))
          if brain.get('schema') != 1: raise SystemExit('ERROR: sports brain contract missing')
          if agent.get('schema') != 3: raise SystemExit('ERROR: sports agent contract missing')
          if prediction.get('schema') != 2: raise SystemExit('ERROR: sports prediction contract missing')
          if not isinstance(graph.get('nodes'), dict) or not isinstance(graph.get('edges'), list): raise SystemExit('ERROR: knowledge graph contract invalid')
          for event in feed.get('events') or []:
              action=event.get('intelligenceAction','')
              if action and action not in {'refresh_live_evidence','discover_schedule_provider','discover_event_source_metadata','warm_source','reconcile_or_archive','refresh_schedule_and_preflight','defer','no_action','probe_live_state_and_source'}:
                  raise SystemExit(f'ERROR: unsafe intelligence action: {action}')
          print(f"Brain: {brain.get('eventsAnalyzed',0)}; Predictions: {prediction.get('predictions',0)}; urgent={prediction.get('urgent',0)}; sourceRisk={prediction.get('sourceRisk',0)}; Agent plans: {agent.get('plans',0)}; modelEnabled={agent.get('modelEnabled',False)}; modelDecisions={agent.get('modelDecisions',0)}; modelProviders={agent.get('modelProviders',{})}; fallbackDecisions={agent.get('fallbackDecisions',0)}; Graph nodes: {len(graph['nodes'])}; edges: {len(graph['edges'])}")
          PY
      - name: Publish canonical data and learned intelligence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email 'xsportsx-schedule-bot@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then echo 'No canonical, discovery, or AI knowledge changes.'; exit 0; fi
          git commit -m 'chore: refresh canonical sports intelligence'
          for attempt in 1 2 3 4 5; do
            if git status --porcelain | grep -q .; then
              git add -A data/
              git commit -m 'chore: capture late generated intelligence' || true
            fi
            git fetch origin android-app
            if git rebase origin/android-app; then
              if git push origin HEAD:android-app; then
                echo "Publish succeeded on attempt ${attempt}."
                exit 0
              fi
            else
              echo 'Rebase conflict detected; aborting and rebuilding the publish commit.'
              git rebase --abort || true
              git reset --mixed origin/android-app
              git add -A data/
              if ! git diff --cached --quiet; then
                git commit -m 'chore: refresh canonical sports intelligence'
              fi
            fi
            echo "Remote advanced during publish; retrying (${attempt}/5)..."
            sleep $((attempt * 2))
          done
          echo 'ERROR: unable to publish after five race-safe attempts'
          exit 1
