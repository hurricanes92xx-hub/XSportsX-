name: Refresh Canonical Sports Schedule

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/**'
      - 'data/official_schedule_sources.json'
      - '.github/workflows/refresh-sports-schedule.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install provider dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Snapshot previous feed
        run: |
          if [ -f data/schedule_feed.json ]; then cp data/schedule_feed.json /tmp/schedule_feed.previous.json; else echo '{}' > /tmp/schedule_feed.previous.json; fi
      - name: Run canonical schedule engine
        env:
          PYTHONUNBUFFERED: '1'
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_ENDPOINT_TEMPLATE: ${{ vars.SPORTRADAR_ENDPOINT_TEMPLATE }}
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
          SPORTSDATAIO_ENDPOINT_TEMPLATE: ${{ vars.SPORTSDATAIO_ENDPOINT_TEMPLATE }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_ENDPOINT_TEMPLATE: ${{ vars.SPORTMONKS_ENDPOINT_TEMPLATE }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          PANDASCORE_ENDPOINT_TEMPLATE: ${{ vars.PANDASCORE_ENDPOINT_TEMPLATE }}
        run: python3 scripts/refresh_schedules.py
      - name: Normalize app-facing schedule contract
        run: python3 scripts/normalize_schedule_feed.py
      - name: Validate canonical feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/schedule_feed.json')
          if not path.exists(): raise SystemExit('ERROR: schedule_feed.json was not generated')
          data=json.loads(path.read_text(encoding='utf-8'))
          events=data.get('events')
          if not isinstance(events,list): raise SystemExit('ERROR: schedule feed events is not a list')
          previous=json.loads(Path('/tmp/schedule_feed.previous.json').read_text(encoding='utf-8'))
          previous_events=previous.get('events') or []
          if previous_events and not events: raise SystemExit('ERROR: canonical engine produced an empty feed over a non-empty previous feed')
          ids=[str(e.get('id','')) for e in events if isinstance(e,dict)]
          if len(ids)!=len(set(ids)): raise SystemExit('ERROR: duplicate canonical event IDs detected')
          required=('id','sport','league','title','startUtc')
          for i,event in enumerate(events):
              missing=[key for key in required if not event.get(key)]
              if missing: raise SystemExit(f'ERROR: event {i} missing required fields: {missing}')
          print(f"Canonical events: {len(events)}")
          print(f"Schema: {data.get('schema')}")
          print(f"Identity merges: {data.get('identityMergeCount',0)}")
          print(f"Provider counts: {data.get('sourceRecordCounts',{})}")
          matrix=data.get('leagueProviderMatrix') or {}
          print(f"Provider matrix leagues: {len(matrix)}")
          print(f"Provider promotions: {len(data.get('providerPromotions') or {})}")
          PY
      - name: Run deep canonical integrity gate
        run: python3 scripts/validate_schedule_integrity.py
      - name: Publish only if canonical data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/schedule_feed.json; then echo 'No canonical schedule changes.'; exit 0; fi
          git config user.name 'XSportsX Schedule Bot'
          git config user.email 'xsportsx-schedule-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          git commit -m 'chore: refresh canonical sports schedule'
          for attempt in 1 2 3; do
            if git push origin HEAD:android-app; then exit 0; fi
            echo "Publish race detected; rebasing attempt ${attempt}..."
            git fetch origin android-app
            git rebase origin/android-app
          done
          echo 'ERROR: unable to publish after three race-safe attempts'
          exit 1
