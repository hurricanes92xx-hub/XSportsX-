name: Refresh Canonical Sports Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh provider schedule
        run: python3 scripts/refresh_schedule_feed.py
      - name: Validate feed
        run: python3 -m json.tool data/schedule_feed.json >/dev/null
      - name: Commit changed schedule
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/schedule_feed.json; then
            echo 'No schedule changes to commit.'
            exit 0
          fi
          git config user.name 'XSportsX Schedule Bot'
          git config user.email 'xsportsx-schedule-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          git commit -m 'chore: refresh canonical sports schedule'
          git push origin android-app
