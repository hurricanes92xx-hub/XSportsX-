name: UFC v508 fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-v508.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UFC support
        shell: python
        run: |
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const VERSION = "5.0.7";','const VERSION = "5.0.8";')
          s=s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v507";','const ADDON_ID = "com.xsportsx.sports.epg.v508";')
          s=s.replace('const PREFIX = "/v507";','const PREFIX = "/v508";')
          marker='async function allSports(){'
          if 'async function ufcCatalog(c)' not in s:
              fn='''async function ufcCatalog(c){\n  const [events,xd]=await Promise.all([leagueCatalog("ufc").catch(()=>[]),c?xtreamData(c).catch(()=>({metas:[]})):{metas:[]}]);\n  const ufcChannels=(xd.metas||[]).filter(m=>{const v=norm(`${m.name} ${m.xtream?.category||""}`);return /\\b(ufc|ultimate fighting championship|fight pass|ufc fight)\\b/i.test(v);});\n  const seen=new Set(),out=[];\n  for(const m of [...events,...ufcChannels]){if(!seen.has(m.id)){seen.add(m.id);out.push(m);}}\n  return out;\n}\n\n'''
              s=s.replace(marker,fn+marker)
          old='if(id==="sports-command-center"){const ms=await allSports();return json(res,{metas:ms.slice(0,50)},200,15);}'
          new='if(id==="sports-command-center"){const ms=await allSports();return json(res,{metas:ms.slice(0,50)},200,15);}'
          # Add a dedicated UFC route before the generic LEAGUES route.
          needle='if(id==="starting-soon"){const ms=await allSports(),cut=Date.now()+24*3600*1000;return json(res,{metas:ms.filter(m=>m.event?.state==="pre"&&new Date(m.releaseInfo).getTime()<=cut)},200,15);}if(LEAGUES[id])'
          replacement='if(id==="starting-soon"){const ms=await allSports(),cut=Date.now()+24*3600*1000;return json(res,{metas:ms.filter(m=>m.event?.state==="pre"&&new Date(m.releaseInfo).getTime()<=cut)},200,15);}if(id==="ufc"){const ms=await ufcCatalog(c);return json(res,{metas:ms.slice(0,100)},200,30);}if(LEAGUES[id])'
          if needle in s:s=s.replace(needle,replacement)
          # Add UFC-specific stream matching before normal event matching.
          needle2='async function streamsForEvent(c,meta){if(!c||!meta?.event)return[];const d=await xtreamData(c),matches='
          repl2='async function streamsForEvent(c,meta){if(!c||!meta?.event)return[];const d=await xtreamData(c);if(meta.event.league==="ufc"){return d.metas.filter(m=>/\\b(ufc|ultimate fighting championship|fight pass|ufc fight)\\b/i.test(`${m.name} ${m.xtream?.category||""}`)).slice(0,20).map(m=>({name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:m.xtream.category}));}const matches='
          if needle2 in s:s=s.replace(needle2,repl2)
          # Give UFC event cards a clearer title/description without changing other sports.
          needle3='const meta={id,type:"channel",name:`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`'
          repl3='const eventName=league==="ufc"?(ev.name||ev.shortName||`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`):`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`;const meta={id,type:"channel",name:eventName'
          if needle3 in s:s=s.replace(needle3,repl3)
          p.write_text(s)
          q=Path('render-proxy.js')
          r=q.read_text()
          r=r.replace('PREFIX="v507",COMPAT_PREFIXES=["v507","v506","v505","v504","v503","v502","v501","v500"]','PREFIX="v508",COMPAT_PREFIXES=["v508","v507","v506","v505","v504","v503","v502","v501","v500"]')
          r=r.replace('v507-compatible','v508-compatible')
          q.write_text(r)
      - name: Validate
        run: |
          node --check sports-router.js
          node --check render-proxy.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js render-proxy.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore UFC command center and UFC sources'
          git push