name: Align backend prefix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align sports-router backend prefix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const PREFIX="v524";', 'const PREFIX="v520";', 1)
          p.write_text(s)
          PY
          node --check sports-router.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-router.js .github/workflows/fix-backend-prefix.yml
          git diff --cached --quiet || git commit -m 'fix: align backend prefix with Render gateway'
          git push
