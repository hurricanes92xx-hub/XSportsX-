name: XSportsX v515 performance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v514.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize source resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sports-router.js')
          s=p.read_text()
          s=re.sub(r'const VERSION = "[^"]+";', 'const VERSION = "5.0.15";', s, count=1)
          s=re.sub(r'const ADDON_ID = "[^"]+";', 'const ADDON_ID = "com.xsportsx.sports.epg.v515";', s, count=1)
          s=re.sub(r'const PREFIX = "/v[0-9]+";', 'const PREFIX = "/v515";', s, count=1)
          if 'const sourceMatchCache' not in s:
              s=s.replace('const cache=new Map(),eventCache=new Map(),xtreamCache=new Map(),inFlight=new Map();', 'const cache=new Map(),eventCache=new Map(),xtreamCache=new Map(),inFlight=new Map(),sourceMatchCache=new Map();', 1)
          # Make Xtream requests fail fast instead of holding a Nuvio request indefinitely.
          if 'AbortSignal.timeout' not in s:
              s=s.replace('fetch(url,{headers:{accept:"application/json",', 'fetch(url,{signal:AbortSignal.timeout(8000),headers:{accept:"application/json",', 1)
          # Replace source resolver with cache-first matching. Full Xtream inventory is warmed separately.
          pattern=r'async function streamsForEvent\(c,meta\)\{.*?\n\}'
          replacement='''async function streamsForEvent(c,meta){
            if(!c||!meta?.event)return[];
            const eventKey=`${c.server}|${c.username}|${meta.id}`;
            const cached=sourceMatchCache.get(eventKey);
            if(cached&&Date.now()-cached.at<300000)return cached.value;
            const d=await xtreamData(c);
            const channels=d.metas||[];
            let value=[];
            if(meta.event.league==="ufc"){
              value=channels.filter(m=>/\\b(ufc|ultimate fighting championship|fight pass|ufc fight|paramount plus|paramount\\+|cbs sports)\\b/i.test(`${m.name} ${m.xtream?.category||""}`)).slice(0,20).map(m=>({name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:m.xtream.category}));
            }else{
              value=channels.map(m=>({m,score:matchEventChannel(m,meta.event)})).filter(x=>x.score>=40).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>({name:`▶ ${x.m.name}`,url:x.m.xtream.streamUrl,title:x.m.name,description:`${x.m.xtream.category} • match ${x.score}%`,score:x.score}));
            }
            sourceMatchCache.set(eventKey,{at:Date.now(),value});
            return value;
          }'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if not n: raise SystemExit('source resolver not found')
          # Keep a warm inventory for configured users without blocking catalog responses.
          if 'warmXtream(c);' not in s:
              marker='const c=configFrom(req.url);'
              if marker in s:s=s.replace(marker,marker+'\n    warmXtream(c);',1)
          p.write_text(s)
          p=Path('render-proxy.js')
          s=p.read_text()
          s=re.sub(r'PREFIX="v[0-9]+"','PREFIX="v515"',s,count=1)
          m=re.search(r'COMPAT_PREFIXES=\[(.*?)\]',s,re.S)
          if m:
              vals=[x.strip().strip('"') for x in m.group(1).split(',') if x.strip()]
              vals=['v515']+[x for x in vals if x!='v515']
              s=s[:m.start(1)]+','.join('"'+x+'"' for x in vals)+s[m.end(1):]
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check sports-router.js
          node --check render-proxy.js
          grep -q 'v515' sports-router.js
          grep -q 'v515' render-proxy.js
          grep -q 'sourceMatchCache' sports-router.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js render-proxy.js
          git diff --cached --quiet && exit 0
          git commit -m 'perf: cache event sources and fail fast on slow providers'
          git push
