name: Repair Sports Data Stack

on:
  push:
    branches: [android-app]
    paths:
      - 'scripts/providers/ncaa.py'
      - 'scripts/official_event_recovery.py'
      - 'app/src/main/java/com/xsportsx/app/SportsLogos.kt'
      - '.github/workflows/repair-sports-data-stack.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 0
      - name: Apply deterministic source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # NFL: use a clean square league shield instead of the legacy local mark.
          p=Path('app/src/main/java/com/xsportsx/app/SportsLogos.kt')
          s=p.read_text()
          old='"NFL" -> BrandSpec(Color(0xFF013369), Color.White, Color(0xFFD50A0A), "nfl", "NFL")'
          new='"NFL" -> BrandSpec(Color(0xFF013369), Color.White, Color(0xFFD50A0A), null, "NFL", "https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png")'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # UFC: create distinct Main Card and Prelims sessions. The previous regex
          # was over-escaped and matched literal "\\s" instead of whitespace.
          p=Path('scripts/official_event_recovery.py')
          s=p.read_text()
          s=s.replace(r'r"Early Prelims\\s+', r'r"Early Prelims\s+')
          s=s.replace(r'r"Prelims\\s+', r'r"Prelims\s+')
          s=s.replace(r'r"Main Card\\s+', r'r"Main Card\s+')
          start=s.find('            # Keep the established event-level main-card record for compatibility.')
          end=s.find('            # Add separate session records.', start)
          if start != -1 and end != -1:
              replacement='''            # Model broadcast sessions explicitly. If the official page omits a
            # session time, use only the published current-event fallback for UFC Paris.
            session_times = parse_ufc_session_times(text, event_date)
            labels = {x[0] for x in session_times}
            if "Prelims" not in labels:
                session_times.append(("Prelims", 12, 0, "Paramount+"))
            if "Main Card" not in labels:
                session_times.append(("Main Card", 15, 0, "Paramount+"))
'''
              s=s[:start]+replacement+s[end:]
          # Replace the old direct parser call with the normalized session list.
          s=s.replace('            for label, hour, minute, network in parse_ufc_session_times(text, event_date):', '            for label, hour, minute, network in session_times:')
          p.write_text(s)

          # NCAA football: provider status can be expressed as Q1/Q2/clock/halftime,
          # and ESPN is a secondary authority that must remain available when the
          # NCAA mirror is stale or unavailable.
          p=Path('scripts/providers/ncaa.py')
          s=p.read_text()
          if 'import re\n' not in s: s=s.replace('import urllib.error\n','import urllib.error\nimport re\n',1)
          old='''    state = str(game.get("gameState") or game.get("status") or "").lower()
    if isinstance(game.get("status"), dict): state = str(game["status"].get("state") or game["status"].get("name") or "").lower()
    tag = "LIVE" if state in {"live", "in-progress", "in", "in progress", "in_progress"} else "FINAL" if state in {"final", "f", "complete", "completed", "closed"} else "UPCOMING"
'''
          new='''    state = str(game.get("gameState") or game.get("status") or "").lower()
    if isinstance(game.get("status"), dict):
        status_obj = game["status"]
        state = str(status_obj.get("state") or status_obj.get("name") or status_obj.get("displayClock") or "").lower()
    status_text = json.dumps(game.get("status"), ensure_ascii=False).lower() if isinstance(game.get("status"), (dict, list)) else state
    live_clock = bool(re.search(r"\\bq[1-4]\\b|\\b[0-9]{1,2}:[0-9]{2}\\b|halftime|in progress|in-progress|inprogress|live", status_text + " " + state))
    final_state = bool(re.search(r"final|complete|completed|closed", status_text + " " + state))
    tag = "FINAL" if final_state else "LIVE" if live_clock else "UPCOMING"
'''
          if old not in s: raise SystemExit('NCAA normalize block not found')
          s=s.replace(old,new,1)
          start=s.find('def _fetch_espn_day(league, day):')
          end=s.find('\ndef _fetch_espn_days(', start)
          if start == -1 or end == -1: raise SystemExit('NCAA ESPN function markers not found')
          fn='''def _fetch_espn_day(league, day):
    mapping = ESPN_FALLBACK.get(league)
    if not mapping: return []
    sport, slug = mapping
    urls = [
        f"https://site.api.espn.com/apis/site/v2/sports/{sport}/{slug}/scoreboard?dates={day:%Y%m%d}&limit=1000",
        f"https://site.web.api.espn.com/apis/site/v2/sports/{sport}/{slug}/scoreboard?dates={day:%Y%m%d}&limit=1000",
    ]
    root = None
    for url in urls:
        try:
            root = _get(url, ESPN_HEADERS, timeout=12)
            if root: break
        except Exception as exc:
            print(f"ERROR ESPN NCAA secondary {league} {day} {url}: {exc}")
    if not root: return []
    icon = next(x[3] for x in NCAA_LEAGUES if x[0] == league)
    return [event for game in (root.get("events") or []) if (event := _normalize_espn(game, league, icon))]
'''
          s=s[:start]+fn+s[end:]
          p.write_text(s)

          print('Sports data source repairs applied.')
          PY
      - name: Validate repaired sources
        run: |
          python3 -m py_compile scripts/providers/ncaa.py scripts/official_event_recovery.py
          grep -q 'a.espncdn.com/i/teamlogos/leagues/500/nfl.png' app/src/main/java/com/xsportsx/app/SportsLogos.kt
          grep -q '"Prelims", 12, 0' scripts/official_event_recovery.py
          grep -q 'site.web.api.espn.com' scripts/providers/ncaa.py
      - name: Commit repairs
        run: |
          git config user.name 'XSportsX Repair Bot'
          git config user.email 'xsportsx-repair-bot@users.noreply.github.com'
          git add scripts/providers/ncaa.py scripts/official_event_recovery.py app/src/main/java/com/xsportsx/app/SportsLogos.kt
          if git diff --cached --quiet; then echo 'No source changes needed.'; exit 0; fi
          git commit -m 'fix: harden NCAA live state and UFC sessions'
          git push origin HEAD:android-app
