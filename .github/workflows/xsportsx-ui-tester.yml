name: XSportsX QA — Mobile + TV

# Isolated QA pipeline. It NEVER signs, publishes, or modifies release APKs.
# QA covers lifecycle, UI navigation, source fixtures, Xtream/M3U connection,
# TV QR/manual login surfaces, favorites/college picker, source latency,
# ticker/cracked-glass/icon assets, logo rendering, and regression evidence.

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/patch_networks.py'
      - '.github/workflows/xsportsx-ui-tester.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-ui-tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt
          test -f app/src/main/java/com/xsportsx/app/TvCrackPulseCompat.kt
          test -f app/src/main/java/com/xsportsx/app/SportsLogos.kt
          test -f app/src/main/assets/brand_logos/nfl.svg
          test -f app/src/main/assets/brand_logos/nba.svg
          test -f app/src/main/assets/brand_logos/ncaa.svg
          test -f app/src/main/assets/brand_logos/espn.svg
          test -f app/src/main/assets/brand_logos/cbs.svg
          test -f app/src/main/res/drawable/xsportsx_launcher.xml
          test -f app/src/main/res/drawable/xsportsx_launcher_foreground.xml
          grep -q 'HomeSportsTicker' app/src/main/java/com/xsportsx/app/MainActivityFuture.kt
          grep -q 'GlowingCracks' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'TvCrackedGlass' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'FAVORITES' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'MY TEAMS' app/src/main/java/com/xsportsx/app/TeamFavorites.kt
          grep -q 'NCAAF' app/src/main/java/com/xsportsx/app/CollegeFavorites.kt
          grep -q 'SCAN QR CODE' app/src/main/java/com/xsportsx/app/TvSourceChooser.kt
          grep -q 'SIGN IN ON TV' app/src/main/java/com/xsportsx/app/TvSourceChooser.kt
          grep -q 'M3U playlist URL' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          grep -q 'Xtream' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          grep -q 'android:icon="@drawable/xsportsx_launcher"' app/src/main/AndroidManifest.xml
      - name: Apply release-equivalent source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
          python3 scripts/patch_sports_badges.py
          python3 .github/patch_networks.py
          python3 scripts/patch_real_brand_logos.py
          ! grep -Rqs 'a\.espncdn\.com/i/teamlogos/leagues' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'loadTvGames' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XSportsLeagueLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'XSportsNetworkLogo' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'brand_logos/espn.svg' app/src/main/java/com/xsportsx/app/SportsLogos.kt
      - name: Build debug APKs
        shell: bash
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify debug APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
          ls -lh app/build/outputs/apk/mobile/debug/app-mobile-debug.apk app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Verify downloaded mobile APK
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/test-apks" -type f -name '*.apk' -print
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
      - name: Start isolated QA source fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
          echo $! > qa-source.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && exit 0; sleep 1; done
          cat qa-source.log
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
            test -n "$APK" && test -s "$APK"
            chmod +x scripts/qa_regression_test.sh
            QA_MODE=mobile ./scripts/qa_regression_test.sh "$APK" test-output-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-regression-${{ github.sha }}
          path: |
            test-output-mobile
            qa-source.log
          if-no-files-found: ignore

  tv-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Verify downloaded TV APK
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/test-apks" -type f -name '*.apk' -print
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
      - name: Start isolated QA source fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
          echo $! > qa-source.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && exit 0; sleep 1; done
          cat qa-source.log
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
            test -n "$APK" && test -s "$APK"
            chmod +x scripts/qa_regression_test.sh
            QA_MODE=tv ./scripts/qa_regression_test.sh "$APK" test-output-tv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-regression-${{ github.sha }}
          path: |
            test-output-tv
            qa-source.log
          if-no-files-found: ignore
