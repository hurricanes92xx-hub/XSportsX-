name: XSportsX QA — Mobile + TV

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/patch_networks.py'
      - '.github/workflows/xsportsx-ui-tester.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-ui-tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt
          test -f app/src/main/java/com/xsportsx/app/TvCrackPulseCompat.kt
          test -f app/src/main/java/com/xsportsx/app/SportsLogos.kt
          test -f app/src/main/java/com/xsportsx/app/SportsScheduleScreen.kt
          test -f scripts/run_emulator_regression.sh
          test -f app/src/main/assets/brand_logos/nfl.svg
          test -f app/src/main/assets/brand_logos/nba.svg
          test -f app/src/main/assets/brand_logos/ncaa.svg
          test -f app/src/main/assets/brand_logos/espn.svg
          test -f app/src/main/assets/brand_logos/cbs.svg
          test -f app/src/main/res/drawable/xsportsx_launcher.xml
          test -f app/src/main/res/drawable/xsportsx_launcher_foreground.xml
          grep -q 'HomeSportsTicker' app/src/main/java/com/xsportsx/app/MainActivityFuture.kt
          grep -q 'GlowingCracks' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'TvCrackedGlass' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'FAVORITES' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q 'MY TEAMS' app/src/main/java/com/xsportsx/app/TeamFavorites.kt
          grep -q 'NCAAF' app/src/main/java/com/xsportsx/app/CollegeFavorites.kt
          grep -q 'SCAN QR CODE' app/src/main/java/com/xsportsx/app/TvSourceChooser.kt
          grep -q 'SIGN IN ON TV' app/src/main/java/com/xsportsx/app/TvSourceChooser.kt
          grep -q 'M3U playlist URL' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          grep -q 'Xtream' app/src/main/java/com/xsportsx/app/SourceConnectScreen.kt
          grep -q 'android:icon="@drawable/xsportsx_launcher"' app/src/main/AndroidManifest.xml
      - name: Apply release-equivalent source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
          python3 scripts/patch_sports_badges.py
          python3 .github/patch_networks.py
          python3 scripts/patch_real_brand_logos.py
          python3 scripts/patch_college_schedule_ui.py
      - name: Validate patched sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rqs 'a\.espncdn\.com/i/teamlogos/leagues' app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt; then
            echo 'ERROR: legacy ESPN league-logo URL remains in patched UI source'
            exit 1
          fi
          echo 'Patched-source validation passed.'
      - name: Build debug APKs
        shell: bash
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - name: Verify debug APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Verify downloaded mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "MOBILE_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe all public schedule sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_public_schedule_probe.py public-schedule-mobile.json
      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Start QA source fixture
        id: qa-source
        shell: bash
        env:
          QA_SOURCE_HOST: 127.0.0.1
          QA_SOURCE_PORT: 8765
        run: python3 -u scripts/qa_source_server.py > qa-source.log 2>&1
        background: true
      - name: Wait for QA source fixture
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa-source.log || true
          exit 1
      - name: Run mobile emulator regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: xsportsx-mobile
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$MOBILE_APK" mobile test-output-mobile
      - name: Stop QA source fixture
        cancel: qa-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-regression-${{ github.sha }}
          path: |
            test-output-mobile/**
            qa-source.log
            public-schedule-mobile.json
          if-no-files-found: ignore

  tv-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Verify downloaded TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "TV_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe all public schedule sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_public_schedule_probe.py public-schedule-tv.json
      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Start QA source fixture
        id: qa-source
        shell: bash
        env:
          QA_SOURCE_HOST: 127.0.0.1
          QA_SOURCE_PORT: 8765
        run: python3 -u scripts/qa_source_server.py > qa-source.log 2>&1
        background: true
      - name: Wait for QA source fixture
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa-source.log || true
          exit 1
      - name: Run TV emulator regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          avd-name: xsportsx-tv
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            sudo chmod 666 /dev/kvm || true
          script: bash scripts/run_emulator_regression.sh "$TV_APK" tv test-output-tv
      - name: Stop QA source fixture
        cancel: qa-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-regression-${{ github.sha }}
          path: |
            test-output-tv/**
            qa-source.log
            public-schedule-tv.json
          if-no-files-found: ignore
# The QA fixture is a dedicated GitHub Actions background step so it remains alive while the emulator regression runs.
