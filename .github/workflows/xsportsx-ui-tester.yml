name: XSportsX QA — Mobile + TV

# Isolated QA pipeline. It NEVER signs, publishes, or modifies release APKs.
# QA-only trigger marker: run the isolated emulator suite on this commit.

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-ui-tester.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-ui-tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Apply release-equivalent source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
          grep -q ':List<FavoriteTeam> =' app/src/main/java/com/xsportsx/app/TeamFavorites.kt
          grep -q ':List<FavoriteNews> =' app/src/main/java/com/xsportsx/app/TeamFavorites.kt
          grep -q '): List<TvGame> =' app/src/main/java/com/xsportsx/app/TvHome.kt
      - name: Build debug APKs
        shell: bash
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Start isolated QA source fixture
        shell: bash
        run: |
          python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
          echo $! > qa-source.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && exit 0; sleep 1; done
          cat qa-source.log
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            APK=$(find test-apks -type f -name 'app-mobile-debug.apk' -print -quit)
            test -n "$APK"
            chmod +x scripts/ui_smoke_test.sh
            ./scripts/ui_smoke_test.sh "$APK" test-output-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-ui-evidence-${{ github.sha }}
          path: |
            test-output-mobile
            qa-source.log
          if-no-files-found: ignore

  tv-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - name: Start isolated QA source fixture
        shell: bash
        run: |
          python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
          echo $! > qa-source.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && exit 0; sleep 1; done
          cat qa-source.log
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            APK=$(find test-apks -type f -name 'app-tv-debug.apk' -print -quit)
            test -n "$APK"
            chmod +x scripts/ui_smoke_test.sh
            ./scripts/ui_smoke_test.sh "$APK" test-output-tv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-ui-evidence-${{ github.sha }}
          path: |
            test-output-tv
            qa-source.log
          if-no-files-found: ignore
