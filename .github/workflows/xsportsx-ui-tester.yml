name: XSportsX UI Tester

# Isolated QA pipeline. It NEVER signs, publishes, or modifies the release APKs.
# It builds debug variants solely for emulator testing.

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/xsportsx-ui-tester.yml'

permissions:
  contents: read

concurrency:
  group: xsportsx-ui-tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.paths.outputs.apk }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Apply the same source fixes used by release builds
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_navigation.py
          python3 scripts/patch_college_favorites.py
          TV_SOURCE="app/src/main/java/com/xsportsx/app/TvHome.kt"
          TEAM_SOURCE="app/src/main/java/com/xsportsx/app/TeamFavorites.kt"
          test -s "${TV_SOURCE}"
          test -s "${TEAM_SOURCE}"
          grep -q '^package com.xsportsx.app$' "${TV_SOURCE}"
          grep -q 'TvActionButton' "${TV_SOURCE}"
          grep -q 'addAll(collegeFavoriteTeams())' "${TEAM_SOURCE}"
          grep -q '"NCAAF"->"football/college-football"' "${TEAM_SOURCE}"
          grep -q ':List<FavoriteTeam> =' "${TEAM_SOURCE}"
          grep -q ':List<FavoriteNews> =' "${TEAM_SOURCE}"
          grep -q '): List<TvGame> =' "${TV_SOURCE}"
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-debug-build.log
      - name: Upload Gradle failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-gradle-log-${{ github.sha }}
          path: gradle-debug-build.log
          if-no-files-found: ignore
      - id: paths
        shell: bash
        run: |
          test -s app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s app/build/outputs/apk/tv/debug/app-tv-debug.apk
          echo 'apk=app/build/outputs/apk/mobile/debug/app-mobile-debug.apk' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  mobile-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x scripts/ui_smoke_test.sh
            ./scripts/ui_smoke_test.sh test-apks/app-mobile-debug.apk test-output-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-ui-evidence-${{ github.sha }}
          path: test-output-mobile
          if-no-files-found: ignore

  tv-emulator:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-debug-apks-${{ github.sha }}
          path: test-apks
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            chmod +x scripts/ui_smoke_test.sh
            ./scripts/ui_smoke_test.sh test-apks/app-tv-debug.apk test-output-tv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-ui-evidence-${{ github.sha }}
          path: test-output-tv
          if-no-files-found: ignore
