name: Apply mobile source navigation

on:
  push:
    branches: [android-app]
    paths:
      - '.github/workflows/apply-mobile-source-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 1

      - name: Patch mobile source navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/src/main/java/com/xsportsx/app/FuturisticSports.kt')
          main = Path('app/src/main/java/com/xsportsx/app/MainActivityFuture.kt')

          s = home.read_text(encoding='utf-8')
          old_sig = 'fun FuturisticHome(onConnect: () -> Unit = {}, onNetwork: (XNetwork) -> Unit = {}) {'
          new_sig = 'fun FuturisticHome(onConnect: () -> Unit = {}, onSource: () -> Unit = {}, onNetwork: (XNetwork) -> Unit = {}) {'
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          elif new_sig not in s:
              raise SystemExit('FuturisticHome signature not found')

          old_nav_call = 'MobileBottomNav(selectedSection){selectedSection=it}'
          new_nav_call = 'MobileBottomNav(selectedSection){section->if(section=="SOURCE")onSource()else selectedSection=section}'
          if old_nav_call in s:
              s = s.replace(old_nav_call, new_nav_call, 1)
          elif new_nav_call not in s:
              raise SystemExit('MobileBottomNav call not found')

          old_nav = 'MobileNavItem("⌂","HOME",selected,onSelect);MobileNavItem("●","LIVE",selected,onSelect);MobileNavItem("▦","NETWORKS",selected,onSelect);MobileNavItem("★","FAVORITES",selected,onSelect)'
          new_nav = 'MobileNavItem("⌂","HOME",selected,onSelect);MobileNavItem("●","LIVE",selected,onSelect);MobileNavItem("▦","NETWORKS",selected,onSelect);MobileNavItem("★","FAVORITES",selected,onSelect);MobileNavItem("⚙","SOURCE",selected,onSelect)'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)
          elif new_nav not in s:
              raise SystemExit('MobileBottomNav items not found')
          home.write_text(s, encoding='utf-8')

          m = main.read_text(encoding='utf-8')
          anchor = '''                            },\n                            onNetwork = { network ->\n                                if (network.type == "LEAGUE") { selectedScheduleLeague = network.name; schedules = true }'''
          replacement = '''                            },\n                            onSource = { connectSource = true },\n                            onNetwork = { network ->\n                                if (network.type == "LEAGUE") { selectedScheduleLeague = network.name; schedules = true }'''
          if anchor in m:
              m = m.replace(anchor, replacement, 1)
          elif 'onSource = { connectSource = true }' not in m:
              raise SystemExit('FuturisticHome call anchor not found')
          main.write_text(m, encoding='utf-8')
          PY

          grep -q 'onSource: () -> Unit' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'section=="SOURCE"' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'MobileNavItem("⚙","SOURCE"' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'onSource = { connectSource = true }' app/src/main/java/com/xsportsx/app/MainActivityFuture.kt

      - name: Commit mobile source navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/MainActivityFuture.kt
          git commit -m 'fix: expose Xtream M3U source in mobile bottom bar'
          git push origin HEAD:android-app

      - name: Remove one-shot patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-mobile-source-nav.yml
          git commit -m 'chore: remove one-shot mobile source patch workflow'
          git push origin HEAD:android-app
