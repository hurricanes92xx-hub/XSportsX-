name: Fix mobile compile

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply Kotlin fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/FuturisticSports.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.rememberScrollState\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\n')
          s = s.replace('private data class XNetwork(', 'data class XNetwork(')
          p.write_text(s)
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt
            git commit -m 'Fix mobile compile errors'
            git push origin android-app
          fi
      - name: Build mobile and TV APKs
        shell: bash
        run: |
          set -o pipefail
          gradle clean :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee gradle-build.log
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XSportsX-fixed-apks
          path: |
            app/build/outputs/apk/**/*.apk
            gradle-build.log
          if-no-files-found: error
