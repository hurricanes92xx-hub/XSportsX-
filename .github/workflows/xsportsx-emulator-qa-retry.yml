name: XSportsX Emulator QA Retry

on:
  workflow_dispatch:
  workflow_run:
    workflows: [XSportsX Emulator QA v2]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: xsportsx-emulator-qa-retry
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Download APK artifact from source QA run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          test -n "${RUN_ID:-}" || { echo 'Run this workflow from workflow_run or provide the artifact manually.'; exit 1; }
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API" -o artifacts.json
          URL=$(jq -r --arg n "XSportsX-emulator-qa-apks-${SHA}" '.artifacts[] | select(.name==$n) | .archive_download_url' artifacts.json | head -n1)
          test -n "$URL" && test "$URL" != null
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$URL" -o apks.zip
          mkdir -p test-apks
          unzip -q apks.zip -d test-apks
          find test-apks -type f -name '*.apk' -print
          test -s "$(find test-apks -type f -name 'app-mobile-debug.apk' -print -quit)"
          test -s "$(find test-apks -type f -name 'app-tv-debug.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: XSportsX-retry-apks-${{ github.sha }}
          path: test-apks/**/*.apk
          if-no-files-found: error

  mobile:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-retry-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve mobile APK
        run: |
          set -eu
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-mobile-debug.apk' -print -quit)
          test -s "$APK"
          echo "MOBILE_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules before emulator
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-mobile.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mobile emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          pre-emulator-launch-script: adb kill-server || true
          script: |
            set -eu
            adb start-server
            adb wait-for-device
            for i in $(seq 1 60); do
              state=$(adb -s emulator-5554 get-state 2>/dev/null || true)
              [ "$state" = device ] && break
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 2
            done
            test "$(adb -s emulator-5554 get-state)" = device
            adb shell input keyevent 82 || true
            python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
            QA_SERVER_PID=$!
            trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:8765/health >/dev/null
            curl -fsS http://10.0.2.2:8765/health >/dev/null
            bash scripts/qa_regression_test.sh "$MOBILE_APK" test-output-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-mobile-retry-${{ github.sha }}
          path: |
            test-output-mobile/**
            qa-source.log
            public-schedule-mobile.json
          if-no-files-found: ignore

  tv:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: XSportsX-retry-apks-${{ github.sha }}
          path: test-apks
      - name: Resolve TV APK
        run: |
          set -eu
          APK=$(find "$GITHUB_WORKSPACE/test-apks" -type f -name 'app-tv-debug.apk' -print -quit)
          test -s "$APK"
          echo "TV_APK=$APK" >> "$GITHUB_ENV"
      - name: Probe public schedules before emulator
        run: python3 scripts/qa_public_schedule_probe.py public-schedule-tv.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: true
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          pre-emulator-launch-script: adb kill-server || true
          script: |
            set -eu
            adb start-server
            adb wait-for-device
            for i in $(seq 1 60); do
              state=$(adb -s emulator-5554 get-state 2>/dev/null || true)
              [ "$state" = device ] && break
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 2
            done
            test "$(adb -s emulator-5554 get-state)" = device
            python3 scripts/qa_source_server.py > qa-source.log 2>&1 &
            QA_SERVER_PID=$!
            trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:8765/health >/dev/null
            curl -fsS http://10.0.2.2:8765/health >/dev/null
            bash scripts/qa_regression_test.sh "$TV_APK" test-output-tv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XSportsX-tv-retry-${{ github.sha }}
          path: |
            test-output-tv/**
            qa-source.log
            public-schedule-tv.json
          if-no-files-found: ignore
