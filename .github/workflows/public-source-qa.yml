name: Public IPTV Source QA

on:
  push:
    branches: [ android-app ]
  workflow_dispatch:

jobs:
  public-source-qa:
    name: Public IPTV source QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TV upcoming repair when requested
        if: ${{ hashFiles('.github/APPLY_TV_UPCOMING_FIX') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/TvHome.kt')
          s = p.read_text()
          old = '''private fun dateRange():String { val fmt=SimpleDateFormat("yyyyMMdd",Locale.US).apply{timeZone=TimeZone.getTimeZone("UTC")}; val cal=Calendar.getInstance(TimeZone.getTimeZone("UTC")); cal.add(Calendar.DAY_OF_YEAR,-1); val yesterday=fmt.format(cal.time); cal.add(Calendar.DAY_OF_YEAR,2); return "$yesterday-${fmt.format(cal.time)}" }'''
          new = '''private fun dateRange():String { val fmt=SimpleDateFormat("yyyyMMdd",Locale.US).apply{timeZone=TimeZone.getTimeZone("UTC")}; val cal=Calendar.getInstance(TimeZone.getTimeZone("UTC")); val today=fmt.format(cal.time); cal.add(Calendar.DAY_OF_YEAR,3); return "$today-${fmt.format(cal.time)}" }'''
          if old not in s: raise SystemExit('dateRange anchor not found')
          s = s.replace(old, new, 1)
          old = '''    var loadingLive by remember{mutableStateOf(true)}
    var loadingUpcoming by remember{mutableStateOf(false)}'''
          new = '''    var loadingLive by remember{mutableStateOf(true)}
    var loadingUpcoming by remember{mutableStateOf(true)}'''
          if old not in s: raise SystemExit('loading state anchor not found')
          s = s.replace(old, new, 1)
          old = '''            if(result!=null){
                liveGames=result.first
                upcomingGames=result.second
            }
            loadingLive=false
            delay(60_000)'''
          new = '''            if(result!=null){
                liveGames=result.first
                upcomingGames=result.second
            }
            loadingLive=false
            loadingUpcoming=false
            delay(60_000)'''
          if old not in s: raise SystemExit('refresh completion anchor not found')
          s = s.replace(old, new, 1)
          old = '''    LaunchedEffect(selectedNav){
        if(selectedNav=="UPCOMING"&&upcomingGames.isEmpty()){
            loadingUpcoming=true
            upcomingGames=runCatching{loadTvGames(false)}.getOrDefault(emptyList())
            loadingUpcoming=false
        }
    }'''
          new = '''    LaunchedEffect(selectedNav){
        if(selectedNav=="UPCOMING"&&upcomingGames.isEmpty()&&!loadingUpcoming){
            loadingUpcoming=true
            upcomingGames=runCatching{loadTvGames(false)}.getOrDefault(emptyList())
            loadingUpcoming=false
        }
    }'''
          if old not in s: raise SystemExit('upcoming effect anchor not found')
          s = s.replace(old, new, 1)
          old = '''                        TvSection("NEXT GAMES",if(upcomingGames.isEmpty())"Loading schedule…" else "${upcomingGames.size} UPCOMING")
                        if(upcomingGames.isNotEmpty())TvGameRow(upcomingGames.take(10),onNetwork)else TvLiveEmpty(true)'''
          new = '''                        TvSection("NEXT GAMES",when {
                            loadingUpcoming -> "Loading schedule…"
                            upcomingGames.isNotEmpty() -> "${upcomingGames.size} UPCOMING"
                            else -> "NO UPCOMING GAMES"
                        })
                        if(upcomingGames.isNotEmpty())TvGameRow(upcomingGames.take(10),onNetwork)else TvLiveEmpty(loadingUpcoming)'''
          if old not in s: raise SystemExit('home upcoming render anchor not found')
          s = s.replace(old, new, 1)
          Path('.github/APPLY_TV_UPCOMING_FIX').unlink(missing_ok=True)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/TvHome.kt .github/APPLY_TV_UPCOMING_FIX
          git commit -m 'fix: stop upcoming panel infinite loading'
          git push origin android-app
      - name: Probe every enabled public source
        run: python3 qa/public_source_probe.py | tee public-source-qa.txt
      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-qa
          path: public-source-qa.txt
