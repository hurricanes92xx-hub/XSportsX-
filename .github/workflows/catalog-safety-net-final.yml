name: Catalog safety net

on:
  push:
    branches: [main, fix/catalog-safety-net-v3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'hotfix: catalog safety') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden catalog fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('render-entry-v526.js')
          s = p.read_text()
          old = 'const isCatalog=target.pathname.includes("/catalog/channel/");if(isCatalog&&ur.statusCode===200){try{const parsed=JSON.parse(data);if(!Array.isArray(parsed.metas)||parsed.metas.length===0){const id=target.pathname.split("/catalog/channel/")[1].replace(/\\.json$/i,"");return json(res,fallbackCatalog(id),200,10);}}catch{}}'
          new = 'const isCatalog=target.pathname.includes("/catalog/channel/");if(isCatalog){const id=target.pathname.split("/catalog/channel/")[1].replace(/\\.json$/i,"");try{const parsed=JSON.parse(data);if(ur.statusCode===200&&Array.isArray(parsed.metas)&&parsed.metas.length>0){}else{return json(res,fallbackCatalog(id),200,10);}}catch{return json(res,fallbackCatalog(id),200,10);}}'
          if old not in s:
              raise SystemExit('gateway catalog block not found')
          p.write_text(s.replace(old,new,1))

          p = Path('sports-router.js')
          s = p.read_text()
          old = 'if(id==="ufc"||id==="ufc-v2"){return json(res,{metas:await ufcCatalog()},200,30);}if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}if(LEAGUES[id])return json(res,{metas:await leagueCatalog(id)},200,15);'
          new = 'if(id==="ufc"||id==="ufc-v2"){return json(res,{metas:await ufcCatalog()},200,30);}if(LEAGUES[id]){const ms=await leagueCatalog(id);return json(res,{metas:ms.length?ms:[{id:`sport:hub:${id}`,type:"channel",name:`${LEAGUES[id][3]} ${LEAGUES[id][0]} — Sports Hub`,description:`${LEAGUES[id][0]} catalog is refreshing.`,genres:["Sports",LEAGUES[id][0]],league:id}]},200,15);}return json(res,{metas:[]});'
          if old not in s:
              raise SystemExit('duplicate UFC catalog block not found')
          p.write_text(s.replace(old,new,1))

      - name: Validate
        run: |
          node --check sports-router.js
          node --check render-entry-v526.js

      - name: Commit catalog repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add render-entry-v526.js sports-router.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'hotfix: catalog safety fallback'
          git push
