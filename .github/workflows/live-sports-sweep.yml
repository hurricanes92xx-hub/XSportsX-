name: Live Sports State Sweep

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'scripts/live_sports_sweep.py'
      - 'scripts/normalize_schedule_feed.py'
      - 'scripts/refresh_provider_matrix_v3.py'
      - 'scripts/refresh_schedules_legacy.py'
      - 'scripts/providers/ncaa.py'
      - '.github/workflows/live-sports-sweep.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

# Live state must never sit behind the slower 6-hour schedule refresh.
concurrency:
  group: xsportsx-live-sweep
  queue: 1
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  live-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install provider dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Ensure canonical feed exists before live reconciliation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/schedule_feed.json')
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
              events=data.get('events')
          except Exception:
              events=None
          if isinstance(events,list) and events:
              print(f'Canonical feed already contains {len(events)} events; skipping bootstrap refresh.')
          else:
              print('Canonical feed is empty or invalid; rebuilding it before the live sweep.')
              raise SystemExit(2)
          PY
        continue-on-error: true
        id: feed-check
      - name: Bootstrap canonical schedule when feed is empty
        if: steps.feed-check.outcome == 'failure'
        run: python3 scripts/refresh_provider_matrix_v3.py
      - name: Test cross-sport live state logic
        run: python3 scripts/test_live_sports_sweep.py
      - name: Run cross-sport provider live sweep
        run: python3 scripts/live_sports_sweep.py
      - name: Normalize live-sweep output
        run: python3 scripts/normalize_schedule_feed.py
      - name: Validate live-state contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/schedule_feed.json')
          if not p.exists(): raise SystemExit('ERROR: schedule_feed.json missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          events=data.get('events')
          if not isinstance(events,list) or not events: raise SystemExit('ERROR: canonical feed missing events')
          ids=[str(e.get('id','')) for e in events]
          if len(ids)!=len(set(ids)): raise SystemExit('ERROR: duplicate canonical event IDs')
          for i,e in enumerate(events):
              for key in ('id','sport','league','title','startUtc'):
                  if not e.get(key): raise SystemExit(f'ERROR: event {i} missing {key}')
          sweep=data.get('liveSweep') or {}
          if int(sweep.get('schema',0)) not in (1,2): raise SystemExit('ERROR: live sweep contract missing')
          if int(sweep.get('leaguesChecked',0)) < 1: raise SystemExit('ERROR: no live leagues checked')
          print(f"Live sweep: leagues={sweep.get('leaguesChecked')} fetched={sweep.get('providerEventsFetched')} providerLive={sweep.get('providerLive')} stateChanges={sweep.get('stateChanges')} added={sweep.get('eventsAdded')} inferred={sweep.get('boundedTimingPromotions')} liveAfter={sweep.get('liveCountAfterSweep')}")
          ufc=[e for e in events if str(e.get('league','')).upper()=='UFC' and 'hooker' in str(e.get('title','')).lower() and 'parnasse' in str(e.get('title','')).lower()]
          bad=[e for e in ufc if 'early prelim' in str(e.get('title','')).lower() or ('main card' not in str(e.get('title','')).lower() and 'prelims' not in str(e.get('title','')).lower())]
          if bad: raise SystemExit(f'ERROR: UFC Paris contains invalid duplicate/session records: {bad}')
          if len({str(e.get('title')) for e in ufc}) > 2: raise SystemExit('ERROR: UFC Paris has more than two canonical broadcast sessions')
          PY
      - name: Publish live-state checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Live State Bot'
          git config user.email 'xsportsx-live-state-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then echo 'No live-state changes.'; exit 0; fi
          git commit -m 'chore: publish cross-sport live state'
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            if git rebase --autostash origin/android-app; then
              if git push origin HEAD:android-app; then echo "Live-state publish succeeded on attempt ${attempt}."; exit 0; fi
            else
              git rebase --abort || true
              git reset --mixed origin/android-app
              git add data/schedule_feed.json
              if ! git diff --cached --quiet; then git commit -m 'chore: republish cross-sport live state'; fi
            fi
            sleep $((attempt * 2))
          done
          exit 1
