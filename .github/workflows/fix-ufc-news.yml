name: Repair UFC and Sports News

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[xsportsx-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          old='''const VERSION = "5.0.8";\nconst ADDON_ID = "com.xsportsx.sports.epg.v508";\nconst PREFIX = "/v508";'''
          new='''const VERSION = "5.0.9";\nconst ADDON_ID = "com.xsportsx.sports.epg.v509";\nconst PREFIX = "/v509";'''
          if old in s: s=s.replace(old,new,1)
          old='''function eventMeta(ev,league){const[name,,,icon]=LEAGUES[league],c=ev?.competitions?.[0],teams=c?.competitors||[],h=teams.find(x=>x.homeAway==="home")?.team||teams[0]?.team||{},a=teams.find(x=>x.homeAway==="away")?.team||teams[1]?.team||{};if(!h?.displayName&&!a?.displayName)return null;const state=c?.status?.type?.state||"pre",detail=c?.status?.type?.shortDetail||c?.status?.type?.detail||"Scheduled",start=ev.date||c?.date||"",id=`sport:${ev.id}`;const eventName=league==="ufc"?(ev.name||ev.shortName||`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`):`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`;const meta={id,type:"channel",name:eventName,poster:h.logo||h.logos?.[0]?.href||a.logo||a.logos?.[0]?.href||undefined,background:h.logo||a.logo||undefined,description:`${icon} ${name}\\n${detail}\\n${start}`,releaseInfo:start,genres:["Sports",name,state==="in"?"LIVE":"Scheduled"],sportSource:league,eventSport:league,league,eventId:String(ev.id),event:{id:String(ev.id),league,start,state,home:team(h),away:team(a),broadcast:(c?.broadcasts||[]).flatMap(x=>x.names||[])}};eventCache.set(id,meta);return meta;}'''
          new='''function eventMeta(ev,league){const[name,,,icon]=LEAGUES[league],c=ev?.competitions?.[0],teams=c?.competitors||[],h=teams.find(x=>x.homeAway==="home")?.team||teams[0]?.team||{},a=teams.find(x=>x.homeAway==="away")?.team||teams[1]?.team||{};if(league!=="ufc"&&!h?.displayName&&!a?.displayName)return null;const state=c?.status?.type?.state||ev?.status?.type?.state||"pre",detail=c?.status?.type?.shortDetail||c?.status?.type?.detail||ev?.status?.type?.shortDetail||ev?.status?.type?.detail||"Scheduled",start=ev.date||c?.date||"",id=`sport:${ev.id}`;const eventName=league==="ufc"?(ev.name||ev.shortName||c?.name||"UFC Event"):`${a.displayName||"TBD"} vs ${h.displayName||"TBD"}`;const meta={id,type:"channel",name:eventName,poster:h.logo||h.logos?.[0]?.href||a.logo||a.logos?.[0]?.href||undefined,background:h.logo||a.logo||undefined,description:`${icon} ${name}\\n${detail}\\n${start}`,releaseInfo:start,genres:["Sports",name,state==="in"?"LIVE":"Scheduled"],sportSource:league,eventSport:league,league,eventId:String(ev.id),event:{id:String(ev.id),league,start,state,home:team(h),away:team(a),broadcast:(c?.broadcasts||[]).flatMap(x=>x.names||[])}};eventCache.set(id,meta);return meta;}'''
          if old not in s: raise SystemExit('eventMeta pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Patch Render proxy version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('render-proxy.js')
          s=p.read_text()
          s=s.replace('PREFIX="v508"','PREFIX="v509"',1)
          s=s.replace('COMPAT_PREFIXES=["v508",','COMPAT_PREFIXES=["v509","v508",',1)
          s=s.replace('v508-compatible','v509-compatible')
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "xsportsx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports-router.js render-proxy.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore UFC events and sports news [xsportsx-auto]"
          git push
