name: Repair UFC v511
on:
  push:
    branches: [main]
jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply UFC v511 repair'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch router and proxy
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('const VERSION = "5.0.10";', 'const VERSION = "5.0.11";')
          s=s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v510";', 'const ADDON_ID = "com.xsportsx.sports.epg.v511";')
          s=s.replace('const PREFIX = "/v510";', 'const PREFIX = "/v511";')
          if 'function ufcLogo()' not in s:
              s=s.replace('function newsLogo(group){return `${BASE}${PREFIX}/assets/news/${newsSlug(group)}.svg`;}','function newsLogo(group){return `${BASE}${PREFIX}/assets/news/${newsSlug(group)}.svg`;}\nfunction ufcLogo(){return `${BASE}${PREFIX}/assets/ufc.svg`;}')
          s=s.replace('poster:league==="ufc"?`${BASE}${PREFIX}/assets/ufc.svg`:', 'poster:league==="ufc"?ufcLogo():')
          s=s.replace('background:league==="ufc"?`${BASE}${PREFIX}/assets/ufc.svg`:', 'background:league==="ufc"?ufcLogo():')
          old=re.compile(r'async function ufcCatalog\(c\)\{.*?\n\}\n\nasync function allSports', re.S)
          new='''function ufcFallback(){const id="sport:ufc-command-center";const meta={id,type:"channel",name:"UFC Command Center",poster:ufcLogo(),background:ufcLogo(),description:"🥊 UFC • Upcoming events and UFC-related channels",releaseInfo:new Date().toISOString(),genres:["Sports","UFC"],sportSource:"ufc",eventSport:"ufc",league:"ufc",event:{id:"ufc-command-center",league:"ufc",start:new Date().toISOString(),state:"pre",home:{id:"ufc",name:"UFC",short:"UFC",logo:ufcLogo()},away:{id:"ufc",name:"UFC",short:"UFC",logo:ufcLogo()},broadcast:[]}};eventCache.set(id,meta);return meta;}\nasync function ufcCatalog(c){const [events,xd]=await Promise.all([leagueCatalog("ufc").catch(()=>[]),c?xtreamData(c).catch(()=>({metas:[]})):{metas:[]}]);const ufcChannels=(xd.metas||[]).filter(m=>{const v=norm(`${m.name} ${m.xtream?.category||""}`);return /\\b(ufc|ultimate fighting championship|fight pass|ufc fight|paramount\\+|paramount plus|cbs sports)\\b/i.test(v);});const seen=new Set(),out=[];for(const m of [...events,...ufcChannels]){if(!seen.has(m.id)){seen.add(m.id);out.push(m);}}if(!out.length)out.push(ufcFallback());return out;}\n\nasync function allSports'''
          s,n=old.subn(new,s,count=1)
          if n==0: raise SystemExit('UFC function pattern not found')
          if 'path==="/assets/ufc.svg"' not in s:
              marker='const server=http.createServer(async(req,res)=>{try{'
              asset='''const server=http.createServer(async(req,res)=>{try{if(path==="/assets/ufc.svg"){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" rx="28" fill="#111"/><rect x="24" y="24" width="592" height="312" rx="22" fill="#171717" stroke="#d71920" stroke-width="5"/><text x="320" y="205" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="110" font-weight="900">UFC</text><text x="320" y="250" text-anchor="middle" fill="#d71920" font-family="Arial,sans-serif" font-size="23" font-weight="700">ULTIMATE FIGHTING CHAMPIONSHIP</text></svg>`;res.writeHead(200,{"content-type":"image/svg+xml","cache-control":"public,max-age=86400"});return res.end(svg);}'''
              # path is declared after the try in the original; insert after URL line instead if needed
              s=s.replace('const u=new URL(req.url||"/","http://localhost"),path=u.pathname,c=configFrom(req.url||"/");', 'const u=new URL(req.url||"/","http://localhost"),path=u.pathname,c=configFrom(req.url||"/");if(path==="/assets/ufc.svg"){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" rx="28" fill="#111"/><rect x="24" y="24" width="592" height="312" rx="22" fill="#171717" stroke="#d71920" stroke-width="5"/><text x="320" y="205" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="110" font-weight="900">UFC</text><text x="320" y="250" text-anchor="middle" fill="#d71920" font-family="Arial,sans-serif" font-size="23" font-weight="700">ULTIMATE FIGHTING CHAMPIONSHIP</text></svg>`;res.writeHead(200,{"content-type":"image/svg+xml","cache-control":"public,max-age=86400"});return res.end(svg);}')
          p.write_text(s)

          p=Path('render-proxy.js')
          s=p.read_text()
          s=s.replace('PREFIX="v510"', 'PREFIX="v511"')
          s=s.replace('COMPAT_PREFIXES=["v510",', 'COMPAT_PREFIXES=["v511","v510",')
          s=s.replace('v510-compatible', 'v511-compatible')
          p.write_text(s)
          PY
      - name: Validate
        run: node --check sports-router.js && node --check render-proxy.js
      - name: Commit repair
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sports-router.js render-proxy.js
          git diff --cached --quiet || (git commit -m 'chore: apply UFC v511 repair' && git push)