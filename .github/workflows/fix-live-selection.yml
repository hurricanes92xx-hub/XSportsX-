name: XSportsX live selection fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('server.js')
          s = p.read_text()

          # Make the live server and manifest report the same build as bootstrap.
          s = s.replace("version:'7.2.0'", "version:'7.3.1'")
          s = s.replace("'X-XSportsX-Build':'7.2.0'", "'X-XSportsX-Build':'7.3.1'")

          # Replace catalogEvents so aggregate catalogs are also restricted to the
          # private connection's selected leagues. Previously only individual league
          # catalogs were checked, allowing Live Now/Starting Soon/Command Center
          # to bring back events from unselected leagues.
          pattern = r"async function catalogEvents\(id\)\{.*?\}\nfunction catalogs\(\)"
          replacement = """async function catalogEvents(id){const c=config();const allowed=new Set(Array.isArray(c.sports)&&c.sports.length?c.sports:Object.keys(LEAGUES));const ev=(await allEvents()).filter(e=>allowed.has(e.league));if(id==='live-now')return ev.filter(e=>e.state==='in');if(id==='starting-soon')return ev.filter(e=>e.state==='pre').slice(0,80);if(id==='sports-command-center')return ev.slice(0,100);if(LEAGUES[id])return allowed.has(id)?ev.filter(e=>e.league===id):[];return[];}\nfunction catalogs()"""
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('catalogEvents function not found; refusing partial patch')
          p.write_text(s2)
          PY

      - name: Commit live fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No server changes needed"
          else
            git commit -m "Fix selected leagues in live server"
            git push
          fi
