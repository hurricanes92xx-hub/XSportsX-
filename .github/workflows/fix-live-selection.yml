name: XSportsX live selection fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server from source of truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js'); s=p.read_text()
          # Never allow the old version to return.
          s=re.sub(r"version:'(?:6\.0\.1|7\.2\.0|7\.3\.1|7\.4\.0)'", "version:'7.5.0'", s)
          s=re.sub(r"'X-XSportsX-Build':'(?:6\.0\.1|7\.2\.0|7\.3\.1|7\.4\.0)'", "'X-XSportsX-Build':'7.5.0'", s)

          # Canonicalize UI labels to the LEAGUES keys used by ESPN/event data.
          aliases={
            'nfl':['nfl','football'], 'ncaaf':['ncaaf','ncaa football','college football','college-football'],
            'nba':['nba'], 'wnba':['wnba'], 'ncaab':['ncaab','ncaa basketball','college basketball','mens-college-basketball'],
            'mlb':['mlb'], 'nhl':['nhl'], 'mls':['mls'], 'epl':['epl','premier league','english premier league'],
            'ucl':['ucl','uefa champions league','champions league'], 'laliga':['laliga','la liga'],
            'seriea':['seriea','serie a'], 'bundesliga':['bundesliga'], 'ligue1':['ligue1','ligue 1'],
            'ufc':['ufc','mma'], 'boxing':['boxing','box']}
          alias_js=repr(aliases).replace("'", '"')
          canonical = """function selectedLeagueSet(c){const raw=Array.isArray(c?.sports)?c.sports:[];if(!raw.length)return new Set(Object.keys(LEAGUES));const aliases=%s;const out=new Set();for(const v of raw){const x=String(v||'').trim().toLowerCase();for(const [id,a] of Object.entries(aliases))if(a.includes(x)){out.add(id);break;}}return out;}\n""" % alias_js
          marker='function config(){'
          if 'function selectedLeagueSet(c)' not in s:
              s=s.replace(marker,canonical+marker,1)

          # Replace catalogEvents with selection-aware behavior.
          pat=r"async function catalogEvents\(id\)\{.*?\}\nfunction catalogs\(\)"
          repl="""async function catalogEvents(id){const allowed=selectedLeagueSet(config());const ev=(await allEvents()).filter(e=>allowed.has(e.league));if(id==='live-now')return ev.filter(e=>e.state==='in');if(id==='starting-soon')return ev.filter(e=>e.state==='pre').slice(0,80);if(id==='sports-command-center')return ev.slice(0,100);if(LEAGUES[id])return allowed.has(id)?ev.filter(e=>e.league===id):[];return[];}\nfunction catalogs()"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('catalogEvents not found')

          # Generate the manifest only from selected leagues. No aggregate catalogs
          # are exposed because they can reintroduce unselected sports in Nuvio.
          old=r"const manifest=\(base,c\)=>\(\{.*?\}\);"
          new="""const manifest=(base,c)=>{const allowed=selectedLeagueSet(c);return{id:'community.xsportsx',version:'7.5.0',name:'XSportsX',description:'Premium live sports for Nuvio using your own Xtream or M3U source.',resources:[{name:'catalog',types:['tv']},{name:'meta',types:['tv']},{name:'stream',types:['tv']}],types:['tv'],idPrefixes:['sport:','xtream:'],catalogs:manifestCatalogs.filter(x=>allowed.has(x.id)),behaviorHints:{configurable:false,configurationRequired:false},logo:`${base}/artwork/other.svg`};};"""
          s,n=re.subn(old,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('manifest definition not found')
          p.write_text(s)

          b=Path('bootstrap.js'); bs=b.read_text(); bs=re.sub(r"const BUILD_VERSION = '[^']+'","const BUILD_VERSION = '7.5.0'",bs); b.write_text(bs)
          PY

      - name: Validate
        run: |
          node --check server.js
          node --check bootstrap.js

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js bootstrap.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix personalized league manifest and bump to 7.5.0"; git push; fi
