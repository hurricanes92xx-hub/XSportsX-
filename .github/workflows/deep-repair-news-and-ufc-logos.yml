name: Deep repair news catalogs and UFC branding
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch router and generate branded assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sports-router.js')
          s=p.read_text()

          # Make Xtream news data authoritative and stale-while-revalidate.
          start=s.find('async function xtreamData(c){')
          end=s.find('function warmXtream(c){', start)
          if start < 0 or end < 0:
              raise SystemExit('xtreamData/warmXtream anchors not found; refusing unsafe patch')
          fn=r'''async function xtreamData(c){
          if(!c)return{metas:[],news:[],newsGroups:[],categories:[]};
          const key=`data:${c.server}|${c.username}`,hit=xtreamCache.get(key),now=Date.now();
          if(hit&&now-hit.at<300000)return hit.value;
          if(inFlight.has(key))return inFlight.get(key);
          const job=(async()=>{
            const [cats,streams]=await Promise.all([
              xtream(c,"get_live_categories").catch(()=>null),
              xtream(c,"get_live_streams").catch(()=>null)
            ]);
            const catList=Array.isArray(cats)?cats:[];
            const streamList=Array.isArray(streams)?streams:[];
            const cm=new Map(catList.map(x=>[String(x.category_id),x.category_name||"Live TV"]));
            if(!streamList.length && hit?.value)return hit.value;
            const metas=streamList.map(s=>{
              const cat=cm.get(String(s.category_id))||s.category_name||s.category||"Live TV";
              const ext=String(s.container_extension||"ts").replace(/[^a-z0-9]/gi,"")||"ts";
              return {id:`xtream:${s.stream_id}`,type:"channel",name:s.name||`Channel ${s.stream_id}`,poster:s.stream_icon||undefined,background:s.stream_icon||undefined,description:`📺 ${cat}`,genres:["IPTV","Live TV",cat],behaviorHints:{isLive:true},xtream:{streamUrl:`${c.server}/live/${encodeURIComponent(c.username)}/${encodeURIComponent(c.password)}/${encodeURIComponent(s.stream_id)}.${ext}`,category:cat}};
            });
            const scored=metas.map(m=>({meta:m,category:m.xtream.category,score:newsScore(m.name,m.xtream.category)}));
            const news=scored.filter(x=>x.score>=70).map(x=>x.meta);
            const newsGroups=Object.entries(NEWS_GROUPS).map(([group])=>{
              const channels=scored.filter(x=>newsGroupFor(x.meta.name,x.category)===group);
              if(!channels.length)return null;
              return {id:`news:${slug(group)}`,type:"channel",name:group,poster:newsLogo(group),background:newsLogo(group),logo:newsLogo(group),description:`${channels.length} ${group} channel${channels.length===1?"":"s"} from your Xtream provider`,genres:["Sports News",group],behaviorHints:{isLive:true},newsGroup:group};
            }).filter(Boolean);
            const value={metas,news,newsGroups,categories:[...cm.values()]};
            xtreamCache.set(key,{at:Date.now(),value});
            return value;
          })().catch(()=>hit?.value||{metas:[],news:[],newsGroups:[],categories:[]}).finally(()=>inFlight.delete(key));
          inFlight.set(key,job);return job;
          }
          '''
          s=s[:start]+fn+s[end:]

          # Force Stremio/Nuvio catalog/meta/stream requests for news to use Xtream directly.
          helper=r'''async function forcedXtreamNewsRoute(req,res,u){
          const m=u.pathname.match(/\/catalog\/channel\/([^/]+?)(?:\.json)?$/i);
          const mm=u.pathname.match(/\/meta\/channel\/([^/]+?)(?:\.json)?$/i);
          const sm=u.pathname.match(/\/stream\/channel\/([^/]+?)(?:\.json)?$/i);
          if(!m&&!mm&&!sm)return false;
          const raw=decodeURIComponent((m||mm||sm)[1]);
          const cfg=configFrom(req.url);if(!cfg)return false;
          const d=await xtreamData(cfg);
          if(m){
            const id=raw.toLowerCase();
            if(id!=="sports-news"&&!id.startsWith("news:"))return false;
            if(id==="sports-news")return json(res,{metas:d.newsGroups},200,20),true;
            const group=id.slice(5);
            const groupName=Object.keys(NEWS_GROUPS).find(x=>slug(x)===group)||group.replace(/-/g," ");
            const channels=d.metas.filter(x=>newsGroupFor(x.name,x.xtream?.category)===groupName);
            return json(res,{metas:[{id:`news:${slug(groupName)}`,type:"channel",name:groupName,poster:newsLogo(groupName),background:newsLogo(groupName),logo:newsLogo(groupName),description:`${channels.length} live ${groupName} channel${channels.length===1?"":"s"} from your Xtream provider`,genres:["Sports News",groupName],behaviorHints:{isLive:true},newsGroup:groupName}]},200,20),true;
          }
          if(mm){
            if(raw.toLowerCase().startsWith("news:")){
              const group=raw.slice(5),groupName=Object.keys(NEWS_GROUPS).find(x=>slug(x)===group)||group.replace(/-/g," ");
              const channels=d.metas.filter(x=>newsGroupFor(x.name,x.xtream?.category)===groupName);
              return json(res,{meta:{id:raw,type:"channel",name:groupName,poster:newsLogo(groupName),background:newsLogo(groupName),logo:newsLogo(groupName),description:`${channels.length} live ${groupName} channel${channels.length===1?"":"s"} from your Xtream provider`,genres:["Sports News",groupName],behaviorHints:{isLive:true},newsGroup:groupName}},200,30),true;
            }
            const meta=d.metas.find(x=>x.id===raw);if(!meta)return false;
            return json(res,{meta},200,30),true;
          }
          if(sm){
            let channels=[];
            if(raw.toLowerCase().startsWith("news:")){
              const group=raw.slice(5),groupName=Object.keys(NEWS_GROUPS).find(x=>slug(x)===group)||group.replace(/-/g," ");
              channels=d.metas.filter(x=>newsGroupFor(x.name,x.xtream?.category)===groupName);
            }else{
              const meta=d.metas.find(x=>x.id===raw);if(meta)channels=[meta];
            }
            return json(res,{streams:channels.map(x=>({name:`▶ ${x.name}`,title:x.name,url:x.xtream.streamUrl,description:x.xtream.category}))},200,15),true;
          }
          return false;
          }
          '''
          if 'async function forcedXtreamNewsRoute(' not in s:
              marker='function manifest(){'
              pos=s.find(marker)
              if pos<0: raise SystemExit('manifest anchor not found')
              s=s[:pos]+helper+s[pos:]

          # Intercept the standard protocol route before the generic router.
          anchor='const u=new URL(req.url||"/","http://localhost"),'
          pos=s.find(anchor)
          if pos<0: raise SystemExit('request URL anchor not found')
          # Insert immediately after the opening of the server callback, before generic routing.
          cb=s.rfind('http.createServer(async(req,res)=>{',0,pos)
          if cb<0: raise SystemExit('server callback anchor not found')
          insert_at=cb+len('http.createServer(async(req,res)=>{')
          hook='try{const fu=new URL(req.url||"/","http://localhost");if(await forcedXtreamNewsRoute(req,res,fu))return;}catch(e){console.error("forced Xtream news route",e)}'
          if 'forcedXtreamNewsRoute(req,res' not in s:
              s=s[:insert_at]+hook+s[insert_at:]

          s=s.replace('const VERSION="5.0.17";','const VERSION="5.0.18";')
          p.write_text(s)

          # Generate deterministic branded SVG wordmarks so cards never fall back to blank posters.
          logos={
            'espn':('ESPN','#d71920'),'acc-network':('ACC NETWORK','#004b8d'),'sec-network':('SEC NETWORK','#d4a017'),
            'big-ten-network':('BIG TEN NETWORK','#0064a0'),'nfl-network':('NFL NETWORK','#013369'),'mlb-network':('MLB NETWORK','#002d62'),
            'nba-tv':('NBA TV','#1d428a'),'nhl-network':('NHL NETWORK','#111111'),'cbs-sports':('CBS SPORTS','#0b4f9c'),
            'fox-sports':('FOX SPORTS','#0057b8'),'golf-channel':('GOLF CHANNEL','#16804b'),'tnt-sports':('TNT SPORTS','#d71920'),
            'nbc-sports':('NBC SPORTS','#0875b9'),'bein-sports':('beIN SPORTS','#6b2a91'),'sportsnet':('SPORTSNET','#d71920'),
            'tennis-channel':('TENNIS CHANNEL','#008f6b'),'sports-news':('SPORTS NEWS','#f0a000')
          }
          Path('assets/news').mkdir(parents=True,exist_ok=True)
          for fn,(label,bg) in logos.items():
              safe=label.replace('&','&amp;')
              svg=f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" rx="32" fill="#171717"/><rect x="18" y="18" width="604" height="324" rx="26" fill="{bg}" opacity=".96"/><text x="320" y="210" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="62" font-weight="900" fill="#fff">{safe}</text></svg>'''
              Path('assets/news',fn+'.svg').write_text(svg)
          PY
          node --check sports-router.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-router.js assets/news assets/ufc.svg
          git diff --cached --quiet && exit 0
          git commit -m "Deep repair Xtream news catalogs and branded UFC/news cards"
          git push
