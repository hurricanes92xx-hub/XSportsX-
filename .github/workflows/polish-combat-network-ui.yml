name: Polish combat and network UI

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0
      - name: Apply network UI patch
        run: python3 .github/patch_networks.py
      - name: Validate Kotlin source
        run: |
          git diff --check
          test -s app/src/main/java/com/xsportsx/app/TvHome.kt
          test -s app/src/main/java/com/xsportsx/app/FuturisticSports.kt
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/patch_networks.py app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix TV league and network logos"
          git push origin android-app
