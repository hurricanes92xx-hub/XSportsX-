name: Polish combat and network UI

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0
      - name: Apply network UI patch
        run: python3 .github/patch_networks.py
      - name: Apply ticker and Xtreme crack patch
        run: python3 .github/patch_ticker_cracks.py
      - name: Apply shared XSportsX branding
        run: python3 .github/patch_branding.py
      - name: Validate Kotlin source
        run: |
          git diff --check
          test -s app/src/main/java/com/xsportsx/app/XtremeLogo.kt
          test -s app/src/main/java/com/xsportsx/app/TvHome.kt
          test -s app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          test -s app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt
          grep -q 'fun XtremeLogo' app/src/main/java/com/xsportsx/app/XtremeLogo.kt
          grep -q 'versionName = "1.6.5"' app/build.gradle.kts
          grep -q 'XtremeLogo(size = 46.dp)' app/src/main/java/com/xsportsx/app/FuturisticSports.kt
          grep -q 'XtremeLogo(size = 72.dp)' app/src/main/java/com/xsportsx/app/TvHome.kt
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/patch_networks.py .github/patch_ticker_cracks.py .github/patch_branding.py app/build.gradle.kts app/src/main/java/com/xsportsx/app/XtremeLogo.kt app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHome.kt app/src/main/java/com/xsportsx/app/HomeSportsTicker.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Xtreme logo validation for mobile and TV"
          git push origin android-app
