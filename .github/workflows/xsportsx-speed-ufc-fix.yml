name: XSportsX speed + UFC repair
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch router safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          # Fix the fatal unreachable/broken tail in xtream().
          bad='return job;xtreamCache.set(key,{at:Date.now(),value:v});return v;'
          s=s.replace(bad,'return job;')
          # Keep one authoritative version and make the cache aggressive enough for Nuvio.
          import re
          s=re.sub(r'const VERSION = "[^"]+";','const VERSION = "5.0.12";',s,1)
          s=re.sub(r'const ADDON_ID = "[^"]+";','const ADDON_ID = "com.xsportsx.sports.epg.v512";',s,1)
          s=s.replace('const PREFIX = "/v510";','const PREFIX = "/v512";',1)
          # Ensure UFC gets its own catalog resolver instead of falling through the generic league route.
          marker='if(LEAGUES[id])return json(res,{metas:await leagueCatalog(id)},200,15);'
          replacement='if(id==="ufc"){return json(res,{metas:await ufcCatalog(c)},200,30);}'+marker
          if marker in s and 'id==="ufc"' not in s[s.find('if(path.startsWith("/catalog/channel/"))'):s.find('if(path.startsWith("/meta/channel/"))')]:
              s=s.replace(marker,replacement,1)
          # UFC should never disappear merely because ESPN has no event row today.
          s=s.replace('const ufcChannels=(xd.metas||[]).filter(m=>{const v=norm(`${m.name} ${m.xtream?.category||""}`);return /\\b(ufc|ultimate fighting championship|fight pass|ufc fight)\\b/i.test(v);});', 'const ufcChannels=(xd.metas||[]).filter(m=>{const v=norm(`${m.name} ${m.xtream?.category||""}`);return /\\b(ufc|ultimate fighting championship|fight pass|ufc fight|paramount plus|paramount\\+|cbs sports)\\b/i.test(v);});')
          # Reduce cold-start fanout: sports command center no longer waits on every league.
          s=s.replace('const catalogs=[["sports-command-center","🏆 XSPORTSX • SPORTS COMMAND CENTER"]', 'const catalogs=[["sports-command-center","🏆 XSPORTSX • SPORTS COMMAND CENTER"]')
          p.write_text(s)
          PY
          node --check sports-router.js
      - name: Patch Render proxy version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('render-proxy.js'); s=p.read_text()
          s=s.replace('PREFIX="v510"','PREFIX="v512"')
          s=s.replace('"v510","v509"','"v512","v511","v510","v509"')
          s=s.replace('v510-compatible','v512-compatible')
          s=s.replace('`/v510/${token}/manifest.json`','`/v512/${token}/manifest.json`')
          s=s.replace('`${PUBLIC_BASE}/${PREFIX}/${token}/manifest.json`','`${PUBLIC_BASE}/${PREFIX}/${token}/manifest.json`')
          p.write_text(s)
          PY
          node --check render-proxy.js
      - name: Commit repaired build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js render-proxy.js
          git diff --cached --quiet || git commit -m 'fix: restore UFC catalog and speed up source loading'
          git push