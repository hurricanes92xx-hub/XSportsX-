name: Prefer Xtream provider logos on news cards
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use real Xtream channel icons for network cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sports-router.js');s=p.read_text()
          old='return{id:`news:${slug(group)}`,type:"channel",name:group,poster:newsLogo(group),background:newsLogo(group),logo:newsLogo(group),description:`${channels.length} ${group} channel${channels.length===1?"":"s"} from your Xtream provider`,genres:["Sports News",group],behaviorHints:{isLive:true},newsGroup:group}'
          new='const providerLogo=channels.find(x=>x.meta?.poster)?.meta?.poster||channels.find(x=>x.meta?.background)?.meta?.background||newsLogo(group);return{id:`news:${slug(group)}`,type:"channel",name:group,poster:providerLogo,background:providerLogo,logo:providerLogo,description:`${channels.length} ${group} channel${channels.length===1?"":"s"} from your Xtream provider`,genres:["Sports News",group],behaviorHints:{isLive:true},newsGroup:group}'
          if old in s:
              s=s.replace(old,new,1)
          else:
              old2='return{id:`news:${slug(group)}`,type:"channel",name:group,poster:newsLogo(group),background:newsLogo(group),logo:newsLogo(group)'
              if old2 in s:s=s.replace(old2,'const providerLogo=channels.find(x=>x.meta?.poster)?.meta?.poster||newsLogo(group);return{id:`news:${slug(group)}`,type:"channel",name:group,poster:providerLogo,background:providerLogo,logo:providerLogo',1)
          p.write_text(s)
          PY
          node --check sports-router.js
      - name: Commit logo polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-router.js
          git diff --cached --quiet && exit 0
          git commit -m "Prefer actual Xtream logos for news network cards"
          git push
