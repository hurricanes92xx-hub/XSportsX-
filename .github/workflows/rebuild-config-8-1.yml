name: Rebuild XSportsX configuration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild configuration and version
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text()

          # Make 8.1.0 the single application version.
          s = re.sub(r"7\.5\.0|8\.0\.0|7\.6\.1|7\.4\.0|7\.3\.0|7\.2\.0", "8.1.0", s)

          # Replace the old one-page setup with a guided, grouped sports wizard.
          start = s.index('function setupHtml(req){')
          end = s.index("app.get('/configure'", start)
          new_setup = r'''function setupHtml(req){
            const b=baseUrl(req);
            const groups={
              'FOOTBALL':[['nfl','NFL','🏈'],['ncaaf','NCAA Football','🏈']],
              'BASKETBALL':[['nba','NBA','🏀'],['wnba','WNBA','🏀'],['ncaab','NCAA Basketball','🏀']],
              'BASEBALL & HOCKEY':[['mlb','MLB','⚾'],['nhl','NHL','🏒']],
              'SOCCER':[['mls','MLS','⚽'],['epl','Premier League','⚽'],['ucl','UEFA Champions League','⚽'],['laliga','LaLiga','⚽'],['seriea','Serie A','⚽'],['bundesliga','Bundesliga','⚽'],['ligue1','Ligue 1','⚽']],
              'COMBAT':[['ufc','UFC','🥊'],['boxing','Boxing','🥊']]
            };
            const groupHtml=Object.entries(groups).map(([g,items])=>'<section class="sport-group"><div class="group-title">'+g+'</div><div class="league-grid">'+items.map(x=>'<button type="button" class="league" data-sport="'+x[0]+'" onclick="toggleLeague(\''+x[0]+'\')"><span class="check">✓</span><span class="emoji">'+x[2]+'</span><span>'+x[1]+'</span></button>').join('')+'</div></section>').join('');
            return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><title>XSportsX • Sports Setup</title><style>
            *{box-sizing:border-box}body{margin:0;background:#03060d;color:#f6f8fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0,#172b52 0,transparent 34%),radial-gradient(circle at 90% 15%,#26101a 0,transparent 28%)}main{position:relative;max-width:1050px;margin:auto;padding:24px 16px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:29px;font-weight:950;font-style:italic;letter-spacing:2px}.logo b{color:#ff263d}.build{padding:7px 11px;border:1px solid #26354c;border-radius:999px;color:#9fb0c7;font-size:11px;font-weight:850;letter-spacing:.7px}.hero{margin-top:20px;padding:28px;border:1px solid #172338;border-radius:28px;background:linear-gradient(135deg,rgba(17,31,55,.94),rgba(4,8,16,.96));box-shadow:0 24px 80px rgba(0,0,0,.35)}.eyebrow{color:#ff5a6b;font-size:12px;font-weight:900;letter-spacing:1.2px}.hero h1{font-size:clamp(31px,6vw,52px);line-height:1.02;margin:9px 0 12px}.hero p{max-width:760px;color:#91a0b6;font-size:16px;line-height:1.55;margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.step{padding:12px 14px;border:1px solid #18263a;border-radius:15px;background:#080e18;color:#6f7f96;font-size:12px;font-weight:850}.step.active{border-color:#ff263d;color:#fff;background:#180b11}.card{margin-top:16px;padding:22px;border:1px solid #172338;border-radius:23px;background:rgba(6,11,20,.94)}h2{margin:0 0 7px;font-size:23px}.sub{color:#7f8da3;font-size:14px;line-height:1.45;margin:0 0 17px}.source-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.source{padding:15px;border:1px solid #27364c;border-radius:14px;background:#0a111e;color:#b8c6da;font-weight:950;cursor:pointer}.source.active{border-color:#ff263d;background:#2a0d14;color:#fff}.fields{margin-top:13px}.input,.select{width:100%;padding:14px 15px;margin:7px 0;border-radius:13px;border:1px solid #27364c;background:#050a12;color:#fff;font-size:15px;outline:none}.input:focus,.select:focus{border-color:#ff263d}.league-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.count{color:#ff6171;font-weight:900}.tools{display:flex;gap:8px}.small{padding:9px 12px;border:1px solid #27364c;border-radius:10px;background:#0a111e;color:#d7e1f0;font-weight:800;cursor:pointer}.sport-group{margin:18px 0}.group-title{color:#718198;font-size:11px;font-weight:950;letter-spacing:1.2px;margin-bottom:9px}.league-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.league{display:flex;align-items:center;gap:9px;text-align:left;padding:13px 12px;border:1px solid #25344a;border-radius:14px;background:#09111d;color:#dbe4f1;font-weight:800;cursor:pointer}.league.on{border-color:#ff263d;background:linear-gradient(135deg,#2a0d14,#11121b);box-shadow:inset 0 0 0 1px rgba(255,38,61,.12)}.check{width:19px;height:19px;border-radius:6px;border:1px solid #34445d;display:grid;place-items:center;color:transparent;font-size:12px}.league.on .check{background:#ff263d;border-color:#ff263d;color:#fff}.emoji{font-size:18px}.summary{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.pill{padding:7px 9px;border-radius:999px;background:#111a29;border:1px solid #25344a;color:#c9d4e4;font-size:11px;font-weight:800}.create{margin-top:17px;width:100%;padding:16px;border:0;border-radius:14px;background:#ff263d;color:#fff;font-size:15px;font-weight:950;cursor:pointer}.create:disabled{opacity:.55}.result{display:none;margin-top:15px;padding:18px;border-radius:18px;background:#06151a;border:1px solid #1e7050}.result a{display:block;color:#8fc5ff;word-break:break-all;line-height:1.5}.qr{width:210px;max-width:100%;margin-top:12px;border-radius:12px;background:#fff;padding:7px}.security{display:flex;gap:9px;align-items:flex-start;color:#8190a6;font-size:12px;line-height:1.45;margin-top:12px}.security strong{color:#dfe7f2}.hide{display:none}.footer{text-align:center;color:#56657b;font-size:11px;margin-top:18px}@media(min-width:760px){.league-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:17px 12px 50px}.hero{padding:23px}.steps{grid-template-columns:1fr}.step:not(.active){display:none}.card{padding:17px}.league-grid{grid-template-columns:1fr}.top{align-items:flex-start}.build{font-size:10px}}
            </style></head><body><main><div class="top"><div class="logo"><b>X</b>SPORTS<b>X</b></div><div class="build">BUILD 8.1.0 • LIVE</div></div><section class="hero"><div class="eyebrow">PRIVATE SPORTS CONNECTION</div><h1>Your IPTV.<br>Built around your sports.</h1><p>Inspired by the guided setup approach used by Sportio Live and the configurable profile model used by Flix-Streams: choose your source, choose the exact leagues you want, then generate one private manifest that syncs across your devices.</p></section><div class="steps"><div class="step active">01 • SOURCE</div><div class="step active">02 • LEAGUES</div><div class="step active">03 • CONNECT</div></div><section class="card"><h2>1. Connect your source</h2><p class="sub">Your Xtream or M3U credentials stay inside your encrypted private configuration.</p><div class="source-tabs"><button id="xtBtn" class="source active" onclick="setSource('xtream')">XTREAM</button><button id="m3Btn" class="source" onclick="setSource('m3u')">M3U / M3U8</button></div><div id="xtFields" class="fields"><input class="input" id="base" autocomplete="url" placeholder="Xtream server URL"><input class="input" id="user" autocomplete="username" placeholder="Username"><input class="input" id="pass" type="password" autocomplete="current-password" placeholder="Password"></div><div id="m3Fields" class="fields hide"><input class="input" id="m3url" placeholder="M3U playlist URL"><input class="input" id="epg" placeholder="EPG URL (optional)"></div></section><section class="card"><div class="league-toolbar"><div><h2>2. Pick your leagues</h2><div class="sub" style="margin:0">Only the leagues you turn on will be put into your private manifest.</div></div><div class="count" id="count">0 selected</div></div><div class="tools"><button class="small" onclick="selectAll()">SELECT ALL</button><button class="small" onclick="clearAll()">CLEAR ALL</button></div>${groupHtml}<div class="summary" id="summary"></div></section><section class="card"><h2>3. Create your private XSportsX</h2><p class="sub">Your credentials are encrypted server-side. The generated manifest is unique to this setup, has no-cache headers, and can be installed on your other devices using the same URL.</p><select class="select" id="tz"><option value="America/New_York">Eastern Time</option><option value="America/Chicago">Central Time</option><option value="America/Denver">Mountain Time</option><option value="America/Los_Angeles">Pacific Time</option><option value="UTC">UTC</option></select><button class="create" id="create" onclick="generate()">CREATE PRIVATE SPORTS CONNECTION</button><div class="result" id="result"></div><div class="security"><span>🔒</span><span><strong>Private by design.</strong> The password is never rendered into the manifest. Keep your private manifest URL private.</span></div></section><div class="footer">XSportsX 8.1.0 • Xtream / M3U • League-selectable • Device sync</div></main><script>
            var src='xtream';
            function setSource(x){src=x;document.getElementById('xtFields').className=x==='xtream'?'fields':'fields hide';document.getElementById('m3Fields').className=x==='m3u'?'fields':'fields hide';document.getElementById('xtBtn').className=x==='xtream'?'source active':'source';document.getElementById('m3Btn').className=x==='m3u'?'source active':'source';}
            function leagues(){return Array.prototype.slice.call(document.querySelectorAll('.league.on')).map(function(x){return x.getAttribute('data-sport');});}
            function toggleLeague(id){var el=document.querySelector('.league[data-sport="'+id+'"]');if(el)el.classList.toggle('on');updateSummary();}
            function selectAll(){document.querySelectorAll('.league').forEach(function(x){x.classList.add('on');});updateSummary();}
            function clearAll(){document.querySelectorAll('.league').forEach(function(x){x.classList.remove('on');});updateSummary();}
            function updateSummary(){var a=leagues();document.getElementById('count').textContent=a.length+' selected';document.getElementById('summary').innerHTML=a.map(function(id){var e=document.querySelector('.league[data-sport="'+id+'"]');return e?'<span class="pill">'+e.textContent.replace('✓','').trim()+'</span>':'';}).join('');document.getElementById('create').disabled=!a.length;}
            async function generate(){var sports=leagues();if(!sports.length){alert('Select at least one league.');return;}var body={source:src,sports:sports,timezone:document.getElementById('tz').value};if(src==='xtream')body.xtream={baseUrl:document.getElementById('base').value,username:document.getElementById('user').value,password:document.getElementById('pass').value};else{body.m3uUrl=document.getElementById('m3url').value;body.epgUrl=document.getElementById('epg').value;}var r=document.getElementById('result');r.style.display='block';r.innerHTML='<b>CONNECTING…</b><p>Validating your source and building the private manifest.</p>';try{var x=await fetch('${b}/configure',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await x.json();if(!x.ok)throw Error(d.error||'Configuration failed');r.innerHTML='<b>✓ XSPORTSX IS READY</b><p><strong>'+sports.length+' leagues locked into this connection.</strong></p><a href="'+d.manifestUrl+'">'+d.manifestUrl+'</a><p>Install this manifest in Nuvio. Use the <strong>same URL</strong> on your other TVs and phones to sync this setup.</p><img class="qr" src="'+d.qrUrl+'" alt="XSportsX QR"><p><button class="small" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+d.manifestUrl+'\')">COPY MANIFEST</button></p>';}catch(e){r.style.borderColor='#8b2732';r.innerHTML='<b>CONNECTION FAILED</b><p>'+e.message+'</p>';}}
            selectAll();
            </script></body></html>`;
          }
          '''
          s = s[:start] + new_setup + s[end:]

          # Ensure selected manifests have a new identity and never fall back to the legacy ID.
          s = s.replace("id:'community.xsportsx'", "id:'community.xsportsx.v8.1'")
          s = s.replace("version:'8.1.0'", "version:'8.1.0'")
          p.write_text(s)

      - name: Validate
        shell: bash
        run: |
          node --check server.js
          node --check bootstrap.js
          ! grep -nE '7\.2\.0|7\.3\.0|7\.4\.0|7\.5\.0|7\.6\.1|8\.0\.0' server.js bootstrap.js

      - name: Commit rebuilt configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild XSportsX 8.1 sports configuration wizard"
          git push
