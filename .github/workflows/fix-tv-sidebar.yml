name: Fix TV sidebar navigation

on:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[tv-sidebar-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire sports sidebar destinations
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/xsportsx/app/TvHome.kt')
          s = p.read_text()
          target = '                    "SETTINGS" -> TvSettings(onConnect)'
          cases = '''                    "NFL", "NCAA FB", "NBA", "WNBA", "NCAA BB", "MLB", "NHL", "MLS", "EPL" -> {\n                        TvSection(selectedNav, "LIVE FEED")\n                        val games = liveGames.filter { it.league == selectedNav }\n                        if (games.isNotEmpty()) TvGameRow(games, onNetwork) else TvLiveEmpty(false)\n                    }\n                    "UFC", "BOXING" -> {\n                        TvSection(selectedNav, "EVENT FEED")\n                        TvSportRow(tvSports.filter { it.name == selectedNav }) { sport -> onNetwork(sport.name) }\n                        Spacer(Modifier.height(14.dp))\n                        TvEmpty("Select ${selectedNav} to browse available events")\n                    }\n'''
          if target not in s:
              raise SystemExit('SETTINGS navigation target not found; refusing to modify source.')
          if '"NFL", "NCAA FB", "NBA", "WNBA", "NCAA BB", "MLB", "NHL", "MLS", "EPL" ->' not in s:
              s = s.replace(target, cases + target, 1)
          p.write_text(s)
      - name: Validate Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"NFL", "NCAA FB", "NBA", "WNBA", "NCAA BB", "MLB", "NHL", "MLS", "EPL" ->' app/src/main/java/com/xsportsx/app/TvHome.kt
          grep -q '"UFC", "BOXING" ->' app/src/main/java/com/xsportsx/app/TvHome.kt
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xsportsx/app/TvHome.kt
          git diff --cached --quiet && exit 0
          git commit -m "Wire TV sidebar sports navigation [tv-sidebar-patched]"
          git push