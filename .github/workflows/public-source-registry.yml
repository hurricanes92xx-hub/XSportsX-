name: Public Source Registry Mirror

on:
  push:
    branches: [main]
    paths:
      - 'public-sources-registry.json'
      - '.github/workflows/public-source-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync GitHub Pages payload
        run: cp public-sources-registry.json docs/public-sources-registry.json
      - name: Commit mirror when changed
        run: |
          if git diff --quiet -- docs/public-sources-registry.json; then
            echo "Mirror already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public-sources-registry.json
          git commit -m "Sync static public source registry mirror"
          git push
