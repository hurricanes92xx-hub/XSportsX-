name: Enforce Weekly Wrestling Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: [Refresh Canonical Sports Schedule]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  queue: max
  cancel-in-progress: false

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical schedule
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: android-app
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enforce weekly wrestling programming
        run: python3 scripts/enforce_wrestling_weekly_schedule.py
      - name: Normalize schedule contract
        run: python3 scripts/normalize_schedule_feed.py
      - name: Validate schedule integrity
        run: python3 scripts/validate_schedule_integrity.py
      - name: Publish wrestling schedule repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XSportsX Schedule Bot'
          git config user.email 'xsportsx-schedule-bot@users.noreply.github.com'
          git add data/schedule_feed.json
          if git diff --cached --quiet; then
            echo 'Weekly wrestling schedule already complete.'
            exit 0
          fi
          git commit -m 'chore: enforce weekly wrestling schedule'
          for attempt in 1 2 3 4 5; do
            git fetch origin android-app
            if git rebase --autostash origin/android-app; then
              if git push origin HEAD:android-app; then
                echo "Weekly wrestling schedule published on attempt ${attempt}."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --mixed origin/android-app
              git add data/schedule_feed.json
              if ! git diff --cached --quiet; then git commit -m 'chore: republish weekly wrestling schedule'; fi
            fi
            sleep $((attempt * 2))
          done
          exit 1
