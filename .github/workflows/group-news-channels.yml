name: Group Sports News Channels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-news-channels.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix grouped news routing
        shell: python
        run: |
          from pathlib import Path
          p=Path('sports-router.js')
          s=p.read_text()
          s=s.replace('idPrefixes:["sport:","xtream:"]','idPrefixes:["sport:","xtream:","news:"]')
          marker='if(id.startsWith("xtream:")){if(!c)return json(res,{meta:null},401);'
          replacement='if(id.startsWith("news:")){if(!c)return json(res,{meta:null},401);const d=await xtreamData(c),m=d.newsGroups.find(x=>x.id===id)||null;return json(res,{meta:m},m?200:404);}if(id.startsWith("xtream:")){if(!c)return json(res,{meta:null},401);'
          if 'id.startsWith("news:")' not in s and marker in s:
            s=s.replace(marker,replacement,1)
          marker2='if(id.startsWith("xtream:")){if(!c)return json(res,{streams:[]},401);'
          replacement2='if(id.startsWith("news:")){if(!c)return json(res,{streams:[]},401);const d=await xtreamData(c),group=d.newsGroups.find(x=>x.id===id);if(!group)return json(res,{streams:[]},404);const streams=d.metas.filter(m=>newsGroupFor(m.name,m.xtream?.category)===group.newsGroup).map(m=>({name:`▶ ${m.name}`,url:m.xtream.streamUrl,title:m.name,description:m.xtream.category}));return json(res,{streams});}if(id.startsWith("xtream:")){if(!c)return json(res,{streams:[]},401);'
          if s.count('id.startsWith("news:")')<2 and marker2 in s:
            s=s.replace(marker2,replacement2,1)
          s=s.replace('idPrefixes:["sport:","xtream:"]','idPrefixes:["sport:","xtream:","news:"]')
          s=s.replace('const VERSION = "5.0.4";','const VERSION = "5.0.5";')
          s=s.replace('const ADDON_ID = "com.xsportsx.sports.epg.v504";','const ADDON_ID = "com.xsportsx.sports.epg.v505";')
          s=s.replace('const PREFIX = "/v504";','const PREFIX = "/v505";')
          p.write_text(s)
          q=Path('render-proxy.js')
          r=q.read_text()
          r=r.replace('PREFIX="v504",COMPAT_PREFIXES=["v504","v503","v502","v501","v500"]','PREFIX="v505",COMPAT_PREFIXES=["v505","v504","v503","v502","v501","v500"]')
          q.write_text(r)
      - name: Validate JavaScript
        run: |
          node --check sports-router.js
          node --check render-proxy.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-router.js render-proxy.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: resolve grouped sports news meta and streams'
          git push