name: Reconcile live schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xsportsx-schedule-refresh
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: android-app
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile live and final status
        run: python scripts/reconcile_live_status.py
      - name: Record provider health and freshness
        run: python scripts/provider_health.py
      - name: Validate live feed integrity
        run: python scripts/validate_schedule_refresh.py
      - name: Publish live state safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule_feed.json data/provider_health.json
          git diff --cached --quiet || git commit -m 'chore: refresh live schedule state'
          refresh_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git fetch origin android-app
            git reset --hard origin/android-app
            git checkout "$refresh_commit" -- data/schedule_feed.json data/provider_health.json
            git add data/schedule_feed.json data/provider_health.json
            git diff --cached --quiet || git commit -m 'chore: refresh live schedule state'
            if git push origin HEAD:android-app; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish live state after three race-safe retries' >&2
          exit 1
