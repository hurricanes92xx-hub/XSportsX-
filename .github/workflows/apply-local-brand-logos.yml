name: Apply Local Brand Logos

on:
  push:
    branches: [android-app]
    paths:
      - 'scripts/apply_local_brand_logos.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-app
      - name: Apply bundled logo renderer
        run: python3 scripts/apply_local_brand_logos.py
      - name: Commit UI logo wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHomeUltimate.kt; then
            echo 'Logo renderer already wired.'
            exit 0
          fi
          git config user.name 'XSportsX Bot'
          git config user.email 'xsportsx-bot@users.noreply.github.com'
          git add app/src/main/java/com/xsportsx/app/FuturisticSports.kt app/src/main/java/com/xsportsx/app/TvHomeUltimate.kt
          git commit -m 'fix: wire bundled XSportsX logos into Mobile and TV cards'
          git push origin HEAD:android-app
