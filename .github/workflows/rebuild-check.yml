name: XSportsX rebuild check

on:
  push:
    branches: [xsportsx-rebuild]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm run check
      - run: docker build -t xsportsx-test .
