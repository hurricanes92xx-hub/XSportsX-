<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSportsX</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span>SPORTS</span><b>EX</b></div>
    <div class="pill">NUVIO SPORTS ENGINE</div>
  </header>
  <main>
    <section class="hero">
      <div>
        <div class="eyebrow">LIVE SPORTS • MULTI-SOURCE</div>
        <h1>Your games.<br><span>Your way.</span></h1>
        <p>Fast event discovery, clean matchup art, resilient source ranking, and authorized IPTV/direct feeds.</p>
        <a href="/manifest.json" class="button">VIEW MANIFEST</a>
      </div>
      <div class="orb"></div>
    </section>
    <section>
      <div class="section-title">ENGINE STATUS</div>
      <pre id="health">Loading…</pre>
    </section>
  </main>
</div>
<script>
fetch('/health').then(r=>r.json()).then(x=>document.querySelector('#health').textContent=JSON.stringify(x,null,2))
.catch(()=>document.querySelector('#health').textContent='XSportsX is running.');
</script>
</body>
</html>
